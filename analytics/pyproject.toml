[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "football-intelligence-analytics"
version = "0.1.0"
description = "Batch ingestion and analytics for Football Intelligence."
requires-python = ">=3.13,<3.14"
dependencies = [
  "psycopg[binary]>=3.3,<4",
]

[project.scripts]
football-intelligence-audit = "football_intelligence.jobs.audit_provider:main"
football-intelligence-sync = "football_intelligence.jobs.sync_core_leagues:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL DATABASE_URL",
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["football_intelligence"]

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]
