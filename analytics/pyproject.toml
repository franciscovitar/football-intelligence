[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "football-intelligence-analytics"
version = "0.1.0"
description = "Batch ingestion and analytics for Football Intelligence."
requires-python = ">=3.13,<3.14"
dependencies = [
  "psycopg[binary]>=3.3,<4",
]

[project.scripts]
football-intelligence-audit = "football_intelligence.jobs.audit_provider:main"
football-intelligence-sync = "football_intelligence.jobs.sync_core_leagues:main"
football-intelligence-player-analytics = "football_intelligence.jobs.calculate_player_analytics:main"
football-intelligence-team-analytics = "football_intelligence.jobs.calculate_team_analytics:main"
football-intelligence-meta-analytics = "football_intelligence.jobs.calculate_meta_analytics:main"
football-intelligence-perception-ingest = "football_intelligence.jobs.ingest_perception:main"
football-intelligence-rating-analytics = "football_intelligence.jobs.calculate_rating_intelligence:main"
football-intelligence-tactical-analytics = "football_intelligence.jobs.calculate_tactical_intelligence:main"
football-intelligence-world-radar = "football_intelligence.jobs.sync_world_radar:main"
football-intelligence-validate-v1 = "football_intelligence.jobs.validate_v1:main"
football-intelligence-data-mesh-poc = "football_intelligence.jobs.run_data_mesh_poc:main"
football-intelligence-zero-cost-coverage = "football_intelligence.jobs.run_zero_cost_coverage:main"
football-intelligence-collect-real-snapshot = "football_intelligence.jobs.collect_real_snapshot:main"
football-intelligence-load-real-snapshot = "football_intelligence.jobs.load_real_snapshot:main"
football-intelligence-collect-validation-snapshot = "football_intelligence.jobs.collect_validation_snapshot:main"
football-intelligence-score-real-snapshot = "football_intelligence.jobs.score_real_snapshot:main"
football-intelligence-build-real-snapshot-v2 = "football_intelligence.jobs.build_real_snapshot_v2:main"
football-intelligence-execute-real-intelligence-v2 = "football_intelligence.jobs.execute_real_intelligence_v2:main"
football-intelligence-preflight-production = "football_intelligence.jobs.preflight_production_state:main"
football-intelligence-probe-wyscout-open = "football_intelligence.jobs.probe_wyscout_open:main"
football-intelligence-load-wyscout-historical = "football_intelligence.jobs.load_wyscout_historical:main"
football-intelligence-audit-wyscout-mapping = "football_intelligence.jobs.audit_wyscout_metric_mapping:main"
football-intelligence-audit-wyscout-adapter = "football_intelligence.jobs.audit_wyscout_adapter:main"
football-intelligence-audit-wyscout-core-leagues = "football_intelligence.jobs.audit_wyscout_core_leagues:main"
football-intelligence-audit-wyscout-spatial-v1 = "football_intelligence.jobs.audit_wyscout_spatial_v1:main"
football-intelligence-fetch-statsbomb-open = "football_intelligence.jobs.fetch_statsbomb_open:main"
football-intelligence-audit-statsbomb-mapping = "football_intelligence.jobs.audit_statsbomb_mapping:main"
football-intelligence-audit-statsbomb-adapter = "football_intelligence.jobs.audit_statsbomb_adapter:main"
football-intelligence-audit-wyscout-statsbomb-overlap = "football_intelligence.jobs.audit_wyscout_statsbomb_overlap:main"
football-intelligence-validate-static-snapshot = "football_intelligence.jobs.validate_static_snapshot:main"
football-intelligence-collect-wikidata-profiles = "football_intelligence.jobs.collect_wikidata_profiles:main"
football-intelligence-audit-wikidata-profiles = "football_intelligence.jobs.audit_wikidata_profiles:main"
football-intelligence-audit-wyscout-wikidata-overlap = "football_intelligence.jobs.audit_wyscout_wikidata_overlap:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL DATABASE_URL",
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["football_intelligence"]

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]
