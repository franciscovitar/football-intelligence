name: Wikipedia ARG_LPF 2024 roster lab

on:
  push:
    branches:
      - lab/wikipedia-arg-lpf-2024-roster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Measure immutable historical Wikipedia roster evidence
        env:
          USER_AGENT: FootballIntelligenceRosterLab/0.2 (https://github.com/franciscovitar/football-intelligence)
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import unicodedata
          import urllib.parse
          import urllib.request

          API = "https://en.wikipedia.org/w/api.php"
          UA = os.environ["USER_AGENT"]
          SNAPSHOTS = [
              "2024-05-10T23:59:59Z",
              "2024-07-15T23:59:59Z",
              "2024-09-06T23:59:59Z",
              "2024-12-16T23:59:59Z",
          ]
          CLUBS = [
              ("Argentinos Juniors", "Argentinos Juniors", 32),
              ("Atlético Tucumán", "Atlético Tucumán", 29),
              ("Banfield", "Club Atlético Banfield", 43),
              ("Barracas Central", "Barracas Central", 34),
              ("Belgrano", "Club Atlético Belgrano", 35),
              ("Boca Juniors", "Boca Juniors", 39),
              ("Central Córdoba (SE)", "Central Córdoba de Santiago del Estero", 44),
              ("Defensa y Justicia", "Defensa y Justicia", 37),
              ("Deportivo Riestra", "Deportivo Riestra", 36),
              ("Estudiantes de La Plata", "Estudiantes de La Plata", 37),
              ("Gimnasia La Plata", "Gimnasia y Esgrima de La Plata", 39),
              ("Godoy Cruz", "Godoy Cruz Antonio Tomba", 40),
              ("Huracán", "Club Atlético Huracán", 29),
              ("Independiente", "Club Atlético Independiente", 33),
              ("Independiente Rivadavia", "Independiente Rivadavia", 38),
              ("Instituto", "Instituto Atlético Central Córdoba", 26),
              ("Lanús", "Club Atlético Lanús", 34),
              ("Newell's Old Boys", "Newell's Old Boys", 43),
              ("Platense", "Club Atlético Platense", 35),
              ("Racing Club", "Racing Club de Avellaneda", 32),
              ("River Plate", "Club Atlético River Plate", 37),
              ("Rosario Central", "Rosario Central", 36),
              ("San Lorenzo", "San Lorenzo de Almagro", 38),
              ("Sarmiento", "Sarmiento de Junín", 37),
              ("Talleres de Córdoba", "Talleres de Córdoba", 34),
              ("Tigre", "Club Atlético Tigre", 35),
              ("Unión Santa Fe", "Unión de Santa Fe", 28),
              ("Vélez Sarsfield", "Vélez Sarsfield", 33),
          ]

          def api(params):
              params = dict(params)
              params.update({"format": "json", "formatversion": "2", "maxlag": "5"})
              url = API + "?" + urllib.parse.urlencode(params)
              last_error = None
              for attempt in range(3):
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f"MediaWiki request failed: {last_error}")

          def historical_revision(title, timestamp):
              data = api({
                  "action": "query",
                  "prop": "revisions",
                  "titles": title,
                  "rvprop": "ids|timestamp|content",
                  "rvslots": "main",
                  "rvlimit": "1",
                  "rvstart": timestamp,
                  "rvdir": "older",
                  "redirects": "1",
              })
              page = data["query"]["pages"][0]
              if page.get("missing"):
                  return None, page.get("title", title)
              revisions = page.get("revisions") or []
              if not revisions:
                  return None, page.get("title", title)
              rev = revisions[0]
              slot = (rev.get("slots") or {}).get("main") or {}
              content = slot.get("content")
              if content is None:
                  content = rev.get("content") or rev.get("*")
              if content is None:
                  raise RuntimeError(f"No wikitext content for {title} revision {rev.get('revid')}")
              return {"revid": rev.get("revid"), "timestamp": rev.get("timestamp"), "wikitext": content}, page.get("title", title)

          def strip_markup(value):
              value = re.sub(r"<ref\b[^>]*>.*?</ref>|<ref\b[^>]*/>", "", value, flags=re.I | re.S)
              value = re.sub(r"\[\[([^\]|]+)\|([^\]]+)\]\]", r"\2", value)
              value = re.sub(r"\[\[([^\]]+)\]\]", r"\1", value)
              value = re.sub(r"'{2,5}", "", value)
              value = re.sub(r"\{\{[^{}]*\}\}", "", value)
              value = re.sub(r"<!--.*?-->", "", value, flags=re.S)
              value = unicodedata.normalize("NFKC", value)
              value = re.sub(r"\s+", " ", value).strip(" *†‡\n\t")
              return value

          def section_candidates(wikitext):
              heading_re = re.compile(r"(?m)^(={2,4})\s*(.*?)\s*\1\s*$")
              headings = list(heading_re.finditer(wikitext))
              sections = []
              for idx, match in enumerate(headings):
                  title = strip_markup(match.group(2))
                  if not re.search(r"\b(current squad|first[- ]team squad|squad|players)\b", title, flags=re.I):
                      continue
                  level = len(match.group(1))
                  end = len(wikitext)
                  for later in headings[idx + 1:]:
                      if len(later.group(1)) <= level:
                          end = later.start()
                          break
                  sections.append((title, wikitext[match.end():end]))
              return sections

          PLAYER_TEMPLATE_RE = re.compile(
              r"\{\{\s*(?:fs player|football squad player\d*|football squad player)\b(.*?)\}\}",
              flags=re.I | re.S,
          )

          def extract_names_from_section(section):
              names = []
              for block in PLAYER_TEMPLATE_RE.findall(section):
                  name_match = re.search(r"(?:^|\|)\s*name\s*=\s*(.*?)(?=(?:\n?\s*\|\s*[A-Za-z0-9_ -]+\s*=)|$)", block, flags=re.I | re.S)
                  if name_match:
                      candidate = strip_markup(name_match.group(1))
                  else:
                      links = re.findall(r"\[\[([^\]]+)\]\]", block)
                      candidate = strip_markup(links[-1] if links else "")
                  if candidate and len(candidate) <= 100:
                      names.append(candidate)
              return sorted(set(names))

          def extract_immutable_squad(wikitext):
              candidates = []
              for heading, section in section_candidates(wikitext):
                  names = extract_names_from_section(section)
                  transclusions = sorted(set(re.findall(r"\{\{\s*([^{}|\n]*(?:squad|players)[^{}|\n]*)", section, flags=re.I)))
                  candidates.append({
                      "heading": heading,
                      "players": names,
                      "possible_squad_transclusions": transclusions,
                      "has_inline_player_templates": bool(names),
                  })
              inline = [item for item in candidates if item["players"]]
              if inline:
                  inline.sort(key=lambda item: len(item["players"]), reverse=True)
                  return inline[0], candidates
              return None, candidates

          report = {
              "source": "English Wikipedia immutable historical revision wikitext via MediaWiki Action API",
              "licence": "Wikipedia text reuse subject to Wikimedia Terms / CC BY-SA attribution-sharealike requirements",
              "temporal_safety": "Rendered oldid output is not used because MediaWiki transclusions are not versioned. Only player rows contained in the exact historical article revision count as roster evidence.",
              "snapshots": SNAPSHOTS,
              "clubs": [],
          }

          for club, title, official_used in CLUBS:
              result = {"club": club, "requested_title": title, "official_lpf_players_used": official_used, "snapshots": []}
              union = set()
              resolved_title = title
              for target in SNAPSHOTS:
                  try:
                      rev, resolved_title = historical_revision(title, target)
                      if not rev:
                          result["snapshots"].append({"target": target, "error": "page_or_revision_missing"})
                          continue
                      selected, candidates = extract_immutable_squad(rev["wikitext"])
                      if not selected:
                          result["snapshots"].append({
                              "target": target,
                              "revision": {"revid": rev["revid"], "timestamp": rev["timestamp"]},
                              "error": "no_inline_historical_squad_evidence",
                              "candidate_sections": candidates,
                          })
                          continue
                      union.update(selected["players"])
                      result["snapshots"].append({
                          "target": target,
                          "revision": {"revid": rev["revid"], "timestamp": rev["timestamp"]},
                          "heading": selected["heading"],
                          "players_count": len(selected["players"]),
                          "players": selected["players"],
                          "possible_squad_transclusions": selected["possible_squad_transclusions"],
                      })
                  except Exception as exc:
                      result["snapshots"].append({"target": target, "error": f"request_or_parse_failed:{type(exc).__name__}:{exc}"})
                  time.sleep(0.15)
              result["resolved_title"] = resolved_title
              result["union_players_count"] = len(union)
              result["union_players"] = sorted(union)
              result["difference_vs_lpf_used"] = len(union) - official_used
              result["ratio_vs_lpf_used"] = round(len(union) / official_used, 4) if official_used else None
              report["clubs"].append(result)
              print(f"{club:28} immutable_union={len(union):3} lpf_used={official_used:2} diff={len(union)-official_used:+3}")

          usable = [c for c in report["clubs"] if c["union_players_count"] > 0]
          within_20 = [c for c in usable if abs(c["union_players_count"] - c["official_lpf_players_used"]) / c["official_lpf_players_used"] <= 0.20]
          report["aggregate"] = {
              "clubs_total": len(CLUBS),
              "clubs_with_immutable_inline_squad_evidence": len(usable),
              "clubs_without_immutable_inline_squad_evidence": len(CLUBS) - len(usable),
              "clubs_within_20pct_of_lpf_used_count": len(within_20),
              "immutable_union_rows_sum": sum(c["union_players_count"] for c in usable),
              "official_lpf_player_usages_sum_all_clubs": sum(c["official_lpf_players_used"] for c in report["clubs"]),
              "official_lpf_player_usages_sum_usable_clubs": sum(c["official_lpf_players_used"] for c in usable),
          }

          with open("wikipedia-arg-lpf-2024-roster-lab.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
          print(json.dumps(report["aggregate"], indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-lpf-2024-roster-lab-${{ github.run_id }}
          path: wikipedia-arg-lpf-2024-roster-lab.json
          retention-days: 30
