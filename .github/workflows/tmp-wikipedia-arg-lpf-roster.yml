name: Wikipedia ARG_LPF 2024 roster lab

on:
  push:
    branches:
      - lab/wikipedia-arg-lpf-2024-roster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Install bounded parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Measure historical English Wikipedia squad snapshots
        env:
          USER_AGENT: FootballIntelligenceRosterLab/0.1 (https://github.com/franciscovitar/football-intelligence)
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from bs4 import BeautifulSoup

          API = "https://en.wikipedia.org/w/api.php"
          UA = os.environ["USER_AGENT"]
          SNAPSHOTS = [
              "2024-05-10T23:59:59Z",
              "2024-07-15T23:59:59Z",
              "2024-09-06T23:59:59Z",
              "2024-12-16T23:59:59Z",
          ]
          CLUBS = [
              ("Argentinos Juniors", "Argentinos Juniors", 32),
              ("Atlético Tucumán", "Atlético Tucumán", 29),
              ("Banfield", "Club Atlético Banfield", 43),
              ("Barracas Central", "Barracas Central", 34),
              ("Belgrano", "Club Atlético Belgrano", 35),
              ("Boca Juniors", "Boca Juniors", 39),
              ("Central Córdoba (SE)", "Central Córdoba de Santiago del Estero", 44),
              ("Defensa y Justicia", "Defensa y Justicia", 37),
              ("Deportivo Riestra", "Deportivo Riestra", 36),
              ("Estudiantes de La Plata", "Estudiantes de La Plata", 37),
              ("Gimnasia La Plata", "Gimnasia y Esgrima de La Plata", 39),
              ("Godoy Cruz", "Godoy Cruz Antonio Tomba", 40),
              ("Huracán", "Club Atlético Huracán", 29),
              ("Independiente", "Club Atlético Independiente", 33),
              ("Independiente Rivadavia", "Independiente Rivadavia", 38),
              ("Instituto", "Instituto Atlético Central Córdoba", 26),
              ("Lanús", "Club Atlético Lanús", 34),
              ("Newell's Old Boys", "Newell's Old Boys", 43),
              ("Platense", "Club Atlético Platense", 35),
              ("Racing Club", "Racing Club de Avellaneda", 32),
              ("River Plate", "Club Atlético River Plate", 37),
              ("Rosario Central", "Rosario Central", 36),
              ("San Lorenzo", "San Lorenzo de Almagro", 38),
              ("Sarmiento", "Sarmiento de Junín", 37),
              ("Talleres de Córdoba", "Talleres de Córdoba", 34),
              ("Tigre", "Club Atlético Tigre", 35),
              ("Unión Santa Fe", "Unión de Santa Fe", 28),
              ("Vélez Sarsfield", "Vélez Sarsfield", 33),
          ]

          def api(params):
              params = dict(params)
              params.update({"format": "json", "formatversion": "2", "maxlag": "5"})
              url = API + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              last_error = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f"MediaWiki request failed: {last_error}")

          def normalize_name(value):
              value = unicodedata.normalize("NFKC", value)
              value = re.sub(r"\[[^\]]+\]", "", value)
              value = re.sub(r"\([^)]*(captain|vice-captain|loan)[^)]*\)", "", value, flags=re.I)
              value = re.sub(r"\s+", " ", value).strip(" *†‡\n\t")
              return value

          def revision_at_or_before(title, timestamp):
              data = api({
                  "action": "query",
                  "prop": "revisions",
                  "titles": title,
                  "rvprop": "ids|timestamp",
                  "rvslots": "main",
                  "rvlimit": "1",
                  "rvstart": timestamp,
                  "rvdir": "older",
                  "redirects": "1",
              })
              page = data["query"]["pages"][0]
              if page.get("missing"):
                  return None, page.get("title", title)
              revisions = page.get("revisions") or []
              if not revisions:
                  return None, page.get("title", title)
              return revisions[0], page.get("title", title)

          def parse_html(oldid):
              data = api({
                  "action": "parse",
                  "oldid": str(oldid),
                  "prop": "text",
                  "disableeditsection": "1",
              })
              return data["parse"]["text"]

          def header_level(tag):
              try:
                  return int(tag.name[1])
              except Exception:
                  return 7

          def extract_player_sections(html):
              soup = BeautifulSoup(html, "html.parser")
              candidates = []
              section_re = re.compile(r"\b(current squad|first[- ]team squad|squad|players)\b", re.I)
              for heading in soup.find_all(re.compile(r"^h[2-4]$")):
                  heading_text = " ".join(heading.stripped_strings)
                  if not section_re.search(heading_text):
                      continue
                  level = header_level(heading)
                  players = []
                  tables_seen = 0
                  for node in heading.find_all_next():
                      if node is heading:
                          continue
                      if getattr(node, "name", None) and re.match(r"^h[2-4]$", node.name):
                          if header_level(node) <= level:
                              break
                      if getattr(node, "name", None) != "table":
                          continue
                      headers = [" ".join(cell.stripped_strings).strip().lower() for cell in node.find_all("th")]
                      if not any(h == "player" or h.endswith(" player") for h in headers):
                          continue
                      tables_seen += 1
                      for row in node.find_all("tr"):
                          cells = row.find_all(["td", "th"], recursive=False)
                          if not cells:
                              continue
                          texts = [" ".join(cell.stripped_strings).strip() for cell in cells]
                          if "player" in [t.lower() for t in texts]:
                              continue
                          player_cell = cells[-1] if len(cells) >= 2 else None
                          if player_cell is None:
                              continue
                          name = normalize_name(" ".join(player_cell.stripped_strings))
                          if not name or name.lower() in {"player", "name"} or len(name) > 80:
                              continue
                          players.append(name)
                  unique = sorted(set(players))
                  if unique:
                      candidates.append({"heading": heading_text, "players": unique, "tables_seen": tables_seen})
              if not candidates:
                  return None
              candidates.sort(key=lambda item: (len(item["players"]), item["tables_seen"]), reverse=True)
              return candidates[0]

          report = {
              "source": "English Wikipedia historical revisions via MediaWiki Action API",
              "licence": "Wikipedia text reuse subject to Wikimedia Terms / CC BY-SA attribution-sharealike requirements",
              "snapshots": SNAPSHOTS,
              "clubs": [],
          }

          for club, title, official_used in CLUBS:
              club_result = {"club": club, "requested_title": title, "official_lpf_players_used": official_used, "snapshots": []}
              union = set()
              resolved_title = title
              for timestamp in SNAPSHOTS:
                  revision, resolved_title = revision_at_or_before(title, timestamp)
                  if not revision:
                      club_result["snapshots"].append({"target": timestamp, "error": "page_or_revision_missing"})
                      continue
                  try:
                      section = extract_player_sections(parse_html(revision["revid"]))
                  except Exception as exc:
                      club_result["snapshots"].append({"target": timestamp, "revision": revision, "error": f"parse_failed:{type(exc).__name__}:{exc}"})
                      continue
                  if not section:
                      club_result["snapshots"].append({"target": timestamp, "revision": revision, "error": "no_squad_section_detected"})
                      continue
                  players = section["players"]
                  union.update(players)
                  club_result["snapshots"].append({"target": timestamp, "revision": revision, "heading": section["heading"], "players_count": len(players), "players": players})
                  time.sleep(0.15)
              club_result["resolved_title"] = resolved_title
              club_result["union_players_count"] = len(union)
              club_result["union_players"] = sorted(union)
              club_result["difference_vs_lpf_used"] = len(union) - official_used
              club_result["ratio_vs_lpf_used"] = round(len(union) / official_used, 4) if official_used else None
              report["clubs"].append(club_result)
              print(f"{club:28} wiki_union={len(union):3} lpf_used={official_used:2} diff={len(union)-official_used:+3}")

          usable = [c for c in report["clubs"] if c["union_players_count"] > 0]
          exact = [c for c in usable if c["union_players_count"] == c["official_lpf_players_used"]]
          within_20pct = [c for c in usable if abs(c["union_players_count"] - c["official_lpf_players_used"]) / c["official_lpf_players_used"] <= 0.20]
          report["aggregate"] = {
              "clubs_total": len(CLUBS),
              "clubs_with_detected_squad_evidence": len(usable),
              "clubs_exact_count_match_to_lpf_used": len(exact),
              "clubs_within_20pct_of_lpf_used": len(within_20pct),
              "wiki_union_player_rows_sum": sum(c["union_players_count"] for c in usable),
              "official_lpf_player_usages_sum": sum(c["official_lpf_players_used"] for c in report["clubs"]),
          }

          with open("wikipedia-arg-lpf-2024-roster-lab.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
          print(json.dumps(report["aggregate"], indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-lpf-2024-roster-lab-${{ github.run_id }}
          path: wikipedia-arg-lpf-2024-roster-lab.json
          retention-days: 30
