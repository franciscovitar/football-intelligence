name: Temporary Wikidata Evidence Docs Update

on:
  push:
    branches:
      - docs/wikidata-eng-profile-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Apply exact documentation updates
        run: |
          python - <<'PY'
          from pathlib import Path

          multi = Path('docs/MULTI_SOURCE_PLAYER_EXPANSION.md')
          text = multi.read_text(encoding='utf-8')
          old = '''| Wikidata structured data | six-league identity/profile corroboration and club-career context | current structured data is CC0; bounded known-QID static snapshot foundation selected for first profile fusion lab; no automatic crosswalk or performance role |'''
          new = '''| Wikidata structured data | six-league identity/profile corroboration and club-career context | current structured data is CC0; ENG_PL 2017/18 real fusion lab + bounded 50-QID snapshot verified; no automatic crosswalk, no performance role, and no six-league coverage claim yet |'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''This foundation does **not** claim measured six-league coverage yet. The next\nevidence gate is a real bounded snapshot/audit for one competition before any\ncrosswalk or product promotion decision.\n'''
          new = '''This foundation does **not** claim measured six-league coverage. The first real\ncompetition gate is now complete for `ENG_PL` 2017/18: all 20 clubs resolved,\n373/599 source profiles produced exact+unique Wikidata candidates, and a bounded\n50-QID immutable snapshot passed checksum/profile audit. Of the 599 Wyscout\nprofiles, 368 pairs remained correctly `review_required`, 5 were\n`insufficient_evidence`, and 226 had no exact-name candidate. The durable summary\nis `docs/audits/wikidata-eng-pl-profile-fusion-2017-18.json`. No crosswalk or\nproduct/database promotion was performed. The next evidence gate is expansion to\nanother supported core competition, with `ARG_LPF` prioritized because Wyscout\nOpen does not provide the same historical deep-player path there.\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''Steps 1-3 now have an implementation checkpoint: Wikidata is the first selected\nprofile source. Step 4 remains deliberately unclaimed until a real bounded\nsnapshot is acquired and audited outside the repository.\n'''
          new = '''Steps 1-7 now have an empirical checkpoint for the first fusion laboratory,\n`ENG_PL` 2017/18. The raw 50-entity snapshot remains outside the repository; only\nthe compact audit summary is committed. Step 8 (coverage/conflict review at wider\nscope) and expansion to the remaining supported competitions are still open.\nWikidata remains profile/corroboration evidence only and cannot bypass the shared-\ncanonical-match crosswalk requirement.\n'''
          assert old in text
          text = text.replace(old, new, 1)
          multi.write_text(text, encoding='utf-8')

          sources = Path('docs/SOURCES.md')
          text = sources.read_text(encoding='utf-8')
          old = '''| Wikidata structured data | Wikidata's current licensing page states that structured data in the main/property/lexeme namespaces is released under CC0 1.0 | Yes, bounded | Yes (CC0) | Official `Special:EntityData/<QID>.json` Linked Data interface for an explicit small list of already-known QIDs; Football Intelligence caps one collection run at 50 entities | Player identity/profile corroboration only. The foundation preserves labels, DOB precision, citizenship/position QIDs and temporally qualified P54 team memberships; no performance metrics and no measured six-league coverage claim yet | Approved for bounded static profile-snapshot acquisition; candidate evidence only, no automatic player crosswalk or production promotion |'''
          new = '''| Wikidata structured data | Wikidata's current licensing page states that structured data in the main/property/lexeme namespaces is released under CC0 1.0 | Yes, bounded | Yes (CC0) | Official `Special:EntityData/<QID>.json` Linked Data interface for an explicit small list of already-known QIDs; Football Intelligence caps one collection run at 50 entities | Player identity/profile corroboration only. ENG_PL 2017/18 lab: 20/20 clubs resolved and 373 exact+unique candidates across 599 Wyscout source profiles; bounded 50-QID snapshot audited 50/50 labels, exact DOB, citizenship and position. No performance metrics and no measured six-league coverage claim | Approved for bounded static profile-snapshot acquisition; candidate evidence only, no automatic player crosswalk or production promotion |'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''- Wikidata: no repository-committed or production-promoted player snapshot is\n  claimed by the foundation. `football-intelligence-collect-wikidata-profiles`\n  writes only a caller-selected local snapshot plus the generic checksum\n  manifest; `football-intelligence-audit-wikidata-profiles` verifies those\n  frozen bytes before any later identity review.\n'''
          new = '''- Wikidata: real `ENG_PL` 2017/18 profile-fusion evidence is recorded in\n  `docs/audits/wikidata-eng-pl-profile-fusion-2017-18.json`. The verified run\n  resolved 20/20 clubs, produced 373 exact+unique profile candidates and then\n  froze/audited a bounded 50-QID local snapshot. The raw entity JSON remains\n  outside the repository; no snapshot or candidate was production-promoted and\n  no automatic crosswalk was created.\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''- `https://www.wikidata.org/wiki/Help:Dates`\n'''
          new = '''- `https://www.wikidata.org/wiki/Help:Dates`\n- `https://www.mediawiki.org/wiki/Wikimedia_APIs/Rate_limits`\n'''
          assert old in text
          text = text.replace(old, new, 1)
          sources.write_text(text, encoding='utf-8')
          PY

      - name: Verify durable evidence JSON and changed docs
        run: |
          python -m json.tool docs/audits/wikidata-eng-pl-profile-fusion-2017-18.json >/dev/null
          git diff --check
          grep -F '373/599' docs/MULTI_SOURCE_PLAYER_EXPANSION.md
          grep -F '373 exact+unique' docs/SOURCES.md

      - name: Commit documentation changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MULTI_SOURCE_PLAYER_EXPANSION.md docs/SOURCES.md
          git commit -m "docs: record real Wikidata profile fusion checkpoint"
          git push origin HEAD:docs/wikidata-eng-profile-evidence
