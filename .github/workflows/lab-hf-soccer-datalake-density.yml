# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab HF soccer data lake player semantics

on:
  push:
    branches:
      - lab/hf-soccer-datalake-player-density

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb

      - name: Download public parquet tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lab_hf
          base='https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main'
          for table in leagues fixtures fixture_players fixture_players_stats_flat; do
            curl --fail --location --silent --show-error --retry 2 \
              "${base}/${table}.parquet" --output ".lab_hf/${table}.parquet"
            test -s ".lab_hf/${table}.parquet"
          done

      - name: Measure Argentina gaps and appearance semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import duckdb

          con = duckdb.connect()
          con.execute('PRAGMA threads=4')
          con.execute("""
          CREATE TEMP TABLE target_leagues AS
          SELECT id AS dataset_league_id, api_football_id,
                 CASE api_football_id
                   WHEN 128 THEN 'ARG_LPF' WHEN 39 THEN 'ENG_PL'
                   WHEN 140 THEN 'ESP_LL' WHEN 135 THEN 'ITA_SA'
                   WHEN 78 THEN 'GER_BL1' WHEN 61 THEN 'FRA_L1'
                 END AS competition_code
          FROM read_parquet('.lab_hf/leagues.parquet')
          WHERE api_football_id IN (128,39,140,135,78,61)
          """)
          con.execute("""
          CREATE TEMP TABLE fx AS
          SELECT f.id AS fixture_id, tl.competition_code, f.date_utc,
                 EXTRACT(year FROM f.date_utc)::INTEGER AS calendar_year,
                 EXTRACT(month FROM f.date_utc)::INTEGER AS calendar_month,
                 f.is_played
          FROM read_parquet('.lab_hf/fixtures.parquet') f
          JOIN target_leagues tl ON tl.dataset_league_id=f.league_id
          WHERE EXTRACT(year FROM f.date_utc) BETWEEN 2016 AND 2021
          """)
          con.execute("""
          CREATE TEMP TABLE fp AS
          SELECT fx.competition_code, fx.calendar_year, fx.calendar_month, fx.date_utc,
                 p.fixture_id, p.player_id, p.is_starter, p.minutes, p.rating
          FROM read_parquet('.lab_hf/fixture_players.parquet') p
          JOIN fx ON fx.fixture_id=p.fixture_id
          """)
          con.execute("""
          CREATE TEMP TABLE st AS
          SELECT fx.competition_code, fx.calendar_year, fx.calendar_month, fx.date_utc,
                 s.fixture_id, s.player_id, s.games_minutes, s.games_rating,
                 s.games_substitute, s.games_position, s.passes_total,
                 s.goals_total, s.goals_assists
          FROM read_parquet('.lab_hf/fixture_players_stats_flat.parquet') s
          JOIN fx ON fx.fixture_id=s.fixture_id
          """)

          arg_monthly_cursor = con.execute("""
          WITH base AS (
            SELECT calendar_year, calendar_month, COUNT(*) FILTER (WHERE is_played) AS played
            FROM fx WHERE competition_code='ARG_LPF' AND calendar_year BETWEEN 2016 AND 2018
            GROUP BY 1,2
          ), p AS (
            SELECT calendar_year, calendar_month, COUNT(DISTINCT fixture_id) AS player_fixtures
            FROM fp WHERE competition_code='ARG_LPF' AND calendar_year BETWEEN 2016 AND 2018
            GROUP BY 1,2
          ), s AS (
            SELECT calendar_year, calendar_month, COUNT(DISTINCT fixture_id) AS stat_fixtures
            FROM st WHERE competition_code='ARG_LPF' AND calendar_year BETWEEN 2016 AND 2018
            GROUP BY 1,2
          )
          SELECT b.calendar_year, b.calendar_month, b.played,
                 COALESCE(p.player_fixtures,0), COALESCE(s.stat_fixtures,0),
                 ROUND(100.0*COALESCE(p.player_fixtures,0)/NULLIF(b.played,0),1),
                 ROUND(100.0*COALESCE(s.stat_fixtures,0)/NULLIF(b.played,0),1)
          FROM base b LEFT JOIN p USING(calendar_year,calendar_month)
          LEFT JOIN s USING(calendar_year,calendar_month)
          ORDER BY 1,2
          """)
          arg_monthly_cols = [d[0] for d in arg_monthly_cursor.description]
          arg_monthly = [dict(zip(arg_monthly_cols,row)) for row in arg_monthly_cursor.fetchall()]

          semantics_cursor = con.execute("""
          WITH f AS (
            SELECT competition_code, calendar_year,
                   COUNT(*) FILTER (WHERE is_played) AS played
            FROM fx GROUP BY 1,2
          ), p AS (
            SELECT competition_code, calendar_year,
                   COUNT(*) AS rows,
                   COUNT(DISTINCT fixture_id) AS covered_fixtures,
                   COUNT(*) FILTER (WHERE minutes IS NOT NULL) AS minutes_nonnull,
                   COUNT(*) FILTER (WHERE minutes IS NULL) AS minutes_null,
                   COUNT(*) FILTER (WHERE is_starter) AS starters,
                   COUNT(*) FILTER (WHERE rating IS NOT NULL) AS rating_nonnull
            FROM fp GROUP BY 1,2
          ), s AS (
            SELECT competition_code, calendar_year,
                   COUNT(*) AS rows,
                   COUNT(DISTINCT fixture_id) AS covered_fixtures,
                   COUNT(*) FILTER (WHERE games_minutes IS NOT NULL) AS minutes_nonnull,
                   COUNT(*) FILTER (WHERE games_minutes IS NULL) AS minutes_null,
                   COUNT(*) FILTER (WHERE games_minutes=0) AS minutes_zero,
                   COUNT(*) FILTER (WHERE games_rating IS NOT NULL) AS rating_nonnull,
                   COUNT(*) FILTER (WHERE games_minutes IS NOT NULL AND games_rating IS NOT NULL) AS rating_on_appearance,
                   COUNT(*) FILTER (WHERE games_minutes IS NULL AND games_rating IS NOT NULL) AS rating_without_minutes,
                   COUNT(*) FILTER (WHERE games_substitute AND games_minutes IS NOT NULL) AS used_subs,
                   COUNT(*) FILTER (WHERE games_substitute AND games_minutes IS NULL) AS unused_sub_rows,
                   COUNT(*) FILTER (WHERE games_minutes IS NOT NULL AND passes_total IS NOT NULL) AS passes_on_appearance,
                   COUNT(*) FILTER (WHERE games_minutes IS NULL AND passes_total IS NOT NULL) AS passes_without_minutes
            FROM st GROUP BY 1,2
          )
          SELECT f.competition_code, f.calendar_year, f.played,
                 p.covered_fixtures AS player_fixtures,
                 ROUND(1.0*p.rows/NULLIF(p.covered_fixtures,0),2) AS matchday_rows_per_fixture,
                 ROUND(100.0*p.minutes_nonnull/NULLIF(p.rows,0),1) AS fp_minutes_nonnull_pct,
                 ROUND(100.0*p.rating_nonnull/NULLIF(p.rows,0),1) AS fp_rating_nonnull_pct,
                 s.covered_fixtures AS stat_fixtures,
                 ROUND(1.0*s.rows/NULLIF(s.covered_fixtures,0),2) AS stat_rows_per_fixture,
                 ROUND(1.0*s.minutes_nonnull/NULLIF(s.covered_fixtures,0),2) AS appearance_rows_per_fixture,
                 ROUND(100.0*s.minutes_null/NULLIF(s.rows,0),1) AS stat_minutes_null_pct,
                 ROUND(100.0*s.minutes_zero/NULLIF(s.rows,0),2) AS stat_minutes_zero_pct,
                 ROUND(100.0*s.rating_on_appearance/NULLIF(s.minutes_nonnull,0),1) AS rating_on_appearance_pct,
                 ROUND(100.0*s.rating_without_minutes/NULLIF(s.minutes_null,0),1) AS rating_without_minutes_pct,
                 ROUND(1.0*s.used_subs/NULLIF(s.covered_fixtures,0),2) AS used_subs_per_fixture,
                 ROUND(1.0*s.unused_sub_rows/NULLIF(s.covered_fixtures,0),2) AS unused_sub_rows_per_fixture,
                 ROUND(100.0*s.passes_on_appearance/NULLIF(s.minutes_nonnull,0),1) AS passes_on_appearance_pct,
                 ROUND(100.0*s.passes_without_minutes/NULLIF(s.minutes_null,0),1) AS passes_without_minutes_pct
          FROM f JOIN p USING(competition_code,calendar_year)
          JOIN s USING(competition_code,calendar_year)
          ORDER BY 1,2
          """)
          semantics_cols = [d[0] for d in semantics_cursor.description]
          semantics = [dict(zip(semantics_cols,row)) for row in semantics_cursor.fetchall()]

          arg_ranges = con.execute("""
          WITH pf AS (SELECT DISTINCT fixture_id FROM fp WHERE competition_code='ARG_LPF'),
               sf AS (SELECT DISTINCT fixture_id FROM st WHERE competition_code='ARG_LPF')
          SELECT EXTRACT(year FROM fx.date_utc)::INTEGER AS year,
                 MIN(fx.date_utc) FILTER (WHERE pf.fixture_id IS NOT NULL) AS first_player_fixture,
                 MAX(fx.date_utc) FILTER (WHERE pf.fixture_id IS NOT NULL) AS last_player_fixture,
                 MIN(fx.date_utc) FILTER (WHERE sf.fixture_id IS NOT NULL) AS first_stat_fixture,
                 MAX(fx.date_utc) FILTER (WHERE sf.fixture_id IS NOT NULL) AS last_stat_fixture
          FROM fx LEFT JOIN pf USING(fixture_id) LEFT JOIN sf USING(fixture_id)
          WHERE fx.competition_code='ARG_LPF' AND EXTRACT(year FROM fx.date_utc) BETWEEN 2016 AND 2018
          GROUP BY 1 ORDER BY 1
          """).fetchall()

          payload = {
              'source': 'eatpizzanot/soccer-dataset',
              'argentina_monthly_2016_2018': arg_monthly,
              'player_semantics_2016_2021': semantics,
              'argentina_covered_date_ranges': [
                  {
                      'year': r[0],
                      'first_player_fixture': str(r[1]) if r[1] else None,
                      'last_player_fixture': str(r[2]) if r[2] else None,
                      'first_stat_fixture': str(r[3]) if r[3] else None,
                      'last_stat_fixture': str(r[4]) if r[4] else None,
                  }
                  for r in arg_ranges
              ],
              'interpretation_guard': 'games_minutes non-null is appearance evidence; null is not zero and is not promoted to an appearance',
          }
          Path('.lab_hf/detail.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')

          print('ARG_MONTH|year|month|played|player_fx|stat_fx|player_pct|stat_pct')
          for r in arg_monthly:
              print('ARG_MONTH|'+'|'.join(str(r[c]) for c in arg_monthly_cols))
          print('SEM|code|year|played|player_fx|matchday_rows_fx|fp_minutes_pct|fp_rating_pct|stat_fx|stat_rows_fx|appearance_rows_fx|stat_minutes_null_pct|stat_minutes_zero_pct|rating_on_appearance_pct|rating_without_minutes_pct|used_subs_fx|unused_sub_rows_fx|passes_on_appearance_pct|passes_without_minutes_pct')
          for r in semantics:
              print('SEM|'+'|'.join(str(r[c]) for c in semantics_cols))
          print('ARG_RANGES', payload['argentina_covered_date_ranges'])
          PY

      - name: Upload bounded audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf-soccer-datalake-player-semantics
          path: .lab_hf/detail.json
          if-no-files-found: error
          retention-days: 7
