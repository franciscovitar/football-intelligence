# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Wikipedia ARG_LPF 2016 player appearance coverage

on:
  push:
    branches:
      - lab/wikipedia-arg-2016-roster-revisions
    paths:
      - .github/workflows/lab-wikipedia-arg-2016-player-appearances.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Measure linked-player page and 2016-stat-table coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import statistics
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path

          API = 'https://es.wikipedia.org/w/api.php'
          UA = 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          CUTOFF = '2016-02-09T00:00:00Z'
          CLUB_TITLES = {
            'Aldosivi':['Club Atlético Aldosivi'],
            'Argentinos Juniors':['Asociación Atlética Argentinos Juniors'],
            'Arsenal de Sarandí':['Arsenal Fútbol Club','Arsenal de Sarandí'],
            'Atlético de Rafaela':['Asociación Mutual Social y Deportiva Atlético de Rafaela','Atlético de Rafaela'],
            'Atlético Tucumán':['Club Atlético Tucumán'],
            'Banfield':['Club Atlético Banfield'],
            'Belgrano de Córdoba':['Club Atlético Belgrano'],
            'Boca Juniors':['Club Atlético Boca Juniors'],
            'Colón':['Club Atlético Colón'],
            'Defensa y Justicia':['Club Social y Deportivo Defensa y Justicia'],
            'Estudiantes':['Club Estudiantes de La Plata','Estudiantes de La Plata'],
            'Gimnasia de La Plata':['Club de Gimnasia y Esgrima La Plata'],
            'Godoy Cruz':['Club Deportivo Godoy Cruz Antonio Tomba','Godoy Cruz Antonio Tomba'],
            'Huracán':['Club Atlético Huracán'],
            'Independiente':['Club Atlético Independiente'],
            'Lanús':['Club Atlético Lanús'],
            "Newell's Old Boys":["Club Atlético Newell's Old Boys"],
            'Olimpo':['Club Olimpo'],
            'Patronato':['Club Atlético Patronato de la Juventud Católica'],
            'Quilmes':['Quilmes Atlético Club'],
            'Racing Club':['Racing Club'],
            'River Plate':['Club Atlético River Plate'],
            'Rosario Central':['Club Atlético Rosario Central'],
            'San Lorenzo':['Club Atlético San Lorenzo de Almagro'],
            'San Martín de San Juan':['Club Atlético San Martín (San Juan)','Club Atlético San Martín de San Juan'],
            'Sarmiento de Junín':['Club Atlético Sarmiento (Junín)','Club Atlético Sarmiento de Junín'],
            'Temperley':['Club Atlético Temperley'],
            'Tigre':['Club Atlético Tigre'],
            'Unión de Santa Fe':['Club Atlético Unión (Santa Fe)','Club Atlético Unión'],
            'Vélez Sarsfield':['Club Atlético Vélez Sarsfield'],
          }
          TAIL_MARKERS=('reserva','juvenil','inferior','altas y bajas','transferencias','bajas y altas')

          def fold(v: str) -> str:
              d=unicodedata.normalize('NFKD',v or '')
              return ''.join(c for c in d if not unicodedata.combining(c)).casefold()

          def norm(v: str) -> str:
              return re.sub(r'[^a-z0-9]+',' ',fold(v)).strip()

          def request(params):
              url=f"{API}?{urllib.parse.urlencode(params)}"
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              for attempt in range(1,5):
                  try:
                      with urllib.request.urlopen(req,timeout=40) as resp:
                          payload=json.loads(resp.read())
                      if not isinstance(payload,dict): raise RuntimeError('non-object payload')
                      return payload
                  except Exception:
                      if attempt==4: raise
                      time.sleep(attempt*1.5)
              raise AssertionError('unreachable')

          def get_revision(titles):
              for title in titles:
                  p=request({'action':'query','prop':'revisions','titles':title,'redirects':'1','rvstart':CUTOFF,'rvdir':'older','rvlimit':'1','rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'})
                  pages=p.get('query',{}).get('pages',[])
                  if not isinstance(pages,list) or len(pages)!=1: continue
                  page=pages[0]; revs=page.get('revisions') or []
                  if page.get('missing') is True or not revs: continue
                  rev=revs[0]; text=((rev.get('slots') or {}).get('main') or {}).get('content')
                  if isinstance(text,str):
                      return {'page_title':page.get('title'),'pageid':page.get('pageid'),'revid':rev.get('revid'),'timestamp':rev.get('timestamp'),'text':text}
              return None

          def headings(text):
              hs=[]
              for m in re.finditer(r'^(={2,6})\s*(.*?)\s*\1\s*$',text,re.M):
                  hs.append({'level':len(m.group(1)),'label':m.group(2).strip(),'start':m.start(),'content_start':m.end()})
              for i,h in enumerate(hs):
                  end=len(text)
                  for n in hs[i+1:]:
                      if n['level']<=h['level']: end=n['start']; break
                  h['end']=end
              return hs

          def roster_section(text):
              hs=headings(text); candidates=[]
              for h in hs:
                  lab=fold(h['label'])
                  if not any(x in lab for x in ('plantel','plantilla','equipo actual')): continue
                  end=h['end']
                  for n in hs:
                      if h['content_start']<=n['start']<h['end'] and n['level']>h['level'] and any(x in fold(n['label']) for x in TAIL_MARKERS):
                          end=n['start']; break
                  sec=text[h['content_start']:end]
                  score=sec.count('{{Jugador de fútbol')*10+sec.count('{{Futbolista')*10+(25 if '{|' in sec and 'Nombre' in sec else 0)+(5 if '2016' in lab else 0)
                  candidates.append((score,h['start'],sec,h['label']))
              return max(candidates,key=lambda x:(x[0],-x[1])) if candidates else None

          def matching_template_end(text,start):
              depth=0;i=start
              while i<len(text)-1:
                  pair=text[i:i+2]
                  if pair=='{{':depth+=1;i+=2;continue
                  if pair=='}}':
                      depth-=1;i+=2
                      if depth==0:return i
                      continue
                  i+=1
              return None

          def iter_player_templates(text):
              i=0
              while True:
                  start=text.find('{{',i)
                  if start<0:return
                  ends=[p for p in (text.find('|',start+2),text.find('}}',start+2)) if p>=0]
                  if not ends:return
                  name=fold(text[start+2:min(ends)].strip()).replace(' ','')
                  if name not in {'jugadordefutbol','futbolista'}:i=start+2;continue
                  end=matching_template_end(text,start)
                  if end is None:i=start+2;continue
                  yield text[start:end];i=end

          def split_top(inner):
              out=[];buf=[];brace=0;bracket=0;i=0
              while i<len(inner):
                  pair=inner[i:i+2]
                  if pair=='{{':brace+=1;buf.append(pair);i+=2;continue
                  if pair=='}}' and brace:brace-=1;buf.append(pair);i+=2;continue
                  if pair=='[[':bracket+=1;buf.append(pair);i+=2;continue
                  if pair==']]' and bracket:bracket-=1;buf.append(pair);i+=2;continue
                  if inner[i]=='|' and brace==0 and bracket==0:out.append(''.join(buf));buf=[];i+=1;continue
                  buf.append(inner[i]);i+=1
              out.append(''.join(buf));return out

          def fields(template):
              parts=split_top(template[2:-2]); d={}
              for part in parts[1:]:
                  if '=' not in part: continue
                  k,v=part.split('=',1); d[fold(k.strip()).replace(' ','')]=v.strip()
              return d

          def first_player_link(raw):
              if not raw:return None,None
              for link in re.findall(r'\[\[([^\]]+)\]\]',raw):
                  target=link.split('|')[0].strip()
                  if fold(target).startswith(('archivo:','file:','imagen:','bandera:')):continue
                  label=link.split('|')[-1].strip()
                  label=re.sub(r"''+",'',label).strip()
                  return target,label or target
              plain=re.sub(r'<ref\b.*?</ref>','',raw,flags=re.I|re.S)
              plain=re.sub(r'\{\{.*?\}\}','',plain,flags=re.S)
              plain=re.sub(r'<[^>]+>','',plain);plain=re.sub(r"''+",'',plain);plain=re.sub(r'\s+',' ',plain).strip()
              return None,plain or None

          def template_links(sec):
              rows=[]
              for t in iter_player_templates(sec):
                  f=fields(t); raw=f.get('name') or f.get('nombre')
                  target,name=first_player_link(raw)
                  if name: rows.append({'name':name,'target':target,'parser':'template'})
              return rows

          def table_links(sec):
              rows=[]
              for table in re.findall(r'(?ms)^\{\|.*?^\|\}',sec):
                  if 'Nombre' not in table:continue
                  for row in re.split(r'(?m)^\|-.*$',table):
                      links=[]
                      for line in row.splitlines():
                          if not line.startswith('|') or line.startswith(('|-','|}')):continue
                          cell=line[1:].strip()
                          if '|' in cell:cell=cell.split('|',1)[1]
                          links.append(cell)
                      if len(links)<2:continue
                      first=re.sub(r'\D','',re.sub(r'<[^>]+>','',links[0]))
                      if not first:continue
                      target,name=first_player_link(links[1])
                      if name:rows.append({'name':name,'target':target,'parser':'table'})
              return rows

          roster=[]
          club_meta=[]
          for club,titles in CLUB_TITLES.items():
              rev=get_revision(titles)
              if not rev:
                  club_meta.append({'club':club,'state':'no_revision'}); continue
              found=roster_section(rev['text'])
              if not found:
                  club_meta.append({'club':club,'state':'no_roster','revid':rev['revid']});continue
              _,_,sec,label=found
              rows=template_links(sec)
              parser='template'
              if len(rows)<15:
                  rows=table_links(sec);parser='table'
              seen=set();ded=[]
              for r in rows:
                  k=norm(r['name'])
                  if not k or k in seen:continue
                  seen.add(k);ded.append(r)
              for r in ded:
                  r.update({'club':club,'club_revision_id':rev['revid'],'club_revision_timestamp':rev['timestamp'],'club_page_title':rev['page_title']})
                  roster.append(r)
              club_meta.append({'club':club,'state':'parsed','revid':rev['revid'],'section':label,'parser':parser,'rows':len(ded),'linked':sum(1 for r in ded if r['target'])})

          linked=[r for r in roster if r.get('target')]
          unlinked=[r for r in roster if not r.get('target')]

          # De-duplicate identical target pages for fetch efficiency; keep every roster slot separately.
          targets=[];seen=set()
          for r in linked:
              if r['target'] not in seen:
                  seen.add(r['target']);targets.append(r['target'])

          pages_by_requested={}
          for i in range(0,len(targets),40):
              batch=targets[i:i+40]
              p=request({'action':'query','prop':'revisions','titles':'|'.join(batch),'redirects':'1','rvlimit':'1','rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'})
              q=p.get('query',{})
              normalized={x['from']:x['to'] for x in q.get('normalized',[]) if isinstance(x,dict) and 'from' in x and 'to' in x}
              redirects={x['from']:x['to'] for x in q.get('redirects',[]) if isinstance(x,dict) and 'from' in x and 'to' in x}
              pages=q.get('pages',[])
              by_title={pg.get('title'):pg for pg in pages if isinstance(pg,dict)}
              for t in batch:
                  resolved=redirects.get(normalized.get(t,t),normalized.get(t,t))
                  pg=by_title.get(resolved)
                  if not pg:
                      pages_by_requested[t]={'state':'unresolved','resolved_title':resolved};continue
                  revs=pg.get('revisions') or []
                  text=None;rid=None;ts=None
                  if revs:
                      rv=revs[0];rid=rv.get('revid');ts=rv.get('timestamp');text=((rv.get('slots') or {}).get('main') or {}).get('content')
                  pages_by_requested[t]={'state':'resolved' if isinstance(text,str) else 'no_content','resolved_title':pg.get('title'),'pageid':pg.get('pageid'),'revid':rid,'timestamp':ts,'text':text}
              time.sleep(0.15)

          # Cheap parser: locate explicit table-like lines containing 2016 and nearby numeric columns.
          # This classifies candidates only; it does not silently promote values to product data.
          CLUB_ALIASES={
            'Aldosivi':['aldosivi'],'Argentinos Juniors':['argentinos juniors'],'Arsenal de Sarandí':['arsenal'],'Atlético de Rafaela':['atletico de rafaela','rafaela'],'Atlético Tucumán':['atletico tucuman'],'Banfield':['banfield'],'Belgrano de Córdoba':['belgrano'],'Boca Juniors':['boca juniors','boca'],'Colón':['colon'],'Defensa y Justicia':['defensa y justicia'],'Estudiantes':['estudiantes'],'Gimnasia de La Plata':['gimnasia'],'Godoy Cruz':['godoy cruz'],'Huracán':['huracan'],'Independiente':['independiente'],'Lanús':['lanus'],"Newell's Old Boys":["newell's","newells"],'Olimpo':['olimpo'],'Patronato':['patronato'],'Quilmes':['quilmes'],'Racing Club':['racing'],'River Plate':['river plate','river'],'Rosario Central':['rosario central'],'San Lorenzo':['san lorenzo'],'San Martín de San Juan':['san martin'],'Sarmiento de Junín':['sarmiento'],'Temperley':['temperley'],'Tigre':['tigre'],'Unión de Santa Fe':['union'],'Vélez Sarsfield':['velez'],
          }

          def candidate_excerpts(text,club):
              if not isinstance(text,str):return []
              lines=text.splitlines(); out=[]; aliases=[fold(x) for x in CLUB_ALIASES[club]]
              for idx,line in enumerate(lines):
                  fl=fold(line)
                  if '2016' not in fl:continue
                  window='\n'.join(lines[max(0,idx-4):min(len(lines),idx+5)])
                  fw=fold(window)
                  has_club=any(a in fw for a in aliases)
                  numeric_tokens=re.findall(r'(?<!\d)\d{1,3}(?!\d)',window)
                  if has_club and len(numeric_tokens)>=2:
                      out.append({'line':idx+1,'excerpt':window[:1800],'numeric_tokens':numeric_tokens[:20]})
              return out[:8]

          slots=[]
          for r in roster:
              pg=pages_by_requested.get(r.get('target')) if r.get('target') else None
              excerpts=candidate_excerpts(pg.get('text') if pg else None,r['club']) if pg else []
              slots.append({
                  'club':r['club'],'name':r['name'],'player_target':r.get('target'),
                  'club_revision_id':r['club_revision_id'],'club_revision_timestamp':r['club_revision_timestamp'],
                  'player_page_state':pg.get('state') if pg else 'unlinked',
                  'player_page_title':pg.get('resolved_title') if pg else None,
                  'player_pageid':pg.get('pageid') if pg else None,
                  'player_revision_id':pg.get('revid') if pg else None,
                  'player_revision_timestamp':pg.get('timestamp') if pg else None,
                  'candidate_2016_club_stat_contexts':len(excerpts),
                  'candidate_excerpts':excerpts,
              })

          state_counts=Counter(s['player_page_state'] for s in slots)
          candidates=[s for s in slots if s['candidate_2016_club_stat_contexts']>0]
          by_club=defaultdict(lambda:{'slots':0,'linked':0,'page_resolved':0,'candidate':0})
          for s in slots:
              x=by_club[s['club']];x['slots']+=1;x['linked']+=int(bool(s['player_target']));x['page_resolved']+=int(s['player_page_state']=='resolved');x['candidate']+=int(s['candidate_2016_club_stat_contexts']>0)

          summary={
              'status':'PASS',
              'decision_question':'Can linked individual Wikipedia player pages provide dense, provenance-preserving 2016 league-appearance evidence for the ARG_LPF roster snapshot without fuzzy identity matching?',
              'scope':{'competition_code':'ARG_LPF','season_label':'2016','roster_cutoff':CUTOFF},
              'method':{'identity':'historical roster hyperlink target only; no fuzzy player matching','player_page_revision':'current revision at probe time, recorded by revision ID','candidate_detection':'explicit 2016 + roster-club context in player wikitext; candidate only, not accepted statistic'},
              'roster_slots':len(slots),'linked_slots':len(linked),'unlinked_slots':len(unlinked),'unique_player_targets':len(targets),
              'player_page_state_counts':dict(state_counts),'candidate_slots':len(candidates),
              'candidate_slot_rate':round(len(candidates)/len(slots),4) if slots else 0,
              'club_coverage':dict(sorted(by_club.items())),
              'exit_rule':'If candidate density is low, stop before building a generalized season-stat parser. If materially useful, inspect candidate patterns and validate against known AFA anchors before accepting any appearance values.',
              'non_claims':['Candidate contexts are not accepted appearances.','Current player pages can contain career totals, cups or later-season data; 2016 text alone is insufficient.','No PlayerCrosswalk or production row is created.']
          }
          Path('probe_out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          Path('probe_out/slots.json').write_text(json.dumps(slots,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          Path('probe_out/club_meta.json').write_text(json.dumps(club_meta,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:summary[k] for k in ('roster_slots','linked_slots','unique_player_targets','player_page_state_counts','candidate_slots','candidate_slot_rate')},ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-player-appearance-coverage-${{ github.run_id }}
          path: probe_out
          if-no-files-found: error
          retention-days: 7
