# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Wikipedia ARG_LPF 2016 strict full-page appearance coverage v2

on:
  push:
    branches:
      - lab/wikipedia-arg-2016-roster-revisions
    paths:
      - .github/workflows/lab-wikipedia-arg-2016-player-strict-fullpage-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Download validated roster-link artifact
        uses: actions/download-artifact@v4
        with:
          name: wikipedia-arg-2016-player-appearance-coverage-v2-33078390845
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33078390845
          path: input_artifact
      - name: Parse complete current pages with rowspan-aware club context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out
          python - <<'PY'
          import json,re,time,unicodedata,urllib.parse,urllib.request
          from collections import Counter,defaultdict
          from pathlib import Path

          API='https://es.wikipedia.org/w/api.php'; UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          slots=json.loads(Path('input_artifact/slots.json').read_text()); assert len(slots)==903
          ALIASES={'Aldosivi':['aldosivi'],'Argentinos Juniors':['argentinos juniors'],'Arsenal de Sarandí':['arsenal'],'Atlético de Rafaela':['atletico de rafaela','rafaela'],'Atlético Tucumán':['atletico tucuman'],'Banfield':['banfield'],'Belgrano de Córdoba':['belgrano'],'Boca Juniors':['boca juniors','boca'],'Colón':['colon'],'Defensa y Justicia':['defensa y justicia'],'Estudiantes':['estudiantes'],'Gimnasia de La Plata':['gimnasia'],'Godoy Cruz':['godoy cruz'],'Huracán':['huracan'],'Independiente':['independiente'],'Lanús':['lanus'],"Newell's Old Boys":["newell's","newells"],'Olimpo':['olimpo'],'Patronato':['patronato'],'Quilmes':['quilmes'],'Racing Club':['racing'],'River Plate':['river plate','river'],'Rosario Central':['rosario central'],'San Lorenzo':['san lorenzo'],'San Martín de San Juan':['san martin'],'Sarmiento de Junín':['sarmiento'],'Temperley':['temperley'],'Tigre':['tigre'],'Unión de Santa Fe':['union'],'Vélez Sarsfield':['velez']}
          EXACT=[re.compile(r'\[\[Campeonato de Primera División 2016(?: \(Argentina\))?\|[^\]]+\]\]',re.I),re.compile(r'\[\[Campeonato de Primera División 2016(?: \(Argentina\))?\]\]',re.I)]
          PLAIN=re.compile(r'(?m)^\s*\|\s*(?:\'\'\')?2016(?:\'\'\')?\s*(?=\|\||\||$)')

          def fold(v):
              d=unicodedata.normalize('NFKD',v or '');return ''.join(c for c in d if not unicodedata.combining(c)).casefold()
          def req(params):
              u=f"{API}?{urllib.parse.urlencode(params)}";r=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
              for a in range(1,5):
                  try:
                      with urllib.request.urlopen(r,timeout=40) as h:p=json.loads(h.read())
                      if 'error' in p:raise RuntimeError(str(p['error']))
                      return p
                  except Exception:
                      if a==4:raise
                      time.sleep(a*1.3)
          targets=[];seen=set()
          for s in slots:
              t=s.get('player_target')
              if t and t not in seen:seen.add(t);targets.append(t)
          pages={}
          for i in range(0,len(targets),40):
              batch=targets[i:i+40];p=req({'action':'query','prop':'revisions','titles':'|'.join(batch),'redirects':'1','rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'});q=p.get('query',{})
              nmap={x['from']:x['to'] for x in q.get('normalized',[]) if isinstance(x,dict)};rmap={x['from']:x['to'] for x in q.get('redirects',[]) if isinstance(x,dict)};bt={x.get('title'):x for x in q.get('pages',[]) if isinstance(x,dict)}
              for t in batch:
                  n=nmap.get(t,t);rt=rmap.get(n,n);pg=bt.get(rt);rv=(pg.get('revisions') or [None])[0] if pg else None;text=((rv.get('slots') or {}).get('main') or {}).get('content') if rv else None
                  pages[t]={'state':'resolved' if isinstance(text,str) else ('missing' if pg and pg.get('missing') else 'unresolved'),'title':pg.get('title') if pg else rt,'pageid':pg.get('pageid') if pg else None,'revid':rv.get('revid') if rv else None,'timestamp':rv.get('timestamp') if rv else None,'text':text}
              time.sleep(.12)

          def table_blocks(text):
              return re.findall(r'(?ms)^\{\|.*?^\|\}',text or '')
          def rows(table):
              return re.split(r'(?m)^\|-.*$',table)
          def first_value_after(marker,row):
              tail=row[marker.end():];m=re.search(r'(?:\|\||\|)\s*(?:\'\'\')?(\d{1,3})(?:\'\'\')?\s*(?=\|\||\||\n|$)',tail);return int(m.group(1)) if m else None
          def starts_new_club(row):
              # In common Spanish career tables, a new club block starts with a rowspan club cell.
              lines=[ln.strip() for ln in row.splitlines() if ln.strip().startswith('|') and not ln.strip().startswith(('|-','|}'))]
              if not lines:return False
              first=fold(lines[0])
              return 'rowspan' in first and '[[' in lines[0] and not any(x in first for x in ('primera division','segunda division','liga profesional','copa'))
          def row_has_target_club(row,club):
              fr=fold(row);return any(fold(a) in fr for a in ALIASES[club])

          def parse(text,club):
              strict=[];plain=[];strict_rows=[];plain_rows=[]
              for table in table_blocks(text):
                  current_target=False; division_arg=False
                  for row in rows(table):
                      if starts_new_club(row): current_target=row_has_target_club(row,club); division_arg=False
                      elif row_has_target_club(row,club): current_target=True
                      fr=fold(row)
                      if 'primera division' in fr and ('argentina' in fr or '1.a' in fr or '1.ª' in row): division_arg=True
                      if not current_target:continue
                      found_exact=[]
                      for pat in EXACT:found_exact.extend(list(pat.finditer(row)))
                      for m in found_exact:
                          v=first_value_after(m,row)
                          if v is not None:strict.append(v);strict_rows.append({'value':v,'row':row[:1800]})
                      for m in PLAIN.finditer(row):
                          if not division_arg and 'primera division' not in fr:continue
                          v=first_value_after(m,row)
                          if v is not None:plain.append(v);plain_rows.append({'value':v,'row':row[:1800]})
              return sorted(set(strict)),sorted(set(plain)),strict_rows[:8],plain_rows[:8]

          out=[]
          for s in slots:
              t=s.get('player_target');pg=pages.get(t) if t else None;sv,pv,sr,pr=parse(pg.get('text'),s['club']) if pg and pg['state']=='resolved' else ([],[],[],[])
              cls='strict_unique' if len(sv)==1 else 'strict_ambiguous' if len(sv)>1 else 'plain_only_unique' if len(pv)==1 else 'plain_only_ambiguous' if len(pv)>1 else 'missing'
              out.append({'club':s['club'],'name':s['name'],'player_target':t,'page_state':pg.get('state') if pg else 'unlinked','page_title':pg.get('title') if pg else None,'pageid':pg.get('pageid') if pg else None,'revision_id':pg.get('revid') if pg else None,'revision_timestamp':pg.get('timestamp') if pg else None,'classification':cls,'strict_values':sv,'plain_values':pv,'strict_rows':sr,'plain_rows':pr})
          anchors={r['name']:r for r in out if r['name'] in {'Gerónimo Poblete','Iván Marcone','José Sand'}}
          # Parser regression checks from the separately verified full-page sample run; these validate structure, not sporting truth.
          assert anchors['Gerónimo Poblete']['strict_values']==[15], anchors['Gerónimo Poblete']
          assert anchors['Iván Marcone']['plain_values']==[14], anchors['Iván Marcone']
          assert anchors['José Sand']['plain_values']==[17], anchors['José Sand']
          counts=Counter(r['classification'] for r in out);resolved=sum(r['page_state']=='resolved' for r in out);pc=defaultdict(Counter)
          for r in out:pc[r['club']][r['classification']]+=1
          summary={'status':'PASS','population':{'roster_slots':903,'linked_slots':sum(bool(r['player_target']) for r in out),'unique_targets':len(targets),'resolved_page_slots':resolved},'classification_counts':dict(counts),'strict_unique_rate_all_slots':round(counts['strict_unique']/903,4),'strict_unique_rate_resolved_slots':round(counts['strict_unique']/resolved,4),'plain_only_unique_rate_all_slots':round(counts['plain_only_unique']/903,4),'anchors':list(anchors.values()),'per_club':{k:dict(v) for k,v in sorted(pc.items())},'decision_semantics':{'strict_unique':'exact Campeonato de Primera División 2016 competition link within the active roster-club table block and one numeric first stat value','plain_only_unique':'plain 2016 row within active roster-club / Argentina Primera table context; kept non-strict','missing':'no accepted evidence; not zero'},'regression_note':'Poblete=15, Marcone=14 plain and Sand=17 plain are parser regression expectations from current Wikipedia revisions, not Football Intelligence truth labels. AFA official Poblete denominator is 14 and therefore conflicts with Wikipedia current 15.'}
          Path('probe_out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n');Path('probe_out/slots.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'population':summary['population'],'classification_counts':summary['classification_counts'],'strict_unique_rate_all_slots':summary['strict_unique_rate_all_slots'],'plain_only_unique_rate_all_slots':summary['plain_only_unique_rate_all_slots']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-player-strict-fullpage-v2-${{ github.run_id }}
          path: probe_out
          if-no-files-found: error
          retention-days: 7
