name: Apply Wyscout Generic Normalization Refactor

on:
  push:
    branches:
      - feat/wyscout-generic-historical-normalization
    paths:
      - .github/workflows/_apply-wyscout-generic-normalization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Apply exact guarded edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path("analytics/src/football_intelligence/data_mesh/adapters/wyscout_open.py")
          text = adapter.read_text(encoding="utf-8")
          anchor = '''ESP_LL_SCOPE = AdapterScope(
              canonical_competition_code="ESP_LL",
              season_label="2017/18",
              provider_competition_id=795,
              provider_season_id=181144,
          )
          '''
          assert text.count(anchor) == 1
          expanded = anchor + '''
          # Provider-native ids below were derived from the real official Figshare
          # country payloads by `football-intelligence-audit-wyscout-core-leagues`
          # after PR #35. The evidence run reproduced every published match/event/
          # roster/team count with zero events outside scope and zero missing team
          # references before these scopes were enabled in adapter code.
          FRA_L1_SCOPE = AdapterScope(
              canonical_competition_code="FRA_L1",
              season_label="2017/18",
              provider_competition_id=412,
              provider_season_id=181189,
          )
          GER_BL1_SCOPE = AdapterScope(
              canonical_competition_code="GER_BL1",
              season_label="2017/18",
              provider_competition_id=426,
              provider_season_id=181137,
          )
          ITA_SA_SCOPE = AdapterScope(
              canonical_competition_code="ITA_SA",
              season_label="2017/18",
              provider_competition_id=524,
              provider_season_id=181248,
          )
          '''
          text = text.replace(anchor, expanded)
          old_labels = '_SCOPE_FILE_LABELS: dict[str, str] = {"ENG_PL": "England", "ESP_LL": "Spain"}'
          new_labels = '''_SCOPE_FILE_LABELS: dict[str, str] = {
              "ENG_PL": "England",
              "ESP_LL": "Spain",
              "FRA_L1": "France",
              "GER_BL1": "Germany",
              "ITA_SA": "Italy",
          }'''
          assert text.count(old_labels) == 1
          adapter.write_text(text.replace(old_labels, new_labels), encoding="utf-8")

          normalizer = Path("analytics/src/football_intelligence/normalization/wyscout_historical.py")
          text = normalizer.read_text(encoding="utf-8")
          old_doc = '''"""Canonical-ready normalization for Wyscout Open ENG_PL 2017/18.

          Historical-only conversion from the already-certified Wyscout Open adapter
          output into the repository's provider-independent persistence DTOs.

          The only additional derivation introduced here is ``minutes``. The verified
          ENG_PL 2017/18 source marks every league fixture ``duration == "Regular"``
          and publishes substitution minutes, but no final-whistle timestamp. For
          analytics, a regular match therefore uses a standardized 90-minute endpoint:
          starters begin at 0, substitutes begin at their (clamped) substitution minute,
          and a player's end is their (clamped) substitution-out minute or 90.

          These are standardized analytics minutes, not a claim about exact elapsed
          stoppage time. The methodology is versioned so a future exact source can
          coexist without silently rewriting historical semantics.
          """'''
          new_doc = '''"""Canonical-ready normalization for Wyscout Open historical scopes.

          Historical-only conversion from the source-scoped Wyscout Open adapter output
          into the repository's provider-independent persistence DTOs.

          The only additional derivation introduced here is ``minutes``. This normalizer
          applies the existing standardized 90-minute methodology only to fixtures whose
          own source payload declares ``duration == "Regular"``; any other duration fails
          closed. Starters begin at 0, substitutes begin at their (clamped) substitution
          minute, and a player's end is their (clamped) substitution-out minute or 90.

          These are standardized analytics minutes, not a claim about exact elapsed
          stoppage time. The methodology is versioned so a future exact source can coexist
          without silently rewriting historical semantics.
          """'''
          assert text.count(old_doc) == 1
          text = text.replace(old_doc, new_doc)

          import_anchor = '''from football_intelligence.data_mesh.adapters.wyscout_open import (
              DEFAULT_SCOPE,
              parse_player_match_observations,
              parse_team_match_observations,
          )
          '''
          import_replacement = '''from football_intelligence.data_mesh.adapters.scope import AdapterScope
          from football_intelligence.data_mesh.adapters.wyscout_open import (
              DEFAULT_SCOPE,
              parse_player_match_observations,
              parse_team_match_observations,
          )
          '''
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, import_replacement)

          old_header = '''def normalize_england_2017_18(
              *,
              matches_payload: list[Any],
              events_payload: list[Any],
              players_payload: list[Any],
              teams_payload: list[Any],
              expected_match_count: int | None = 380,
          ) -> WyscoutHistoricalNormalizationResult:
              """Build a provider-independent canonical batch from the certified scope."""

              if expected_match_count is not None and len(matches_payload) != expected_match_count:
                  raise WyscoutHistoricalNormalizationError(
                      f"ENG_PL 2017/18 must contain exactly {expected_match_count} matches, "
                      f"got {len(matches_payload)}"
                  )
          '''
          new_header = '''def normalize_wyscout_historical_scope(
              *,
              matches_payload: list[Any],
              events_payload: list[Any],
              players_payload: list[Any],
              teams_payload: list[Any],
              scope: AdapterScope,
              expected_match_count: int | None = None,
          ) -> WyscoutHistoricalNormalizationResult:
              """Build one provider-independent canonical batch for a declared Wyscout scope."""

              if scope.provider_season_id is None:
                  raise WyscoutHistoricalNormalizationError(
                      "Wyscout historical normalization requires a provider-native season id"
                  )
              if expected_match_count is not None and len(matches_payload) != expected_match_count:
                  raise WyscoutHistoricalNormalizationError(
                      f"{scope.canonical_competition_code} {scope.season_label} must contain exactly "
                      f"{expected_match_count} matches, got {len(matches_payload)}"
                  )
          '''
          assert text.count(old_header) == 1
          text = text.replace(old_header, new_header)

          assert text.count("scope=DEFAULT_SCOPE,") == 2
          text = text.replace("scope=DEFAULT_SCOPE,", "scope=scope,")

          old_matches = '''    matches = tuple(_normalize_match(match) for match in matches_payload if isinstance(match, dict))
          '''
          new_matches = '''    matches = tuple(
              _normalize_match(match, scope=scope)
              for match in matches_payload
              if isinstance(match, dict)
          )
          '''
          assert text.count(old_matches) == 1
          text = text.replace(old_matches, new_matches)

          old_batch_scope = '''            provider_competition_id=PROVIDER_COMPETITION_ID,
                      season_label=SEASON_LABEL,
          '''
          new_batch_scope = '''            provider_competition_id=str(scope.provider_competition_id),
                      season_label=scope.season_label,
          '''
          assert text.count(old_batch_scope) == 1
          text = text.replace(old_batch_scope, new_batch_scope)

          wrapper_anchor = '''
          
def _as_list(value: Any) -> list[Any]:
          '''
          wrapper = '''
          
def normalize_england_2017_18(
              *,
              matches_payload: list[Any],
              events_payload: list[Any],
              players_payload: list[Any],
              teams_payload: list[Any],
              expected_match_count: int | None = 380,
          ) -> WyscoutHistoricalNormalizationResult:
              """Backward-compatible wrapper for the original ENG_PL 2017/18 scope."""

              return normalize_wyscout_historical_scope(
                  matches_payload=matches_payload,
                  events_payload=events_payload,
                  players_payload=players_payload,
                  teams_payload=teams_payload,
                  scope=DEFAULT_SCOPE,
                  expected_match_count=expected_match_count,
              )


def _as_list(value: Any) -> list[Any]:
          '''
          assert text.count(wrapper_anchor) == 1
          text = text.replace(wrapper_anchor, wrapper)

          old_match_scope = '''def _normalize_match(match: dict[str, Any]) -> MatchRecord:
              match_id = match.get("wyId")
              if not isinstance(match_id, int):
                  raise WyscoutHistoricalNormalizationError("match without integer wyId")
              if match.get("competitionId") != DEFAULT_SCOPE.provider_competition_id:
                  raise WyscoutHistoricalNormalizationError(
                      f"match {match_id} is outside Wyscout ENG_PL competition scope"
                  )
              if match.get("seasonId") != DEFAULT_SCOPE.provider_season_id:
                  raise WyscoutHistoricalNormalizationError(
                      f"match {match_id} is outside Wyscout ENG_PL 2017/18 season scope"
                  )
          '''
          new_match_scope = '''def _normalize_match(match: dict[str, Any], *, scope: AdapterScope) -> MatchRecord:
              match_id = match.get("wyId")
              if not isinstance(match_id, int):
                  raise WyscoutHistoricalNormalizationError("match without integer wyId")
              if match.get("competitionId") != scope.provider_competition_id:
                  raise WyscoutHistoricalNormalizationError(
                      f"match {match_id} is outside Wyscout "
                      f"{scope.canonical_competition_code} competition scope"
                  )
              if match.get("seasonId") != scope.provider_season_id:
                  raise WyscoutHistoricalNormalizationError(
                      f"match {match_id} is outside Wyscout "
                      f"{scope.canonical_competition_code} {scope.season_label} season scope"
                  )
          '''
          assert text.count(old_match_scope) == 1
          text = text.replace(old_match_scope, new_match_scope)
          normalizer.write_text(text, encoding="utf-8")

          test_path = Path("analytics/tests/test_wyscout_historical_generic_scope.py")
          test_path.write_text('''from __future__ import annotations

          import pytest

          from football_intelligence.data_mesh.adapters.scope import ScopeMismatchError
          from football_intelligence.data_mesh.adapters.wyscout_open import (
              FRA_L1_SCOPE,
              GER_BL1_SCOPE,
              ITA_SA_SCOPE,
              parse_match_observations,
          )
          from football_intelligence.normalization.wyscout_historical import (
              normalize_wyscout_historical_scope,
          )

          PLAYERS = [
              {"wyId": 11, "shortName": "Home Forward", "role": {"code2": "FW"}},
              {"wyId": 21, "shortName": "Away Defender", "role": {"code2": "DF"}},
          ]
          TEAMS = [
              {"wyId": 100, "name": "Home FC"},
              {"wyId": 200, "name": "Away FC"},
          ]
          FRA_MATCH = {
              "wyId": 5001,
              "competitionId": 412,
              "seasonId": 181189,
              "dateutc": "2018-01-01 15:00:00",
              "duration": "Regular",
              "status": "Played",
              "gameweek": 1,
              "venue": "Test Arena",
              "teamsData": {
                  "100": {
                      "side": "home",
                      "score": 1,
                      "formation": {
                          "lineup": [{"playerId": 11}],
                          "bench": [],
                          "substitutions": [],
                      },
                  },
                  "200": {
                      "side": "away",
                      "score": 0,
                      "formation": {
                          "lineup": [{"playerId": 21}],
                          "bench": [],
                          "substitutions": [],
                      },
                  },
              },
          }
          EVENTS = [
              {
                  "matchId": 5001,
                  "eventName": "Shot",
                  "subEventName": "Shot",
                  "playerId": 11,
                  "teamId": 100,
                  "tags": [{"id": 101}, {"id": 1801}],
              }
          ]


def test_real_audit_native_scope_ids_are_encoded_explicitly() -> None:
              assert (FRA_L1_SCOPE.provider_competition_id, FRA_L1_SCOPE.provider_season_id) == (
                  412,
                  181189,
              )
              assert (GER_BL1_SCOPE.provider_competition_id, GER_BL1_SCOPE.provider_season_id) == (
                  426,
                  181137,
              )
              assert (ITA_SA_SCOPE.provider_competition_id, ITA_SA_SCOPE.provider_season_id) == (
                  524,
                  181248,
              )


def test_french_scope_uses_real_country_provenance_label() -> None:
              observations = parse_match_observations([FRA_MATCH], TEAMS, scope=FRA_L1_SCOPE)
              assert observations
              assert all("matches_France.json" in item.source_reference for item in observations)


def test_generic_historical_normalizer_supports_verified_french_scope() -> None:
              result = normalize_wyscout_historical_scope(
                  matches_payload=[FRA_MATCH],
                  events_payload=EVENTS,
                  players_payload=PLAYERS,
                  teams_payload=TEAMS,
                  scope=FRA_L1_SCOPE,
                  expected_match_count=1,
              )

              assert result.batch.provider_competition_id == "412"
              assert result.batch.season_label == "2017/18"
              assert len(result.batch.matches) == 1
              stats = {row.player_external_id: row for row in result.batch.player_match_stats}
              assert stats["11"].goals == 1
              assert stats["21"].goals == 0


def test_generic_historical_normalizer_rejects_wrong_declared_scope() -> None:
              with pytest.raises(ScopeMismatchError):
                  normalize_wyscout_historical_scope(
                      matches_payload=[FRA_MATCH],
                      events_payload=EVENTS,
                      players_payload=PLAYERS,
                      teams_payload=TEAMS,
                      scope=GER_BL1_SCOPE,
                      expected_match_count=1,
                  )
          ''', encoding="utf-8")
          PY
      - name: Remove temporary edit workflow
        run: rm .github/workflows/_apply-wyscout-generic-normalization.yml
      - name: Install analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Format touched Python
        working-directory: analytics
        run: >-
          uv run ruff format
          src/football_intelligence/data_mesh/adapters/wyscout_open.py
          src/football_intelligence/normalization/wyscout_historical.py
          tests/test_wyscout_historical_generic_scope.py
      - name: Lint touched Python
        working-directory: analytics
        run: >-
          uv run ruff check
          src/football_intelligence/data_mesh/adapters/wyscout_open.py
          src/football_intelligence/normalization/wyscout_historical.py
          tests/test_wyscout_historical_generic_scope.py
      - name: Typecheck analytics source
        working-directory: analytics
        run: uv run mypy src
      - name: Run focused Wyscout tests
        working-directory: analytics
        run: >-
          uv run pytest
          tests/test_wyscout_historical_generic_scope.py
          tests/test_wyscout_historical_normalization.py
          tests/test_data_mesh_adapters_scope.py
      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: generalize Wyscout historical normalization by scope"
          git push origin HEAD:feat/wyscout-generic-historical-normalization
