name: Apply Wyscout Generic Loader PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_apply-wyscout-generic-loader.yml
      - .github/workflows/_apply-wyscout-generic-loader-pr.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Apply guarded and structural edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/_apply-wyscout-generic-loader.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Remove temporary edit workflow\n"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise RuntimeError('could not extract guarded loader edit script uniquely')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in script.splitlines()]

          skipped_labels = {
              'parser description',
              'persist competition scope',
              'scoped persistence validation',
              'run metadata validation flags',
              'report scope',
              'report source validation',
              'report adapter validation',
              'minutes docstring',
              'database scope header',
              'database observation scope',
              'generic invariants',
          }
          for label in skipped_labels:
              marker = f'"{label}",'
              label_indexes = [index for index, line in enumerate(lines) if line.strip() == marker]
              if len(label_indexes) != 1:
                  raise RuntimeError(f'{label}: expected one guarded block, got {len(label_indexes)}')
              label_index = label_indexes[0]
              start_index = max(
                  index for index in range(label_index + 1) if lines[index].strip() == 'replace_once('
              )
              end_index = next(
                  index for index in range(label_index, len(lines)) if lines[index].strip() == ')'
              )
              for index in range(start_index, end_index + 1):
                  lines[index] = ''

          dedented = '\n'.join(lines)
          exec(compile(dedented, '<guarded-loader-edit>', 'exec'), {'__name__': '__main__'})

          loader_path = Path('analytics/src/football_intelligence/jobs/load_wyscout_historical.py')
          loader = loader_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global loader
              count = loader.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              loader = loader.replace(old, new)

          def regex_once(pattern: str, replacement: str, label: str, *, flags: int = 0) -> None:
              global loader
              loader, count = re.subn(pattern, replacement, loader, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one regex match, got {count}')

          replace_once(
              'Load certified Wyscout Open ENG_PL 2017/18 historical evidence into a "\n'
              '            "LOCAL PostgreSQL database. Source probe + adapter audit run before any DB ',
              'Load one certified Wyscout Open 2017/18 European core-league scope into a "\n'
              '            "LOCAL PostgreSQL database. Source + adapter validation run before any DB ',
              'parser description',
          )
          replace_once(
              '            competition_code=COMPETITION_CODE,\n',
              '            competition_code=config.spec.competition_code,\n',
              'persist competition code',
          )
          replace_once(
              '        counts = _scoped_database_counts(connection)\n'
              '        _validate_scoped_invariants(counts)\n',
              '        counts = _scoped_database_counts(\n'
              '            connection,\n'
              '            competition_code=config.spec.competition_code,\n'
              '            season_label=config.scope.season_label,\n'
              '            provider_competition_id=config.scope.provider_competition_id,\n'
              '        )\n'
              '        _validate_scoped_invariants(\n'
              '            counts,\n'
              '            expected_matches=len(canonical_batch.matches),\n'
              '            expected_teams=len(canonical_batch.teams),\n'
              '            expected_players=len(canonical_batch.players),\n'
              '            expected_player_appearances=len(canonical_batch.appearances),\n'
              '            expected_player_match_stats=len(canonical_batch.player_match_stats),\n'
              '            expected_team_match_stats=len(canonical_batch.team_match_stats),\n'
              '            expected_source_observations=len(observations),\n'
              '        )\n',
              'scoped persistence validation',
          )
          replace_once(
              '                "source_probe_counts_verified": True,\n'
              '                "adapter_checks_passed": True,\n',
              '                "source_scope_counts_verified": source_validation.passed,\n'
              '                "adapter_checks_passed": adapter_report.passed,\n',
              'run metadata validation flags',
          )
          replace_once(
              '            "competition": COMPETITION_CODE,\n'
              '            "season": SEASON_LABEL,\n',
              '            "competition": config.spec.competition_code,\n'
              '            "season": config.scope.season_label,\n',
              'report scope',
          )
          regex_once(
              r'        "source_probe": \{\n.*?        \},\n        "adapter": \{',
              '        "source_probe": {\n'
              '            "matches": source_validation.match_count,\n'
              '            "events": source_validation.event_count,\n'
              '            "roster_players": source_validation.roster_player_count,\n'
              '            "teams": source_validation.team_count,\n'
              '            "provider_competition_id": source_validation.provider_competition_id,\n'
              '            "provider_season_id": source_validation.provider_season_id,\n'
              '            "counts_verified": source_validation.passed,\n'
              '            "official_archive_checksum_probe": probe_result.report.counts_verified,\n'
              '        },\n'
              '        "adapter": {',
              'report source validation',
              flags=re.DOTALL,
          )
          replace_once(
              '            "all_checks_passed": adapter_report.all_passed,\n',
              '            "all_checks_passed": adapter_report.passed,\n'
              '            "conflicting_duplicates": adapter_report.conflicting_duplicates,\n'
              '            "native_goal_total": adapter_report.native_goal_total,\n'
              '            "observed_team_goal_total": adapter_report.observed_team_goal_total,\n'
              '            "wrong_country_source_references": adapter_report.wrong_country_source_references,\n',
              'report adapter validation',
          )
          replace_once(
              '    ``normalize_england_2017_18`` therefore derives standardized regular-90\n',
              '    the historical normalizer therefore derives standardized regular-90\n',
              'minutes docstring',
          )
          regex_once(
              r'def _scoped_database_counts\(connection: Connection\[Any\]\) -> ScopedDatabaseCounts:\n'
              r'    season_row = connection\.execute\(\n'
              r'        """\n'
              r'        select season\.id\n'
              r'        from football\.seasons as season\n'
              r'        join football\.competitions as competition on competition\.id = season\.competition_id\n'
              r'        where competition\.code = %s and season\.label = %s\n'
              r'        """,\n'
              r'        \(COMPETITION_CODE, SEASON_LABEL\),\n'
              r'    \)\.fetchone\(\)\n'
              r'    if season_row is None:\n'
              r'        raise WyscoutHistoricalLoadError\("persisted historical season could not be found"\)\n',
              'def _scoped_database_counts(\n'
              '    connection: Connection[Any],\n'
              '    *,\n'
              '    competition_code: str = COMPETITION_CODE,\n'
              '    season_label: str = SEASON_LABEL,\n'
              '    provider_competition_id: int = DEFAULT_SCOPE.provider_competition_id,\n'
              ') -> ScopedDatabaseCounts:\n'
              '    season_row = connection.execute(\n'
              '        """\n'
              '        select season.id\n'
              '        from football.seasons as season\n'
              '        join football.competitions as competition on competition.id = season.competition_id\n'
              '        where competition.code = %s and season.label = %s\n'
              '        """,\n'
              '        (competition_code, season_label),\n'
              '    ).fetchone()\n'
              '    if season_row is None:\n'
              '        raise WyscoutHistoricalLoadError(\n'
              '            f"persisted historical season could not be found: {competition_code}/{season_label}"\n'
              '        )\n',
              'database scope header',
          )
          replace_once(
              "        where provider.code = %s\n"
              "          and observation.entity_identity_hints ->> 'season_label' = %s\n"
              '        """,\n'
              '        (SOURCE_CODE, SEASON_LABEL),\n',
              "        where provider.code = %s\n"
              "          and observation.entity_identity_hints ->> 'season_label' = %s\n"
              "          and observation.entity_identity_hints ->> 'competition_external_id' = %s\n"
              '        """,\n'
              '        (SOURCE_CODE, season_label, str(provider_competition_id)),\n',
              'database observation scope',
          )
          regex_once(
              r'def _validate_scoped_invariants\(counts: ScopedDatabaseCounts\) -> None:\n.*?\n\nif __name__ == "__main__":',
              'def _validate_scoped_invariants(\n'
              '    counts: ScopedDatabaseCounts,\n'
              '    *,\n'
              '    expected_matches: int = 380,\n'
              '    expected_teams: int = 20,\n'
              '    expected_players: int | None = None,\n'
              '    expected_player_appearances: int | None = None,\n'
              '    expected_player_match_stats: int | None = None,\n'
              '    expected_team_match_stats: int = 760,\n'
              '    expected_source_observations: int | None = None,\n'
              ') -> None:\n'
              '    exact_expectations = {\n'
              '        "matches": expected_matches,\n'
              '        "teams": expected_teams,\n'
              '        "team_match_stats": expected_team_match_stats,\n'
              '    }\n'
              '    optional_exact_expectations = {\n'
              '        "players": expected_players,\n'
              '        "player_appearances": expected_player_appearances,\n'
              '        "player_match_stats": expected_player_match_stats,\n'
              '        "source_observations": expected_source_observations,\n'
              '    }\n'
              '    for field_name, expected in exact_expectations.items():\n'
              '        actual = getattr(counts, field_name)\n'
              '        if actual != expected:\n'
              '            raise WyscoutHistoricalLoadError(\n'
              '                f"expected {expected} {field_name} after load, got {actual}"\n'
              '            )\n'
              '    for field_name, expected in optional_exact_expectations.items():\n'
              '        actual = getattr(counts, field_name)\n'
              '        if expected is not None and actual != expected:\n'
              '            raise WyscoutHistoricalLoadError(\n'
              '                f"expected {expected} {field_name} after load, got {actual}"\n'
              '            )\n'
              '\n'
              '    if expected_players is None and counts.players <= 0:\n'
              '        raise WyscoutHistoricalLoadError("historical players were not persisted")\n'
              '    if expected_player_appearances is None and counts.player_appearances <= 0:\n'
              '        raise WyscoutHistoricalLoadError("historical player appearances were not persisted")\n'
              '    if expected_player_match_stats is None and counts.player_match_stats <= 0:\n'
              '        raise WyscoutHistoricalLoadError("historical player stats were not persisted")\n'
              '    if counts.player_appearances != counts.player_match_stats:\n'
              '        raise WyscoutHistoricalLoadError(\n'
              '            "every persisted participating appearance must have one player_match_stats row: "\n'
              '            f"appearances={counts.player_appearances}, stats={counts.player_match_stats}"\n'
              '        )\n'
              '    if expected_source_observations is None and counts.source_observations <= 0:\n'
              '        raise WyscoutHistoricalLoadError(\n'
              '            "certified Wyscout Data Mesh observations were not persisted"\n'
              '        )\n'
              '\n\nif __name__ == "__main__":',
              'generic invariants',
              flags=re.DOTALL,
          )

          loader_path.write_text(loader, encoding='utf-8')
          PY
      - name: Remove temporary workflows
        run: >-
          rm .github/workflows/_apply-wyscout-generic-loader.yml
          .github/workflows/_apply-wyscout-generic-loader-pr.yml
      - name: Install analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Format touched Python
        working-directory: analytics
        run: >-
          uv run ruff format
          src/football_intelligence/jobs/load_wyscout_historical.py
          src/football_intelligence/jobs/wyscout_historical_scope.py
      - name: Lint touched Python
        working-directory: analytics
        run: >-
          uv run ruff check
          src/football_intelligence/jobs/load_wyscout_historical.py
          src/football_intelligence/jobs/wyscout_historical_scope.py
      - name: Typecheck analytics source
        working-directory: analytics
        run: uv run mypy src
      - name: Run focused Wyscout tests
        working-directory: analytics
        run: >-
          uv run pytest
          tests/test_wyscout_historical_normalization.py
          tests/test_wyscout_historical_generic_scope.py
          tests/test_wyscout_open_scopes.py
      - name: Commit verified loader changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/src/football_intelligence/jobs/load_wyscout_historical.py \
                  analytics/src/football_intelligence/jobs/wyscout_historical_scope.py \
                  .github/workflows/_apply-wyscout-generic-loader.yml \
                  .github/workflows/_apply-wyscout-generic-loader-pr.yml
          git commit -m "feat: generalize Wyscout historical local loader"
          git push origin HEAD:${{ github.head_ref }}
