name: PlayerElo six-history probe

on:
  push:
    branches:
      - lab/playerelo-provider-audit
    paths:
      - .github/workflows/tmp-playerelo-six-history-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      PLAYERELO_API_KEY: ${{ secrets.PLAYERELO_API_KEY }}
    steps:
      - name: Probe six known player histories
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PLAYERELO_API_KEY:-}" ]; then
            echo "PLAYERELO PROBE: FAIL - repository secret PLAYERELO_API_KEY is missing"
            exit 1
          fi

          rm -rf /tmp/playerelo-six-history-probe
          mkdir -p /tmp/playerelo-six-history-probe/raw

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          BASE = "https://data-api.playerelo.football"
          KEY = os.environ["PLAYERELO_API_KEY"]
          OUT = Path("/tmp/playerelo-six-history-probe")
          RAW = OUT / "raw"
          TARGETS = [
              ("ARG_LPF", 9933, "Miguel Borja"),
              ("ENG_PL", 5, "Manuel Akanji"),
              ("ESP_LL", 278, "Kylian Mbappe"),
              ("ITA_SA", 217, "Lautaro Martinez"),
              ("GER_BL1", 184, "Harry Kane"),
              ("FRA_L1", 153, "Ousmane Dembele"),
          ]

          def fetch(path: str) -> tuple[bytes, int]:
              request = urllib.request.Request(
                  BASE + path,
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {KEY}",
                      "User-Agent": "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.read(), response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  raise SystemExit(
                      f"PlayerElo request failed path={path} status={exc.code} body_bytes={len(body)}"
                  ) from exc

          def rows_from_payload(payload: Any) -> list[Any] | None:
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("history", "data", "results", "response", "items", "matches"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
              return None

          def collect_keys(value: Any, *, depth: int = 0) -> set[str]:
              if depth > 2:
                  return set()
              if isinstance(value, dict):
                  keys = set(value.keys())
                  for child in value.values():
                      keys.update(collect_keys(child, depth=depth + 1))
                  return keys
              if isinstance(value, list):
                  keys: set[str] = set()
                  for child in value[:20]:
                      keys.update(collect_keys(child, depth=depth + 1))
                  return keys
              return set()

          def scalar_strings(value: Any, wanted: tuple[str, ...]) -> list[str]:
              found: list[str] = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      if any(token in key.lower() for token in wanted) and isinstance(child, (str, int, float)):
                          found.append(str(child))
                      if isinstance(child, (dict, list)):
                          found.extend(scalar_strings(child, wanted))
              elif isinstance(value, list):
                  for child in value:
                      found.extend(scalar_strings(child, wanted))
              return found

          usage_raw, usage_status = fetch("/v1/usage")
          (RAW / "usage.json").write_bytes(usage_raw)
          try:
              usage_payload = json.loads(usage_raw)
          except json.JSONDecodeError as exc:
              raise SystemExit("PlayerElo /v1/usage did not return JSON") from exc

          summaries: list[dict[str, Any]] = []
          for competition_code, player_id, expected_name in TARGETS:
              raw, status = fetch(f"/v1/players/{player_id}/history")
              raw_path = RAW / f"player-{player_id}-history.json"
              raw_path.write_bytes(raw)
              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"PlayerElo player {player_id} history did not return JSON") from exc

              rows = rows_from_payload(payload)
              row_count = len(rows) if rows is not None else None
              keys = sorted(collect_keys(rows if rows is not None else payload))
              dates = scalar_strings(rows if rows is not None else payload, ("date", "kickoff", "time"))
              leagues = scalar_strings(rows if rows is not None else payload, ("league", "competition"))
              fixtures = scalar_strings(rows if rows is not None else payload, ("fixture", "match_id"))

              summaries.append(
                  {
                      "competition_code": competition_code,
                      "expected_player_name": expected_name,
                      "provider_player_id": player_id,
                      "http_status": status,
                      "raw_byte_size": len(raw),
                      "raw_sha256": hashlib.sha256(raw).hexdigest(),
                      "root_type": type(payload).__name__,
                      "history_row_count": row_count,
                      "observed_keys": keys,
                      "date_values_sample": sorted(set(dates))[:10],
                      "league_values_sample": sorted(set(leagues))[:20],
                      "fixture_values_sample": sorted(set(fixtures))[:10],
                  }
              )

          summary = {
              "source": "playerelo",
              "source_reference": BASE,
              "acquired_at": datetime.now(timezone.utc).isoformat(),
              "request_budget": {
                  "usage_calls": 1,
                  "history_calls": 6,
                  "total_http_calls": 7,
              },
              "usage_http_status": usage_status,
              "usage_root_type": type(usage_payload).__name__,
              "players": summaries,
          }
          summary_raw = (json.dumps(summary, indent=2, sort_keys=True) + "\n").encode()
          (OUT / "summary.json").write_bytes(summary_raw)

          files = []
          for path in sorted(p for p in OUT.rglob("*") if p.is_file() and p.name != "manifest.json"):
              raw = path.read_bytes()
              files.append(
                  {
                      "path": str(path.relative_to(OUT)),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "byte_size": len(raw),
                  }
              )
          manifest = {
              "snapshot_id": "playerelo-six-history-probe-${{ github.run_id }}",
              "source_code": "playerelo",
              "source_reference": BASE,
              "competition_codes": sorted(code for code, _, _ in TARGETS),
              "provider_player_ids": sorted(player_id for _, player_id, _ in TARGETS),
              "data_grains": ["player_match"],
              "files": files,
              "notes": "Bounded technical evaluation only; no product or rights approval implied.",
          }
          (OUT / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")

          print(
              "PLAYERELO PROBE: PASS "
              f"usage_calls=1 history_calls={len(TARGETS)} "
              f"resolved={len(summaries)} artifact_files={len(files) + 1}"
          )
          for item in summaries:
              print(
                  f"{item['competition_code']} player_id={item['provider_player_id']} "
                  f"rows={item['history_row_count']} bytes={item['raw_byte_size']}"
              )
          PY

          if grep -R --fixed-strings --binary-files=without-match -- "${PLAYERELO_API_KEY}" /tmp/playerelo-six-history-probe >/dev/null; then
            echo "PLAYERELO PROBE: FAIL - secret bytes found in artifact directory"
            exit 1
          fi

      - name: Upload frozen probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: playerelo-six-history-probe-${{ github.run_id }}
          path: /tmp/playerelo-six-history-probe
          if-no-files-found: error
          retention-days: 7
