name: Lab Wikipedia ARG_LPF 2016 end stats

on:
  push:
    branches:
      - lab/wikipedia-arg-2016-end-stats
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Measure end-of-tournament player-stat evidence
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://es.wikipedia.org/w/api.php"
          UA = "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)"
          CUTOFF = "2016-06-02T00:00:00Z"
          CLUB_TITLES = {
              "Aldosivi": ["Club Atlético Aldosivi"],
              "Argentinos Juniors": ["Asociación Atlética Argentinos Juniors"],
              "Arsenal de Sarandí": ["Arsenal Fútbol Club", "Arsenal de Sarandí"],
              "Atlético de Rafaela": ["Asociación Mutual Social y Deportiva Atlético de Rafaela", "Atlético de Rafaela"],
              "Atlético Tucumán": ["Club Atlético Tucumán"],
              "Banfield": ["Club Atlético Banfield"],
              "Belgrano de Córdoba": ["Club Atlético Belgrano"],
              "Boca Juniors": ["Club Atlético Boca Juniors"],
              "Colón": ["Club Atlético Colón"],
              "Defensa y Justicia": ["Club Social y Deportivo Defensa y Justicia"],
              "Estudiantes": ["Club Estudiantes de La Plata", "Estudiantes de La Plata"],
              "Gimnasia de La Plata": ["Club de Gimnasia y Esgrima La Plata"],
              "Godoy Cruz": ["Club Deportivo Godoy Cruz Antonio Tomba", "Godoy Cruz Antonio Tomba"],
              "Huracán": ["Club Atlético Huracán"],
              "Independiente": ["Club Atlético Independiente"],
              "Lanús": ["Club Atlético Lanús"],
              "Newell's Old Boys": ["Club Atlético Newell's Old Boys"],
              "Olimpo": ["Club Olimpo"],
              "Patronato": ["Club Atlético Patronato de la Juventud Católica"],
              "Quilmes": ["Quilmes Atlético Club"],
              "Racing Club": ["Racing Club"],
              "River Plate": ["Club Atlético River Plate"],
              "Rosario Central": ["Club Atlético Rosario Central"],
              "San Lorenzo": ["Club Atlético San Lorenzo de Almagro"],
              "San Martín de San Juan": ["Club Atlético San Martín (San Juan)", "Club Atlético San Martín de San Juan"],
              "Sarmiento de Junín": ["Club Atlético Sarmiento (Junín)", "Club Atlético Sarmiento de Junín"],
              "Temperley": ["Club Atlético Temperley"],
              "Tigre": ["Club Atlético Tigre"],
              "Unión de Santa Fe": ["Club Atlético Unión (Santa Fe)", "Club Atlético Unión"],
              "Vélez Sarsfield": ["Club Atlético Vélez Sarsfield"],
          }

          def fold(value: str) -> str:
              d = unicodedata.normalize("NFKD", value)
              return "".join(c for c in d if not unicodedata.combining(c)).casefold()

          def clean(value: str) -> str:
              x = re.sub(r"<ref\\b.*?</ref>|<ref\\b[^>]*/>", "", value, flags=re.I | re.S)
              x = re.sub(r"\\[\\[([^]|]+)\\|([^]]+)\\]\\]", r"\\2", x)
              x = re.sub(r"\\[\\[([^]]+)\\]\\]", r"\\1", x)
              x = re.sub(r"\\{\\{[^{}]*\\}\\}", "", x)
              x = re.sub(r"<[^>]+>", "", x)
              x = re.sub(r"'{2,5}", "", x)
              return re.sub(r"\\s+", " ", x).strip(" |!\\n\\t")

          def request(params: dict[str, str]) -> dict:
              url = f"{API}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              for attempt in range(1, 5):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.loads(response.read())
                      if not isinstance(payload, dict):
                          raise RuntimeError("MediaWiki response is not an object")
                      return payload
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(attempt * 1.5)
              raise AssertionError("unreachable")

          def revision_for(titles: list[str]) -> dict | None:
              for title in titles:
                  payload = request({
                      "action": "query", "prop": "revisions", "titles": title, "redirects": "1",
                      "rvstart": CUTOFF, "rvdir": "older", "rvlimit": "1",
                      "rvprop": "ids|timestamp|content", "rvslots": "main",
                      "format": "json", "formatversion": "2",
                  })
                  pages = payload.get("query", {}).get("pages", [])
                  if not isinstance(pages, list) or len(pages) != 1:
                      continue
                  page = pages[0]
                  revisions = page.get("revisions") or []
                  if page.get("missing") is True or not revisions:
                      continue
                  rev = revisions[0]
                  text = ((rev.get("slots") or {}).get("main") or {}).get("content")
                  if isinstance(text, str):
                      return {
                          "requested_title": title, "resolved_title": page.get("title"),
                          "pageid": page.get("pageid"), "revid": rev.get("revid"),
                          "timestamp": rev.get("timestamp"), "text": text,
                      }
              return None

          def headings(text: str) -> list[str]:
              return [clean(m.group(2)) for m in re.finditer(r"(?m)^(={2,6})\\s*(.*?)\\s*\\1\\s*$", text)]

          def tables(text: str) -> list[str]:
              return re.findall(r"(?ms)^\\{\\|.*?^\\|\\}", text)

          STAT_TOKENS = ("partidos jugados", "partidos", "apariciones", "pj", "goles", "minutos", "titular", "suplente")

          def classify_table(table: str) -> dict | None:
              ft = fold(table)
              if "nombre" not in ft:
                  return None
              present = sorted({token for token in STAT_TOKENS if token in ft})
              if not present:
                  return None
              header_lines = []
              for line in table.splitlines():
                  if line.startswith("!"):
                      parts = line.lstrip("!").split("!!")
                      header_lines.extend(clean(part) for part in parts if clean(part))
              rows = re.split(r"(?m)^\\|-.*$", table)
              data_rows = []
              for row in rows:
                  cells = []
                  for line in row.splitlines():
                      if line.startswith("|") and not line.startswith(("|-", "|}")):
                          raw = line[1:].strip()
                          if "|" in raw:
                              raw = raw.split("|", 1)[1]
                          cells.append(clean(raw))
                  if len(cells) >= 4:
                      data_rows.append(cells[:8])
              return {
                  "tokens": present,
                  "headers": header_lines[:20],
                  "data_row_count": len(data_rows),
                  "sample_rows": data_rows[:4],
              }

          report = []
          raw_dir = Path("probe_out/raw")
          for club, titles in CLUB_TITLES.items():
              rev = revision_for(titles)
              if rev is None:
                  report.append({"club": club, "state": "no_revision"})
                  continue
              text = rev.pop("text")
              safe = re.sub(r"[^a-z0-9]+", "-", fold(club)).strip("-")
              (raw_dir / f"{safe}.wikitext").write_text(text, encoding="utf-8")
              hs = headings(text)
              stat_headings = [h for h in hs if any(t in fold(h) for t in ("estad", "gole", "partido", "jugadores"))]
              candidates = [candidate for table in tables(text) if (candidate := classify_table(table)) is not None]
              report.append({
                  "club": club,
                  **rev,
                  "state": "revision_found",
                  "stat_related_headings": stat_headings,
                  "candidate_stat_tables": candidates,
                  "candidate_stat_table_count": len(candidates),
              })
              time.sleep(0.12)

          summary = {
              "cutoff": CUTOFF,
              "clubs_total": len(CLUB_TITLES),
              "clubs_with_revision": sum(r["state"] == "revision_found" for r in report),
              "clubs_with_candidate_stat_table": sum(r.get("candidate_stat_table_count", 0) > 0 for r in report),
              "clubs_with_stat_related_heading": sum(bool(r.get("stat_related_headings")) for r in report),
              "rows": report,
          }
          Path("probe_out/summary.json").write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({k: v for k, v in summary.items() if k != "rows"}, indent=2))
          for row in report:
              if row.get("candidate_stat_table_count", 0):
                  print("STAT_TABLE", row["club"], json.dumps(row["candidate_stat_tables"], ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-end-stats-probe
          path: probe_out/
          if-no-files-found: error
          retention-days: 7
