name: Lab Wikipedia ARG_LPF 2016 end stats

on:
  push:
    branches:
      - lab/wikipedia-arg-2016-end-stats
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Measure end-of-tournament player-stat evidence
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          import concurrent.futures
          import json
          import re
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API='https://es.wikipedia.org/w/api.php'
          UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          CUTOFF='2016-06-02T00:00:00Z'
          CLUBS={
            'Aldosivi':['Club Atlético Aldosivi'],'Argentinos Juniors':['Asociación Atlética Argentinos Juniors'],
            'Arsenal de Sarandí':['Arsenal Fútbol Club','Arsenal de Sarandí'],'Atlético de Rafaela':['Asociación Mutual Social y Deportiva Atlético de Rafaela','Atlético de Rafaela'],
            'Atlético Tucumán':['Club Atlético Tucumán'],'Banfield':['Club Atlético Banfield'],'Belgrano de Córdoba':['Club Atlético Belgrano'],
            'Boca Juniors':['Club Atlético Boca Juniors'],'Colón':['Club Atlético Colón'],'Defensa y Justicia':['Club Social y Deportivo Defensa y Justicia'],
            'Estudiantes':['Club Estudiantes de La Plata','Estudiantes de La Plata'],'Gimnasia de La Plata':['Club de Gimnasia y Esgrima La Plata'],
            'Godoy Cruz':['Club Deportivo Godoy Cruz Antonio Tomba','Godoy Cruz Antonio Tomba'],'Huracán':['Club Atlético Huracán'],
            'Independiente':['Club Atlético Independiente'],'Lanús':['Club Atlético Lanús'],"Newell's Old Boys":["Club Atlético Newell's Old Boys"],
            'Olimpo':['Club Olimpo'],'Patronato':['Club Atlético Patronato de la Juventud Católica'],'Quilmes':['Quilmes Atlético Club'],
            'Racing Club':['Racing Club'],'River Plate':['Club Atlético River Plate'],'Rosario Central':['Club Atlético Rosario Central'],
            'San Lorenzo':['Club Atlético San Lorenzo de Almagro'],'San Martín de San Juan':['Club Atlético San Martín (San Juan)','Club Atlético San Martín de San Juan'],
            'Sarmiento de Junín':['Club Atlético Sarmiento (Junín)','Club Atlético Sarmiento de Junín'],'Temperley':['Club Atlético Temperley'],
            'Tigre':['Club Atlético Tigre'],'Unión de Santa Fe':['Club Atlético Unión (Santa Fe)','Club Atlético Unión'],'Vélez Sarsfield':['Club Atlético Vélez Sarsfield']}

          def fold(v):
              d=unicodedata.normalize('NFKD',v)
              return ''.join(c for c in d if not unicodedata.combining(c)).casefold()

          def clean(v):
              v=re.sub(r'<[^>]+>', '', v); v=re.sub(r"'{2,5}",'',v)
              v=re.sub(r'\[\[([^]|]+)\|([^]]+)\]\]',r'\2',v); v=re.sub(r'\[\[([^]]+)\]\]',r'\1',v)
              v=re.sub(r'\{\{[^{}]*\}\}','',v)
              return re.sub(r'\s+',' ',v).strip(' |!\n\t')

          def get_one(club,titles):
              last_error=None
              for title in titles:
                  params={'action':'query','prop':'revisions','titles':title,'redirects':'1','rvstart':CUTOFF,'rvdir':'older','rvlimit':'1','rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'}
                  url=f"{API}?{urllib.parse.urlencode(params)}"
                  for attempt in range(1,4):
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
                          with urllib.request.urlopen(req,timeout=12) as resp: payload=json.loads(resp.read())
                          page=payload.get('query',{}).get('pages',[{}])[0]; revs=page.get('revisions') or []
                          if not revs: break
                          rev=revs[0]; text=((rev.get('slots') or {}).get('main') or {}).get('content')
                          if isinstance(text,str): return club,{'requested_title':title,'resolved_title':page.get('title'),'pageid':page.get('pageid'),'revid':rev.get('revid'),'timestamp':rev.get('timestamp'),'text':text}
                          break
                      except Exception as exc:
                          last_error=type(exc).__name__
                          if attempt<3: time.sleep(attempt)
              return club,{'error':last_error or 'no_revision'}

          def classify(table):
              ft=fold(table)
              if 'nombre' not in ft:return None
              tokens=[t for t in ('partidos jugados','apariciones','minutos','goles','titular','suplente') if t in ft]
              if not tokens:return None
              headers=[]
              for line in table.splitlines():
                  if line.startswith('!'):
                      headers.extend(clean(p) for p in line.lstrip('!').split('!!') if clean(p))
              rows=[]
              for raw in re.split(r'(?m)^\|-.*$',table):
                  cells=[]
                  for line in raw.splitlines():
                      if line.startswith('|') and not line.startswith(('|-','|}')):
                          cell=line[1:].strip(); cell=cell.split('|',1)[1] if '|' in cell else cell; cells.append(clean(cell))
                  if len(cells)>=4:rows.append(cells[:8])
              return {'tokens':tokens,'headers':headers[:20],'data_row_count':len(rows),'sample_rows':rows[:5]}

          fetched=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(get_one,c,t) for c,t in CLUBS.items()]
              for future in concurrent.futures.as_completed(futures): fetched.append(future.result())

          report=[]; raw_dir=Path('probe_out/raw')
          for club,rev in sorted(fetched):
              if 'text' not in rev:
                  report.append({'club':club,'state':'no_revision',**rev});continue
              text=rev.pop('text'); safe=re.sub(r'[^a-z0-9]+','-',fold(club)).strip('-'); (raw_dir/f'{safe}.wikitext').write_text(text,encoding='utf-8')
              hs=[clean(m.group(2)) for m in re.finditer(r'(?m)^(={2,6})\s*(.*?)\s*\1\s*$',text)]
              stat_heads=[h for h in hs if any(x in fold(h) for x in ('estad','gole','partido','jugadores'))]
              candidates=[]
              for table in re.findall(r'(?ms)^\{\|.*?^\|\}',text):
                  c=classify(table)
                  if c:candidates.append(c)
              report.append({'club':club,'state':'revision_found',**rev,'stat_related_headings':stat_heads,'candidate_stat_tables':candidates,'candidate_stat_table_count':len(candidates)})

          summary={'cutoff':CUTOFF,'clubs_total':30,'clubs_with_revision':sum(r['state']=='revision_found' for r in report),'clubs_with_candidate_stat_table':sum(r.get('candidate_stat_table_count',0)>0 for r in report),'clubs_with_stat_related_heading':sum(bool(r.get('stat_related_headings')) for r in report),'rows':report}
          Path('probe_out/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k!='rows'},indent=2))
          for r in report:
              if r.get('candidate_stat_table_count',0): print('STAT_TABLE',r['club'],json.dumps(r['candidate_stat_tables'],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-end-stats-probe
          path: probe_out/
          if-no-files-found: error
          retention-days: 7
