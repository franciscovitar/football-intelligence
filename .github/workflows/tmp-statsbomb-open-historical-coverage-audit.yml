name: StatsBomb Open historical coverage audit

on:
  push:
    branches:
      - lab/statsbomb-open-historical-coverage-audit
    paths:
      - .github/workflows/tmp-statsbomb-open-historical-coverage-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Audit pinned StatsBomb Open catalogue and match coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/statsbomb-open-audit
          mkdir -p /tmp/statsbomb-open-audit/raw
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          OUT = Path('/tmp/statsbomb-open-audit')
          RAW = OUT / 'raw'
          SOURCE_SHA = 'b0bc9f22dd77c206ddedc1d742893b3bbe64baec'
          RAW_BASE = f'https://raw.githubusercontent.com/hudl/open-data/{SOURCE_SHA}'

          TARGETS = {
              ('Argentina', 'Liga Profesional'): ('ARG_LPF', None),
              ('England', 'Premier League'): ('ENG_PL', 380),
              ('Spain', 'La Liga'): ('ESP_LL', 380),
              ('Italy', 'Serie A'): ('ITA_SA', 380),
              ('Germany', '1. Bundesliga'): ('GER_BL1', 306),
              ('France', 'Ligue 1'): ('FRA_L1', 380),
          }

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          def fetch_optional(url: str) -> tuple[bool, bytes | None, int | None]:
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return True, response.read(), response.status
              except urllib.error.HTTPError as exc:
                  return False, exc.read(), exc.code

          competitions_raw = fetch(f'{RAW_BASE}/data/competitions.json')
          (RAW / 'competitions.json').write_bytes(competitions_raw)
          competitions = json.loads(competitions_raw)

          readme_raw = fetch(f'{RAW_BASE}/README.md')
          (RAW / 'README.md').write_bytes(readme_raw)

          rows = []
          absent_gap_targets = []
          present_gap_codes = set()

          for item in competitions:
              if not isinstance(item, dict):
                  continue
              key = (item.get('country_name'), item.get('competition_name'))
              target = TARGETS.get(key)
              if target is None:
                  continue
              code, expected_matches = target
              season_name = item.get('season_name')
              if not isinstance(season_name, str) or '/' not in season_name:
                  continue
              try:
                  start_year = int(season_name.split('/', 1)[0])
              except ValueError:
                  continue
              if not 2015 <= start_year <= 2022:
                  continue

              competition_id = item.get('competition_id')
              season_id = item.get('season_id')
              match_url = f'{RAW_BASE}/data/matches/{competition_id}/{season_id}.json'
              match_raw = fetch(match_url)
              match_path = RAW / f'matches-{code}-{season_name.replace("/", "-")}.json'
              match_path.write_bytes(match_raw)
              matches = json.loads(match_raw)
              if not isinstance(matches, list):
                  raise SystemExit(f'Unexpected matches root for {code} {season_name}')

              actual_matches = len(matches)
              if expected_matches is None:
                  completeness = 'unknown_expected_total'
                  coverage_ratio = None
              elif actual_matches == expected_matches:
                  completeness = 'full_by_match_count'
                  coverage_ratio = 1.0
              elif actual_matches < expected_matches:
                  completeness = 'partial_by_match_count'
                  coverage_ratio = actual_matches / expected_matches
              else:
                  completeness = 'over_expected_requires_review'
                  coverage_ratio = actual_matches / expected_matches

              sample = {
                  'match_id': None,
                  'events_available': None,
                  'lineups_available': None,
                  'event_count': None,
                  'lineup_team_count': None,
                  'event_types': [],
                  'shot_statsbomb_xg_present': None,
                  'sample_lineup_player_keys': [],
              }
              if matches:
                  first = matches[0]
                  match_id = first.get('match_id') if isinstance(first, dict) else None
                  sample['match_id'] = match_id
                  if isinstance(match_id, int):
                      event_ok, event_raw, event_status = fetch_optional(f'{RAW_BASE}/data/events/{match_id}.json')
                      lineup_ok, lineup_raw, lineup_status = fetch_optional(f'{RAW_BASE}/data/lineups/{match_id}.json')
                      sample['events_available'] = event_ok
                      sample['lineups_available'] = lineup_ok
                      sample['event_http_status'] = event_status
                      sample['lineup_http_status'] = lineup_status
                      if event_ok and event_raw is not None:
                          events = json.loads(event_raw)
                          sample['event_count'] = len(events) if isinstance(events, list) else None
                          if isinstance(events, list):
                              event_types = sorted({
                                  event.get('type', {}).get('name')
                                  for event in events
                                  if isinstance(event, dict)
                                  and isinstance(event.get('type'), dict)
                                  and isinstance(event.get('type', {}).get('name'), str)
                              })
                              sample['event_types'] = event_types
                              sample['shot_statsbomb_xg_present'] = any(
                                  isinstance(event, dict)
                                  and isinstance(event.get('shot'), dict)
                                  and event['shot'].get('statsbomb_xg') is not None
                                  for event in events
                              )
                      if lineup_ok and lineup_raw is not None:
                          lineups = json.loads(lineup_raw)
                          sample['lineup_team_count'] = len(lineups) if isinstance(lineups, list) else None
                          if isinstance(lineups, list) and lineups:
                              lineup = lineups[0].get('lineup') if isinstance(lineups[0], dict) else None
                              if isinstance(lineup, list) and lineup and isinstance(lineup[0], dict):
                                  sample['sample_lineup_player_keys'] = sorted(lineup[0].keys())

              if 2016 <= start_year <= 2021:
                  present_gap_codes.add(code)

              rows.append({
                  'competition_code': code,
                  'country_name': item.get('country_name'),
                  'competition_name': item.get('competition_name'),
                  'competition_id': competition_id,
                  'season_id': season_id,
                  'season_name': season_name,
                  'season_start_year': start_year,
                  'actual_match_count': actual_matches,
                  'expected_domestic_match_count': expected_matches,
                  'coverage_ratio': coverage_ratio,
                  'completeness': completeness,
                  'match_file_sha256': hashlib.sha256(match_raw).hexdigest(),
                  'sample': sample,
              })

          for code, _expected in TARGETS.values():
              if code not in present_gap_codes:
                  absent_gap_targets.append(code)

          rows.sort(key=lambda row: (row['competition_code'], row['season_start_year']))
          summary = {
              'source_repository': 'hudl/open-data',
              'source_commit': SOURCE_SHA,
              'catalogue_sha256': hashlib.sha256(competitions_raw).hexdigest(),
              'readme_sha256': hashlib.sha256(readme_raw).hexdigest(),
              'window': {'adjacent_start': 2015, 'primary_start': 2016, 'primary_end': 2021, 'adjacent_end': 2022},
              'rows': rows,
              'target_codes_without_catalogue_season_in_primary_gap': sorted(absent_gap_targets),
          }
          (OUT / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')

          manifest = {'source_repository': 'hudl/open-data', 'source_commit': SOURCE_SHA, 'files': []}
          for path in sorted(p for p in OUT.rglob('*') if p.is_file() and p.name != 'manifest.json'):
              raw = path.read_bytes()
              manifest['files'].append({
                  'path': str(path.relative_to(OUT)),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'byte_size': len(raw),
              })
          (OUT / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print('STATSBOMB OPEN HISTORICAL COVERAGE AUDIT')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload frozen audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: statsbomb-open-historical-coverage-audit-${{ github.run_id }}
          path: /tmp/statsbomb-open-audit
          if-no-files-found: error
          retention-days: 7
