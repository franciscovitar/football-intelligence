name: Core League Sync

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Historical backfill start date (YYYY-MM-DD). Must be supplied together with to_date. Leave both blank for the normal incremental run."
        required: false
        type: string
      to_date:
        description: "Historical backfill end date (YYYY-MM-DD). Must be supplied together with from_date. Leave both blank for the normal incremental run."
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: core-league-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Incremental core leagues
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CORE_SYNC_SEASON: ${{ vars.CORE_SYNC_SEASON }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Validate runtime configuration
        shell: bash
        run: |
          test -n "$API_FOOTBALL_KEY" || { echo "API_FOOTBALL_KEY secret is required"; exit 1; }
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is required"; exit 1; }
          test -n "$CORE_SYNC_SEASON" || { echo "CORE_SYNC_SEASON repository variable is required"; exit 1; }
      - working-directory: analytics
        run: uv sync --locked
      - name: Synchronize core leagues
        working-directory: analytics
        env:
          MANUAL_FROM_DATE: ${{ github.event.inputs.from_date }}
          MANUAL_TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          set -euo pipefail
          args=(--season "$CORE_SYNC_SEASON")
          if [[ -n "${MANUAL_FROM_DATE:-}" || -n "${MANUAL_TO_DATE:-}" ]]; then
            if [[ -z "${MANUAL_FROM_DATE:-}" || -z "${MANUAL_TO_DATE:-}" ]]; then
              echo "Both from_date and to_date must be supplied together for a manual historical run" >&2
              exit 1
            fi
            args+=(--from-date "$MANUAL_FROM_DATE" --to-date "$MANUAL_TO_DATE")
          else
            args+=(--lookback-days 3)
          fi
          args+=(
            --max-fixtures-per-league 8
            --request-budget 60
            --raw-dir "$RUNNER_TEMP/core-sync-raw"
            --report "$RUNNER_TEMP/core-sync-report.json"
          )
          uv run football-intelligence-sync "${args[@]}"
      - name: Calculate player analytics
        working-directory: analytics
        run: >-
          uv run football-intelligence-player-analytics
          --season "$CORE_SYNC_SEASON"
          --report "$RUNNER_TEMP/player-analytics-report.json"
      - name: Calculate team analytics
        working-directory: analytics
        run: >-
          uv run football-intelligence-team-analytics
          --season "$CORE_SYNC_SEASON"
          --report "$RUNNER_TEMP/team-analytics-report.json"
      - name: Calculate tactical intelligence
        working-directory: analytics
        run: >-
          uv run football-intelligence-tactical-analytics
          --season "$CORE_SYNC_SEASON"
          --report "$RUNNER_TEMP/tactical-analytics-report.json"
      - name: Calculate expectation and meta analytics
        working-directory: analytics
        run: >-
          uv run football-intelligence-meta-analytics
          --season "$CORE_SYNC_SEASON"
          --report "$RUNNER_TEMP/meta-analytics-report.json"
      - name: Calculate rating intelligence
        working-directory: analytics
        run: >-
          uv run football-intelligence-rating-analytics
          --season "$CORE_SYNC_SEASON"
          --report "$RUNNER_TEMP/rating-analytics-report.json"
      - name: Run V1 Validation
        working-directory: analytics
        run: >-
          uv run football-intelligence-validate-v1
          --report "$RUNNER_TEMP/validation-report.json"
      - name: Upload sync evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-sync-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-sync-report.json
            ${{ runner.temp }}/player-analytics-report.json
            ${{ runner.temp }}/team-analytics-report.json
            ${{ runner.temp }}/tactical-analytics-report.json
            ${{ runner.temp }}/meta-analytics-report.json
            ${{ runner.temp }}/rating-analytics-report.json
            ${{ runner.temp }}/validation-report.json
            ${{ runner.temp }}/core-sync-raw
          if-no-files-found: warn
          retention-days: 30
