name: Fix Historical Promotion Style

on:
  push:
    branches:
      - feat/generalize-historical-player-production-promotion
    paths:
      - .github/workflows/_fix-historical-promotion-style.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/generalize-historical-player-production-promotion
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Apply Ruff safe fixes and formatting
        working-directory: analytics
        run: |
          uv run ruff check --fix src/football_intelligence/jobs/promote_historical_player_v2.py src/football_intelligence/jobs/historical_player_promotion_spec.py tests/test_promote_historical_player_v2.py
          uv run ruff format src/football_intelligence/jobs/promote_historical_player_v2.py src/football_intelligence/jobs/historical_player_promotion_spec.py tests/test_promote_historical_player_v2.py
          uv run ruff check src/football_intelligence/jobs/promote_historical_player_v2.py src/football_intelligence/jobs/historical_player_promotion_spec.py tests/test_promote_historical_player_v2.py
          uv run ruff format --check src/football_intelligence/jobs/promote_historical_player_v2.py src/football_intelligence/jobs/historical_player_promotion_spec.py tests/test_promote_historical_player_v2.py
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_fix-historical-promotion-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize historical promotion code"
          git push origin HEAD:feat/generalize-historical-player-production-promotion
