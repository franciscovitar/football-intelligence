# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab RSSSF ARG_LPF 2016 match backbone

on:
  push:
    branches:
      - lab/rsssf-arg-2016-match-backbone
    paths:
      - .github/workflows/lab-rsssf-arg-2016-match-backbone.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Fetch and parse bounded Primera Division 2016 section
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          import urllib.request
          from collections import Counter
          from datetime import date
          from html.parser import HTMLParser
          from pathlib import Path

          URL = "https://www.rsssf.org/tablesa/arg2016.html"
          UA = "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)"
          MONTHS = {"Jan":1,"Feb":2,"Mar":3,"Apr":4,"May":5,"Jun":6,"Jul":7,"Aug":8,"Sep":9,"Oct":10,"Nov":11,"Dec":12}

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {"br","p","div","pre","h1","h2","h3","h4","hr"}:
                      self.parts.append("\n")
              def handle_endtag(self, tag):
                  if tag.lower() in {"p","div","pre","h1","h2","h3","h4"}:
                      self.parts.append("\n")
              def handle_data(self, data):
                  self.parts.append(data)
              def text(self):
                  return html.unescape("".join(self.parts)).replace("\r\n","\n").replace("\r","\n")

          def fetch():
              req=urllib.request.Request(URL,headers={"User-Agent":UA,"Accept":"text/html,*/*;q=0.8"})
              for attempt in range(1,5):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          status=int(resp.status); body=resp.read(); ctype=resp.headers.get("Content-Type","")
                      if status != 200:
                          raise RuntimeError(f"HTTP {status}")
                      return body,ctype
                  except Exception:
                      if attempt==4: raise
                      time.sleep(attempt*1.25)
              raise AssertionError("unreachable")

          raw,content_type=fetch()
          digest="sha256:"+hashlib.sha256(raw).hexdigest()
          parser=TextExtractor(); parser.feed(raw.decode("utf-8",errors="replace")); text=parser.text()

          championship=text.find("Campeonato de Primera División 2016")
          if championship < 0:
              raise RuntimeError("Primera Division 2016 heading not found")
          start=text.find("Round 1:", championship)
          if start < 0:
              raise RuntimeError("Primera Division Round 1 not found")
          end=text.find("Relegation", start)
          if end < 0:
              raise RuntimeError("Primera Division section end not found")
          section=text[start:end]
          lines=[re.sub(r"[ \t\u00a0]+"," ",ln).strip() for ln in section.splitlines()]
          lines=[ln for ln in lines if ln]

          date_re=re.compile(r"^\[(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})(?:,)?\s+[^\]]+\]$")
          round_re=re.compile(r"^Round\s+(\d+):$")
          match_re=re.compile(r"^(?P<home>.+?)\s+(?P<h>\d+)\s*-\s*(?P<a>\d+)\s+(?P<away>.+?)\s+\[(?P<venue>[^\]]+)\](?:\s*.*)?$")

          current_round=None
          current_group=None
          current_date=None
          final_mode=False
          matches=[]
          for ln in lines:
              rm=round_re.match(ln)
              if rm:
                  current_round=int(rm.group(1)); current_group=None; final_mode=False; continue
              if ln in {"Group 1","Group 2","Intergroup"}:
                  current_group=ln; continue
              if ln == "Final" and current_round == 17:
                  final_mode=True; current_group="Final"; continue
              dm=date_re.match(ln)
              if dm:
                  month=MONTHS[dm.group(1)]; day=int(dm.group(2)); current_date=date(2016,month,day).isoformat(); continue
              mm=match_re.match(ln)
              if not mm or current_round is None:
                  continue
              home=mm.group("home").strip(); away=mm.group("away").strip(); venue=mm.group("venue").strip()
              if current_round <= 16:
                  phase={"Group 1":"regular_group_1","Group 2":"regular_group_2","Intergroup":"regular_intergroup"}.get(current_group,"regular_unknown")
              elif current_round == 17 and final_mode:
                  phase="final"
              elif current_round == 17:
                  phase="third_place_playoff"
              else:
                  phase="unexpected"
              stable_key=f"{current_date}|{home}|{away}|{mm.group('h')}-{mm.group('a')}"
              matches.append({
                  "source":"RSSSF",
                  "source_url":URL,
                  "source_external_id":"rsssf-arg2016-"+hashlib.sha256(stable_key.encode()).hexdigest()[:20],
                  "match_date":current_date,
                  "kickoff_time_known":False,
                  "round":current_round,
                  "subgroup":current_group,
                  "phase":phase,
                  "home_team_raw":home,
                  "away_team_raw":away,
                  "home_score":int(mm.group("h")),
                  "away_score":int(mm.group("a")),
                  "venue_raw":venue,
                  "source_line":ln,
              })

          raw_teams=sorted({m["home_team_raw"] for m in matches}|{m["away_team_raw"] for m in matches})
          round_counts=Counter(m["round"] for m in matches)
          phase_counts=Counter(m["phase"] for m in matches)
          regular=[m for m in matches if m["round"] and m["round"]<=16]
          appearances=Counter()
          for m in regular:
              appearances[m["home_team_raw"]]+=1; appearances[m["away_team_raw"]]+=1

          summary={
              "status":"PASS",
              "source":{
                  "provider":"RSSSF",
                  "url":URL,
                  "raw_sha256":digest,
                  "content_type":content_type,
                  "document_author":"Osvaldo José Gorgazzi",
                  "reuse_notice":"Document states it may be copied in whole or part with proper acknowledgement to the author; preserve attribution.",
              },
              "scope":{
                  "competition_code":"ARG_LPF",
                  "season_label":"2016",
                  "section_start":"Campeonato de Primera División 2016 -> Round 1",
                  "section_end":"Relegation heading",
              },
              "counts":{
                  "matches_total":len(matches),
                  "regular_matches":len(regular),
                  "raw_team_labels":len(raw_teams),
                  "matches_with_date":sum(bool(m["match_date"]) for m in matches),
                  "matches_with_venue":sum(bool(m["venue_raw"]) for m in matches),
              },
              "round_counts":{str(k):v for k,v in sorted(round_counts.items())},
              "phase_counts":dict(sorted(phase_counts.items())),
              "raw_team_labels":raw_teams,
              "regular_raw_team_match_counts":dict(sorted(appearances.items())),
              "final_matches":[m for m in matches if m["round"]==17],
              "dto_note":"RSSSF publishes match date but not kickoff time. Do not fabricate a datetime/timezone merely to populate MatchRecord.kickoff_at; a production integration needs an explicit date-precision policy.",
              "non_claims":[
                  "This probe does not create canonical team mappings.",
                  "Raw RSSSF team labels are provider-local until exact mappings are reviewed.",
                  "No player appearance/minute claim is derived from fixture rows.",
                  "This workflow is disposable spike code, not a production adapter.",
              ],
          }

          # Hard gates: the source's own final tables establish 30 clubs x 16 regular matches / 2 = 240, plus 2 placement/final matches.
          assert len(matches)==242, summary
          assert len(regular)==240, summary
          assert round_counts==Counter({**{i:15 for i in range(1,17)},17:2}), round_counts
          assert phase_counts["third_place_playoff"]==1 and phase_counts["final"]==1, phase_counts
          assert all(m["match_date"] for m in matches), "missing date"
          assert all(m["venue_raw"] for m in matches), "missing venue"
          assert len({m["source_external_id"] for m in matches})==242, "duplicate source ids"

          Path("probe_out/summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          Path("probe_out/matches.json").write_text(json.dumps(matches,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"counts":summary["counts"],"round_counts":summary["round_counts"],"phase_counts":summary["phase_counts"],"raw_sha256":digest},ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: rsssf-arg-2016-match-backbone-${{ github.run_id }}
          path: probe_out/
          if-no-files-found: error
          retention-days: 7
