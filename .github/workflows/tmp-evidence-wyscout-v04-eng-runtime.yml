name: Temporary Final Third Missing Propagation Fix

on:
  push:
    branches:
      - feat/wyscout-final-third-v04

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Apply exact missing-propagation fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          derived = "analytics/src/football_intelligence/statistical_engine/derived_metrics.py"
          replace_once(
              derived,
              '_COMPLETE_OBSERVATION_REQUIRED_RAW_METRICS = frozenset({"long_passes_accurate"})',
              '_COMPLETE_OBSERVATION_REQUIRED_RAW_METRICS = frozenset(\n'
              '    {"long_passes_accurate", "passes_into_final_third"}\n'
              ')',
          )

          test_path = "analytics/tests/test_wyscout_final_third_promotion.py"
          replace_once(
              test_path,
              "from __future__ import annotations\n\n",
              "from __future__ import annotations\n\n"
              "from datetime import UTC, datetime\n\n",
          )
          replace_once(
              test_path,
              "from football_intelligence.data_mesh.adapters.wyscout_open import (\n"
              "    ESP_LL_SCOPE,\n"
              "    parse_player_match_observations,\n"
              ")\n",
              "from football_intelligence.data_mesh.adapters.wyscout_open import (\n"
              "    ESP_LL_SCOPE,\n"
              "    parse_player_match_observations,\n"
              ")\n"
              "from football_intelligence.player_analytics.engine_v2 import (\n"
              "    calculate_player_analytics_v2_result,\n"
              ")\n"
              "from football_intelligence.player_analytics.models import PlayerObservation\n",
          )
          file = Path(test_path)
          text = file.read_text(encoding="utf-8")
          marker = "def test_player_v2_never_publishes_partial_final_third_window_as_exact"
          if marker in text:
              raise SystemExit(f"{test_path}: regression test already exists")
          text += '''\n\ndef _v2_observation(\n    match_id: int, passes_into_final_third: float | None\n) -> PlayerObservation:\n    return PlayerObservation(\n        player_id=77,\n        player_name="Exact Final Third Player",\n        match_id=match_id,\n        kickoff_at=datetime(2018, 1, match_id, tzinfo=UTC),\n        team_id=100,\n        minutes=90,\n        listed_position="CM",\n        possession_pct=50.0,\n        stats={"passes_into_final_third": passes_into_final_third},\n    )\n\n\ndef test_player_v2_never_publishes_partial_final_third_window_as_exact() -> None:\n    partial = calculate_player_analytics_v2_result(\n        [_v2_observation(1, 2.0), _v2_observation(2, None)],\n        scope_key="competition:ENG_PL:2017/18",\n    )\n    assert not any(\n        feature.window == "season" and feature.metric_name == "passes_into_final_third"\n        for feature in partial.features\n    )\n\n    complete = calculate_player_analytics_v2_result(\n        [_v2_observation(1, 2.0), _v2_observation(2, 0.0)],\n        scope_key="competition:ENG_PL:2017/18",\n    )\n    season_feature = next(\n        feature\n        for feature in complete.features\n        if feature.window == "season" and feature.metric_name == "passes_into_final_third"\n    )\n    assert season_feature.raw_value == 2.0\n'''
          file.write_text(text, encoding="utf-8")
          PY
      - name: Format analytics code and tests
        working-directory: analytics
        run: |
          uv sync --dev --locked
          uv run ruff format src tests
          uv run ruff check .
          uv run ruff format --check .
      - name: Remove temporary evidence helpers and commit product fix
        run: |
          rm -f scripts/tmp_evidence_wyscout_v04_eng_runtime.py
          rm -f .github/workflows/tmp-evidence-wyscout-v04-eng-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve missing final-third evidence across windows"
          git push origin HEAD:feat/wyscout-final-third-v04
