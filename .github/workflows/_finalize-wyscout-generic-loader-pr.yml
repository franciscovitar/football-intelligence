name: Finalize Wyscout Generic Loader PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_finalize-wyscout-generic-loader-pr.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Reuse proven structural refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('.github/workflows/_apply-wyscout-generic-loader-pr.yml').read_text(
              encoding='utf-8'
          )
          start = "          python - <<'PY'\n"
          end = "          PY\n      - name: Remove temporary workflows\n"
          if runner.count(start) != 1 or runner.count(end) != 1:
              raise RuntimeError('could not extract proven structural refactor uniquely')
          script = runner.split(start, 1)[1].split(end, 1)[0]
          lines = script.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<generic-loader-refactor>', 'exec'), {'__name__': '__main__'})

          helper_path = Path('analytics/src/football_intelligence/jobs/wyscout_historical_scope.py')
          helper = helper_path.read_text(encoding='utf-8')
          old = '''        elif observation.entity_type == "player":
              if observation.entity_source_id.rsplit(":", maxsplit=1)[-1] == "0":
                  sentinel_player_observations += 1
          '''
          new = '''        elif (
              observation.entity_type == "player"
              and observation.entity_source_id.rsplit(":", maxsplit=1)[-1] == "0"
          ):
              sentinel_player_observations += 1
          '''
          if helper.count(old) != 1:
              raise RuntimeError('SIM102 helper patch did not match exactly once')
          helper_path.write_text(helper.replace(old, new), encoding='utf-8')
          PY
      - name: Remove temporary workflows
        run: >-
          rm .github/workflows/_apply-wyscout-generic-loader.yml
          .github/workflows/_apply-wyscout-generic-loader-pr.yml
          .github/workflows/_finalize-wyscout-generic-loader-pr.yml
      - name: Install analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Format touched Python
        working-directory: analytics
        run: >-
          uv run ruff format
          src/football_intelligence/jobs/load_wyscout_historical.py
          src/football_intelligence/jobs/wyscout_historical_scope.py
      - name: Apply safe Ruff fixes
        working-directory: analytics
        run: >-
          uv run ruff check --fix
          src/football_intelligence/jobs/load_wyscout_historical.py
          src/football_intelligence/jobs/wyscout_historical_scope.py
      - name: Recheck lint and formatting
        working-directory: analytics
        run: |
          uv run ruff check src/football_intelligence/jobs/load_wyscout_historical.py src/football_intelligence/jobs/wyscout_historical_scope.py
          uv run ruff format --check src/football_intelligence/jobs/load_wyscout_historical.py src/football_intelligence/jobs/wyscout_historical_scope.py
      - name: Typecheck analytics source
        working-directory: analytics
        run: uv run mypy src
      - name: Run focused Wyscout tests
        working-directory: analytics
        run: >-
          uv run pytest
          tests/test_wyscout_historical_normalization.py
          tests/test_wyscout_historical_generic_scope.py
          tests/test_wyscout_open_scopes.py
      - name: Commit verified loader changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: generalize Wyscout historical local loader"
          git push origin HEAD:${{ github.head_ref }}
