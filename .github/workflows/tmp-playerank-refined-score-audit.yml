name: PlayeRank refined-score audit

on:
  push:
    branches:
      - lab/playerank-refined-score-audit
    paths:
      - .github/workflows/tmp-playerank-refined-score-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Audit Figshare PlayeRank artifact against Wyscout Open ids
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/playerank-audit
          mkdir -p /tmp/playerank-audit/raw
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import math
          import urllib.request
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          OUT = Path('/tmp/playerank-audit')
          RAW = OUT / 'raw'
          FIGSHARE_ARTICLE = 'https://api.figshare.com/v2/articles/9361148'
          WY_MATCHES = 'https://ndownloader.figshare.com/files/14464622'
          WY_PLAYERS = 'https://ndownloader.figshare.com/files/15073721'

          def fetch(url: str) -> bytes:
              req = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          metadata_raw = fetch(FIGSHARE_ARTICLE)
          (RAW / 'figshare-article-9361148.json').write_bytes(metadata_raw)
          metadata = json.loads(metadata_raw)

          files = metadata.get('files') or []
          if not files:
              raise SystemExit('Figshare metadata contains no files')

          downloaded = []
          play_rows = None
          play_file_name = None
          for item in files:
              url = item.get('download_url')
              name = item.get('name')
              if not isinstance(url, str) or not isinstance(name, str):
                  raise SystemExit('Unexpected Figshare file metadata')
              raw = fetch(url)
              path = RAW / name
              path.write_bytes(raw)
              downloaded.append({
                  'name': name,
                  'download_url': url,
                  'size': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'figshare_id': item.get('id'),
                  'figshare_md5': item.get('computed_md5'),
              })
              try:
                  candidate = json.loads(raw)
              except (json.JSONDecodeError, UnicodeDecodeError):
                  continue
              if isinstance(candidate, list) and candidate and isinstance(candidate[0], dict) and 'playerankScore' in candidate[0]:
                  if play_rows is not None:
                      raise SystemExit('More than one PlayeRank JSON candidate found')
                  play_rows = candidate
                  play_file_name = name

          if play_rows is None:
              raise SystemExit('Could not identify PlayeRank score JSON in Figshare files')

          matches_zip_raw = fetch(WY_MATCHES)
          matches_zip_sha256 = hashlib.sha256(matches_zip_raw).hexdigest()
          match_to_comp = {}
          competition_match_counts = Counter()
          with zipfile.ZipFile(io.BytesIO(matches_zip_raw)) as archive:
              for member in sorted(archive.namelist()):
                  if not member.lower().endswith('.json'):
                      continue
                  base = Path(member).name
                  if not base.startswith('matches_'):
                      continue
                  comp = base[len('matches_'):-len('.json')]
                  rows = json.loads(archive.read(member))
                  for row in rows:
                      match_id = row.get('wyId')
                      if not isinstance(match_id, int):
                          raise SystemExit(f'Non-integer Wyscout match id in {member}')
                      if match_id in match_to_comp and match_to_comp[match_id] != comp:
                          raise SystemExit(f'Wyscout match id {match_id} appears in multiple competitions')
                      match_to_comp[match_id] = comp
                      competition_match_counts[comp] += 1

          players_raw = fetch(WY_PLAYERS)
          players_sha256 = hashlib.sha256(players_raw).hexdigest()
          players = json.loads(players_raw)
          wyscout_player_ids = {row.get('wyId') for row in players if isinstance(row, dict) and isinstance(row.get('wyId'), int)}

          required = {'goalScored', 'playerankScore', 'matchId', 'playerId', 'roleCluster', 'minutesPlayed'}
          missing_required = Counter()
          score_values = []
          score_nulls = 0
          minutes_values = []
          player_ids = set()
          match_ids = set()
          role_counts = Counter()
          rows_by_comp = Counter()
          players_by_comp = defaultdict(set)
          matches_by_comp = defaultdict(set)
          unmatched_matches = set()
          unmatched_players = set()
          duplicate_keys = Counter()

          for row in play_rows:
              if not isinstance(row, dict):
                  raise SystemExit('PlayeRank root contains a non-object row')
              for field in required:
                  if field not in row:
                      missing_required[field] += 1
              match_id = row.get('matchId')
              player_id = row.get('playerId')
              player_ids.add(player_id)
              match_ids.add(match_id)
              duplicate_keys[(match_id, player_id)] += 1
              score = row.get('playerankScore')
              if score is None:
                  score_nulls += 1
              elif isinstance(score, (int, float)) and math.isfinite(float(score)):
                  score_values.append(float(score))
              else:
                  raise SystemExit(f'Unexpected playerankScore value: {score!r}')
              minutes = row.get('minutesPlayed')
              if isinstance(minutes, (int, float)):
                  minutes_values.append(float(minutes))
              role_counts[str(row.get('roleCluster'))] += 1

              comp = match_to_comp.get(match_id)
              if comp is None:
                  unmatched_matches.add(match_id)
              else:
                  rows_by_comp[comp] += 1
                  matches_by_comp[comp].add(match_id)
                  players_by_comp[comp].add(player_id)
              if player_id not in wyscout_player_ids:
                  unmatched_players.add(player_id)

          duplicate_pairs = sum(1 for n in duplicate_keys.values() if n > 1)
          duplicate_extra_rows = sum(n - 1 for n in duplicate_keys.values() if n > 1)

          target_map = {
              'England': 'ENG_PL',
              'Spain': 'ESP_LL',
              'Italy': 'ITA_SA',
              'Germany': 'GER_BL1',
              'France': 'FRA_L1',
          }
          target_coverage = {}
          for wyscout_name, fi_code in target_map.items():
              target_coverage[fi_code] = {
                  'wyscout_dataset_name': wyscout_name,
                  'playerank_rows': rows_by_comp[wyscout_name],
                  'unique_matches': len(matches_by_comp[wyscout_name]),
                  'wyscout_matches': competition_match_counts[wyscout_name],
                  'unique_players': len(players_by_comp[wyscout_name]),
              }

          summary = {
              'source': 'PlayeRanks',
              'figshare_article_id': 9361148,
              'figshare_url': metadata.get('url_private_api') or metadata.get('url'),
              'title': metadata.get('title'),
              'doi': metadata.get('doi'),
              'license': metadata.get('license'),
              'published_date': metadata.get('published_date'),
              'modified_date': metadata.get('modified_date'),
              'play_file_name': play_file_name,
              'figshare_files': downloaded,
              'rows': len(play_rows),
              'unique_match_ids': len(match_ids),
              'unique_player_ids': len(player_ids),
              'score_nulls': score_nulls,
              'score_min': min(score_values) if score_values else None,
              'score_max': max(score_values) if score_values else None,
              'score_mean': sum(score_values) / len(score_values) if score_values else None,
              'minutes_min': min(minutes_values) if minutes_values else None,
              'minutes_max': max(minutes_values) if minutes_values else None,
              'role_counts': dict(sorted(role_counts.items())),
              'required_field_missing_counts': dict(sorted(missing_required.items())),
              'unmatched_wyscout_match_ids': len(unmatched_matches),
              'unmatched_wyscout_player_ids': len(unmatched_players),
              'duplicate_match_player_pairs': duplicate_pairs,
              'duplicate_extra_rows': duplicate_extra_rows,
              'competition_rows': dict(sorted(rows_by_comp.items())),
              'target_coverage': target_coverage,
              'wyscout_matches_zip_sha256': matches_zip_sha256,
              'wyscout_players_sha256': players_sha256,
          }

          (OUT / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          manifest = {'files': []}
          for path in sorted(p for p in OUT.rglob('*') if p.is_file() and p.name != 'manifest.json'):
              raw = path.read_bytes()
              manifest['files'].append({
                  'path': str(path.relative_to(OUT)),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'byte_size': len(raw),
              })
          (OUT / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps(summary, indent=2, sort_keys=True))
          if unmatched_matches:
              raise SystemExit(f'{len(unmatched_matches)} PlayeRank match ids do not resolve in Wyscout Open matches')
          if unmatched_players:
              raise SystemExit(f'{len(unmatched_players)} PlayeRank player ids do not resolve in Wyscout Open players')
          if duplicate_pairs:
              raise SystemExit(f'{duplicate_pairs} duplicate (matchId, playerId) pairs require semantic review')
          PY

      - name: Upload frozen audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playerank-refined-score-audit-${{ github.run_id }}
          path: /tmp/playerank-audit
          if-no-files-found: error
          retention-days: 7
