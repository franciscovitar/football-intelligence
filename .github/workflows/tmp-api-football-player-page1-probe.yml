name: API-Football player page-1 probe

on:
  push:
    branches:
      - lab/low-cost-player-history-provider-audit
    paths:
      - .github/workflows/tmp-api-football-player-page1-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Check secret availability
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY is not configured; refusing to make provider calls." >&2
            exit 1
          fi
          echo "API_FOOTBALL_KEY is configured; exactly two bounded /players calls may run."

      - name: Run exactly two page-1 player probes
        shell: bash
        run: |
          rm -rf /tmp/api-football-player-page1
          mkdir -p /tmp/api-football-player-page1
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = "https://v3.football.api-sports.io/players"
          KEY = os.environ["API_FOOTBALL_KEY"]
          OUT = Path("/tmp/api-football-player-page1")
          TARGETS = (
              ("ARG_LPF", 128, 2024),
              ("ENG_PL", 39, 2024),
          )

          summaries = []
          provider_failed = False

          for code, league_id, season in TARGETS:
              query = urlencode({"league": league_id, "season": season, "page": 1})
              url = f"{BASE}?{query}"
              request = Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)",
                      "x-apisports-key": KEY,
                  },
                  method="GET",
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read()
                      status = response.status
              except HTTPError as exc:
                  raw = exc.read()
                  status = exc.code
              except (URLError, TimeoutError) as exc:
                  raise SystemExit(f"NETWORK FAILURE before completing both bounded calls: {exc}") from exc

              raw_path = OUT / f"{code.lower()}-{season}-page1.json"
              raw_path.write_bytes(raw)

              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError as exc:
                  summaries.append(
                      {
                          "competition_code": code,
                          "league_id": league_id,
                          "season": season,
                          "http_status": status,
                          "valid_json": False,
                          "sha256": hashlib.sha256(raw).hexdigest(),
                          "byte_size": len(raw),
                      }
                  )
                  provider_failed = True
                  continue

              errors = payload.get("errors") if isinstance(payload, dict) else "non-object-root"
              response_rows = payload.get("response", []) if isinstance(payload, dict) else []
              paging = payload.get("paging", {}) if isinstance(payload, dict) else {}
              results = payload.get("results") if isinstance(payload, dict) else None

              first_player_keys = []
              first_statistics_keys = []
              first_games_keys = []
              first_sample = None
              if isinstance(response_rows, list) and response_rows:
                  first = response_rows[0]
                  if isinstance(first, dict):
                      player = first.get("player")
                      statistics = first.get("statistics")
                      if isinstance(player, dict):
                          first_player_keys = sorted(player.keys())
                      if isinstance(statistics, list) and statistics and isinstance(statistics[0], dict):
                          stat0 = statistics[0]
                          first_statistics_keys = sorted(stat0.keys())
                          games = stat0.get("games")
                          if isinstance(games, dict):
                              first_games_keys = sorted(games.keys())
                          team = stat0.get("team")
                          league = stat0.get("league")
                          first_sample = {
                              "provider_player_id": player.get("id") if isinstance(player, dict) else None,
                              "player_name": player.get("name") if isinstance(player, dict) else None,
                              "team_id": team.get("id") if isinstance(team, dict) else None,
                              "team_name": team.get("name") if isinstance(team, dict) else None,
                              "league_id": league.get("id") if isinstance(league, dict) else None,
                              "league_name": league.get("name") if isinstance(league, dict) else None,
                          }

              summary = {
                  "competition_code": code,
                  "league_id": league_id,
                  "season": season,
                  "http_status": status,
                  "valid_json": True,
                  "provider_errors": errors,
                  "results": results,
                  "paging_current": paging.get("current") if isinstance(paging, dict) else None,
                  "paging_total": paging.get("total") if isinstance(paging, dict) else None,
                  "response_rows": len(response_rows) if isinstance(response_rows, list) else None,
                  "first_player_keys": first_player_keys,
                  "first_statistics_keys": first_statistics_keys,
                  "first_games_keys": first_games_keys,
                  "first_sample": first_sample,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "byte_size": len(raw),
              }
              summaries.append(summary)
              if status != 200 or errors not in (None, {}, []):
                  provider_failed = True

          summary_raw = (json.dumps({"requests_made": 2, "targets": summaries}, indent=2, sort_keys=True) + "\n").encode()
          (OUT / "summary.json").write_bytes(summary_raw)

          manifest = {
              "source_code": "api_football",
              "source_reference": BASE,
              "requests_made": 2,
              "data_grain": "player_season_page",
              "files": [],
          }
          for path in sorted(OUT.glob("*.json")):
              if path.name == "manifest.json":
                  continue
              data = path.read_bytes()
              manifest["files"].append(
                  {
                      "path": path.name,
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "byte_size": len(data),
                  }
              )
          (OUT / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")

          print("API-FOOTBALL PLAYER PAGE-1 PROBE")
          print(json.dumps({"requests_made": 2, "targets": summaries}, indent=2, sort_keys=True))
          if provider_failed:
              raise SystemExit("At least one bounded provider response failed; artifact retained for evidence.")
          PY

      - name: Verify no API key was persisted
        if: always()
        shell: bash
        run: |
          if [ -d /tmp/api-football-player-page1 ] && grep -R --fixed-strings -- "$API_FOOTBALL_KEY" /tmp/api-football-player-page1; then
            echo "Secret leakage detected in probe output" >&2
            exit 1
          fi
          echo "No API key persisted in probe output."

      - name: Upload bounded probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-football-player-page1-${{ github.run_id }}
          path: /tmp/api-football-player-page1
          if-no-files-found: error
          retention-days: 7
