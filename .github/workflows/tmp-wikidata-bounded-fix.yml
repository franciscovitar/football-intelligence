name: Temporary Wikidata Bounded Fix

on:
  push:
    branches:
      - fix/wikidata-bounded-collection-resilience

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Sync analytics environment
        working-directory: analytics
        run: uv sync --dev --locked

      - name: Apply exact regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path('analytics/src/football_intelligence/jobs/collect_wikidata_profiles.py')
          text = collector.read_text(encoding='utf-8')
          if 'import json\nimport time\n' not in text:
              old = 'import hashlib\nimport json\nfrom dataclasses import asdict\n'
              new = 'import hashlib\nimport json\nimport time\nfrom dataclasses import asdict\n'
              assert old in text
              text = text.replace(old, new, 1)

          old_constants = '''MAX_QIDS = 50\nHTTP_TIMEOUT_SECONDS = 30\nUSER_AGENT = "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)"\n'''
          new_constants = '''MAX_QIDS = 50\nHTTP_TIMEOUT_SECONDS = 30\nMAX_ATTEMPTS = 4\nDEFAULT_RETRY_DELAY_SECONDS = 5.0\nMAX_RETRY_DELAY_SECONDS = 30.0\nRETRYABLE_HTTP_STATUSES = {429, 500, 502, 503, 504}\nUSER_AGENT = "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)"\n'''
          if 'RETRYABLE_HTTP_STATUSES' not in text:
              assert old_constants in text
              text = text.replace(old_constants, new_constants, 1)

          old_fetch = '''def _fetch_entity(qid: str) -> bytes:\n    url = f"{ENTITY_DATA_REFERENCE}/{qid}.json"\n    request = Request(\n        url,\n        headers={\n            "Accept": "application/json",\n            "User-Agent": USER_AGENT,\n        },\n        method="GET",\n    )\n    try:\n        with urlopen(request, timeout=HTTP_TIMEOUT_SECONDS) as response:\n            return cast(bytes, response.read())\n    except HTTPError as exc:\n        retry_after = exc.headers.get("Retry-After")\n        suffix = f"; Retry-After={retry_after}" if retry_after else ""\n        raise WikidataCollectionError(f"{qid} HTTP {exc.code}{suffix}") from exc\n    except URLError as exc:\n        raise WikidataCollectionError(f"{qid} network error: {exc.reason}") from exc\n'''
          new_fetch = '''def _fetch_entity(qid: str) -> bytes:\n    url = f"{ENTITY_DATA_REFERENCE}/{qid}.json"\n    for attempt in range(1, MAX_ATTEMPTS + 1):\n        request = Request(\n            url,\n            headers={\n                "Accept": "application/json",\n                "User-Agent": USER_AGENT,\n            },\n            method="GET",\n        )\n        try:\n            with urlopen(request, timeout=HTTP_TIMEOUT_SECONDS) as response:\n                return cast(bytes, response.read())\n        except HTTPError as exc:\n            retry_after = exc.headers.get("Retry-After")\n            if exc.code not in RETRYABLE_HTTP_STATUSES or attempt == MAX_ATTEMPTS:\n                suffix = f"; Retry-After={retry_after}" if retry_after else ""\n                raise WikidataCollectionError(f"{qid} HTTP {exc.code}{suffix}") from exc\n            time.sleep(_retry_delay(attempt=attempt, retry_after=retry_after))\n        except (URLError, TimeoutError) as exc:\n            if attempt == MAX_ATTEMPTS:\n                reason = exc.reason if isinstance(exc, URLError) else str(exc)\n                raise WikidataCollectionError(f"{qid} network error: {reason}") from exc\n            time.sleep(_retry_delay(attempt=attempt, retry_after=None))\n\n    raise AssertionError("bounded Wikidata fetch exhausted without returning or raising")\n\n\ndef _retry_delay(*, attempt: int, retry_after: str | None) -> float:\n    if retry_after and retry_after.isdigit():\n        return min(float(retry_after), MAX_RETRY_DELAY_SECONDS)\n    exponential = DEFAULT_RETRY_DELAY_SECONDS * (2 ** (attempt - 1))\n    return min(exponential, MAX_RETRY_DELAY_SECONDS)\n'''
          if 'def _retry_delay' not in text:
              assert old_fetch in text
              text = text.replace(old_fetch, new_fetch, 1)
          collector.write_text(text, encoding='utf-8')

          overlap = Path('analytics/src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py')
          text = overlap.read_text(encoding='utf-8')
          old = '        if "football" not in description_text:\n            continue\n'
          new = '        if "football club" not in description_text:\n            continue\n'
          if new not in text:
              assert old in text
              text = text.replace(old, new, 1)
          overlap.write_text(text, encoding='utf-8')

          overlap_tests = Path('analytics/tests/test_wyscout_wikidata_overlap.py')
          text = overlap_tests.read_text(encoding='utf-8')
          old_test = '''def test_team_mapping_fails_closed_on_same_name_football_homonym() -> None:\n    mapping = resolve_wikidata_team_candidate(\n        wyscout_team_id=1623,\n        wyscout_name="Everton",\n        search_results=[\n            {\n                "id": "Q140596527",\n                "label": "Everton",\n                "description": "French footballer",\n            },\n            {\n                "id": "Q5794",\n                "label": "Everton F.C.",\n                "description": "association football club in Liverpool, England",\n            },\n        ],\n    )\n\n    assert mapping.status == "ambiguous_exact_football_club_candidates"\n    assert mapping.wikidata_qid is None\n'''
          new_test = '''def test_team_mapping_ignores_same_name_footballer_when_one_exact_club_exists() -> None:\n    mapping = resolve_wikidata_team_candidate(\n        wyscout_team_id=1623,\n        wyscout_name="Everton",\n        search_results=[\n            {\n                "id": "Q140596527",\n                "label": "Everton",\n                "description": "French footballer",\n            },\n            {\n                "id": "Q5794",\n                "label": "Everton F.C.",\n                "description": "association football club in Liverpool, England",\n            },\n        ],\n    )\n\n    assert mapping.status == "resolved"\n    assert mapping.wikidata_qid == "Q5794"\n'''
          if 'test_team_mapping_ignores_same_name_footballer_when_one_exact_club_exists' not in text:
              assert old_test in text
              text = text.replace(old_test, new_test, 1)
          overlap_tests.write_text(text, encoding='utf-8')

          profile_tests = Path('analytics/tests/test_wikidata_profiles.py')
          text = profile_tests.read_text(encoding='utf-8')
          if 'from urllib.error import HTTPError\n' not in text:
              old = 'from pathlib import Path\n\nimport pytest\n'
              new = 'from pathlib import Path\nfrom urllib.error import HTTPError\n\nimport pytest\n'
              assert old in text
              text = text.replace(old, new, 1)

          marker = 'def test_collector_is_hard_bounded_before_network_access(tmp_path: Path) -> None:\n'
          retry_test = '''def test_collector_retries_transient_503_then_writes_snapshot(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    encoded = json.dumps(_document("Q201"), sort_keys=True).encode("utf-8")\n    calls = 0\n\n    class FakeResponse:\n        def __enter__(self) -> FakeResponse:\n            return self\n\n        def __exit__(self, *args: object) -> None:\n            return None\n\n        def read(self) -> bytes:\n            return encoded\n\n    def fake_urlopen(request: object, timeout: int) -> FakeResponse:\n        nonlocal calls\n        del request, timeout\n        calls += 1\n        if calls == 1:\n            raise HTTPError(\n                "https://www.wikidata.org/wiki/Special:EntityData/Q201.json",\n                503,\n                "Service Unavailable",\n                {"Retry-After": "0"},\n                None,\n            )\n        return FakeResponse()\n\n    monkeypatch.setattr(collect_wikidata_profiles, "urlopen", fake_urlopen)\n    manifest = collect_wikidata_profiles.collect_snapshot(\n        qids=("Q201",),\n        snapshot_id="wikidata-transient-retry-test",\n        competition_codes=("ENG_PL",),\n        season_labels=("2017/18",),\n        output_dir=tmp_path,\n    )\n\n    assert calls == 2\n    assert len(manifest.files) == 1\n    assert (tmp_path / "Q201.json").read_bytes() == encoded\n\n\n'''
          if 'test_collector_retries_transient_503_then_writes_snapshot' not in text:
              assert marker in text
              text = text.replace(marker, retry_test + marker, 1)
          profile_tests.write_text(text, encoding='utf-8')
          PY

      - name: Format changed Python files
        working-directory: analytics
        run: |
          uv run ruff format \
            src/football_intelligence/jobs/collect_wikidata_profiles.py \
            src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py \
            tests/test_wikidata_profiles.py \
            tests/test_wyscout_wikidata_overlap.py

      - name: Run focused regression tests
        working-directory: analytics
        run: |
          uv run pytest -q \
            tests/test_wikidata_profiles.py \
            tests/test_wyscout_wikidata_overlap.py

      - name: Commit fix when needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            analytics/src/football_intelligence/jobs/collect_wikidata_profiles.py \
            analytics/src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py \
            analytics/tests/test_wikidata_profiles.py \
            analytics/tests/test_wyscout_wikidata_overlap.py
          git commit -m "fix: harden bounded Wikidata collection"
          git push origin HEAD:fix/wikidata-bounded-collection-resilience
