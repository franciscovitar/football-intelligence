# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Futbol360 Argentina 2016 feasibility

on:
  push:
    branches:
      - lab/futbol360-arg-2016-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Inspect one public team page for historical filter semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out
          url='https://www.futbol360.com.ar/equipos/argentina/lanus/'
          curl --fail --location --silent --show-error --max-time 30 \
            -A 'Mozilla/5.0 FootballIntelligenceSourceAudit/1.0' \
            -D probe_out/headers.txt \
            "$url" -o probe_out/lanus.html

          python - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          from pathlib import Path

          root = Path('probe_out')
          text = (root / 'lanus.html').read_text(encoding='utf-8', errors='replace')

          selects = []
          for match in re.finditer(r'<select\b[^>]*>.*?</select>', text, re.I | re.S):
              block = match.group(0)
              opening = re.match(r'<select\b([^>]*)>', block, re.I | re.S)
              attrs = opening.group(1) if opening else ''
              name = re.search(r'\bname=["\']([^"\']+)', attrs, re.I)
              ident = re.search(r'\bid=["\']([^"\']+)', attrs, re.I)
              options = []
              for om in re.finditer(r'<option\b([^>]*)>(.*?)</option>', block, re.I | re.S):
                  oattrs, label = om.groups()
                  value = re.search(r'\bvalue=["\']([^"\']*)', oattrs, re.I)
                  clean = re.sub(r'<[^>]+>', '', label)
                  clean = html.unescape(re.sub(r'\s+', ' ', clean)).strip()
                  options.append({'value': value.group(1) if value else None, 'label': clean})
              selects.append({
                  'name': name.group(1) if name else None,
                  'id': ident.group(1) if ident else None,
                  'options': options,
              })

          lines_2016 = []
          for line in text.splitlines():
              if '2016' in line or 'Primera División' in line or 'Primera Division' in line:
                  clean = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', line)).strip()
                  if clean:
                      lines_2016.append(html.unescape(clean)[:500])

          interesting = []
          patterns = ('ajax', 'temporada', 'torneo', 'estadistica', 'plantel', 'fixture', 'select')
          for line in text.splitlines():
              low = line.lower()
              if any(p in low for p in patterns) and ('url' in low or '$.' in low or 'fetch(' in low or 'function' in low or '<form' in low):
                  clean = re.sub(r'\s+', ' ', line).strip()
                  if clean:
                      interesting.append(clean[:1000])

          hrefs = sorted(set(html.unescape(x) for x in re.findall(r'href=["\']([^"\']+)', text, re.I)))
          candidate_hrefs = [x for x in hrefs if '2016' in x.lower() or 'torneo' in x.lower() or 'temporada' in x.lower()]

          summary = {
              'url': 'https://www.futbol360.com.ar/equipos/argentina/lanus/',
              'bytes': len(text.encode('utf-8')),
              'selects': selects,
              'lines_2016': lines_2016[:100],
              'candidate_hrefs': candidate_hrefs[:100],
              'interesting_client_lines': interesting[:100],
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload bounded probe summary
        uses: actions/upload-artifact@v4
        with:
          name: futbol360-arg-2016-filter-probe
          path: |
            probe_out/summary.json
            probe_out/headers.txt
          if-no-files-found: error
          retention-days: 7
