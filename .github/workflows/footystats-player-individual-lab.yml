name: FootyStats Player Individual Lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'lab/footystats-player-metric-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Audit public individual-player endpoints
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from collections import Counter
          from pathlib import Path
          from typing import Any
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = 'https://api.football-data-api.com'
          EXAMPLE_SEASON_ID = 1625
          UA = 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          SAMPLE_SIZE = 5

          TARGETS = (
              'xg_total_overall', 'xg_per_90_overall',
              'xa_total_overall', 'xa_per_90_overall',
              'npxg_total_overall', 'npxg_per_90_overall',
              'key_passes_total_overall', 'progressive_passes_total_overall',
              'passes_total_overall', 'passes_completed_total_overall',
              'pass_completion_rate_overall', 'shots_total_overall',
              'shots_on_target_total_overall', 'shot_accuraccy_percentage_overall',
              'dribbles_total_overall', 'dribbles_successful_total_overall',
              'dribbles_successful_percentage_overall', 'tackles_total_overall',
              'tackles_successful_total_overall', 'interceptions_total_overall',
              'blocks_total_overall', 'aerial_duels_won_total_overall',
              'aerial_duels_won_percentage_overall', 'duels_total_overall',
              'duels_won_total_overall', 'duels_won_percentage_overall',
              'saves_total_overall', 'shots_faced_total_overall',
              'save_percentage_overall', 'average_rating_overall',
          )

          def request(endpoint: str, params: dict[str, str]) -> dict[str, Any]:
              url = f"{BASE}/{endpoint}?{urlencode(params)}"
              req = Request(url, headers={'Accept': 'application/json', 'User-Agent': UA})
              try:
                  with urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read())
                      return {'http_status': response.status, 'payload': payload, 'error': None}
              except HTTPError as exc:
                  body: Any = None
                  try:
                      body = json.loads(exc.read())
                  except Exception:
                      body = None
                  safe_error = None
                  if isinstance(body, dict):
                      for key in ('message', 'error', 'reason'):
                          value = body.get(key)
                          if isinstance(value, str):
                              safe_error = value[:200]
                              break
                  return {
                      'http_status': exc.code,
                      'payload': None,
                      'error': 'HTTPError',
                      'error_message': safe_error,
                      'error_payload_keys': sorted(body) if isinstance(body, dict) else [],
                  }
              except (URLError, TimeoutError, json.JSONDecodeError) as exc:
                  return {'http_status': None, 'payload': None, 'error': type(exc).__name__}

          def rows_from_payload(payload: Any) -> list[dict[str, Any]]:
              if not isinstance(payload, dict):
                  return []
              data = payload.get('data')
              if isinstance(data, list):
                  return [row for row in data if isinstance(row, dict)]
              if isinstance(data, dict):
                  return [data]
              return []

          def num(value: Any) -> float | None:
              if value is None or isinstance(value, bool):
                  return None
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def metric_value(row: dict[str, Any], key: str) -> Any:
              detailed = row.get('detailed')
              if isinstance(detailed, dict) and key in detailed:
                  return detailed.get(key)
              return row.get(key)

          def formula_checks(rows: list[dict[str, Any]]) -> dict[str, Any]:
              checks: dict[str, dict[str, int]] = {}
              for total_key, rate_key in (
                  ('xg_total_overall', 'xg_per_90_overall'),
                  ('xa_total_overall', 'xa_per_90_overall'),
                  ('npxg_total_overall', 'npxg_per_90_overall'),
              ):
                  checked = good = 0
                  for row in rows:
                      total = num(metric_value(row, total_key))
                      rate = num(metric_value(row, rate_key))
                      minutes = num(row.get('minutes_played_overall'))
                      if total is None or rate is None or minutes is None or minutes <= 0:
                          continue
                      expected = total * 90.0 / minutes
                      checked += 1
                      if abs(rate - expected) <= max(0.02, abs(expected) * 0.05):
                          good += 1
                  checks[f'{rate_key}_from_total_minutes'] = {'checked': checked, 'within_tolerance': good}

              for numerator_key, denominator_key, pct_key in (
                  ('passes_completed_total_overall', 'passes_total_overall', 'pass_completion_rate_overall'),
                  ('dribbles_successful_total_overall', 'dribbles_total_overall', 'dribbles_successful_percentage_overall'),
                  ('duels_won_total_overall', 'duels_total_overall', 'duels_won_percentage_overall'),
                  ('saves_total_overall', 'shots_faced_total_overall', 'save_percentage_overall'),
                  ('shots_on_target_total_overall', 'shots_total_overall', 'shot_accuraccy_percentage_overall'),
              ):
                  checked = good = 0
                  for row in rows:
                      numerator = num(metric_value(row, numerator_key))
                      denominator = num(metric_value(row, denominator_key))
                      actual = num(metric_value(row, pct_key))
                      if numerator is None or denominator is None or actual is None or denominator <= 0:
                          continue
                      expected = numerator * 100.0 / denominator
                      checked += 1
                      if abs(actual - expected) <= max(1.0, abs(expected) * 0.05):
                          good += 1
                  checks[f'{pct_key}_from_ratio'] = {'checked': checked, 'within_tolerance': good}
              return checks

          league = request('league-players', {
              'key': 'example',
              'season_id': str(EXAMPLE_SEASON_ID),
              'page': '1',
              'include': 'stats',
          })
          league_rows = rows_from_payload(league.get('payload'))
          ranked = sorted(
              (
                  row for row in league_rows
                  if isinstance(row.get('id'), (int, str)) and num(row.get('minutes_played_overall')) is not None
              ),
              key=lambda row: num(row.get('minutes_played_overall')) or 0,
              reverse=True,
          )
          sampled_ids = [str(row['id']) for row in ranked[:SAMPLE_SIZE]]

          variants: list[dict[str, Any]] = []
          all_success_rows: list[dict[str, Any]] = []
          for endpoint in ('player-stats', 'player'):
              for include_stats in (False, True):
                  statuses = Counter()
                  detailed_rows = 0
                  target_non_null = Counter()
                  endpoint_rows: list[dict[str, Any]] = []
                  error_messages = Counter()
                  for player_id in sampled_ids:
                      params = {'key': 'example', 'player_id': player_id}
                      if include_stats:
                          params['include'] = 'stats'
                      result = request(endpoint, params)
                      statuses[str(result.get('http_status'))] += 1
                      if result.get('error_message'):
                          error_messages[str(result['error_message'])] += 1
                      rows = rows_from_payload(result.get('payload'))
                      endpoint_rows.extend(rows)
                      for row in rows:
                          if isinstance(row.get('detailed'), dict):
                              detailed_rows += 1
                          for key in TARGETS:
                              if metric_value(row, key) is not None:
                                  target_non_null[key] += 1
                  all_success_rows.extend(endpoint_rows)
                  variants.append({
                      'endpoint': endpoint,
                      'include_stats': include_stats,
                      'sampled_players': len(sampled_ids),
                      'http_status_counts': dict(statuses),
                      'rows_returned': len(endpoint_rows),
                      'detailed_rows': detailed_rows,
                      'target_non_null_counts': dict(target_non_null),
                      'formula_checks': formula_checks(endpoint_rows),
                      'error_messages': dict(error_messages),
                  })

          advanced_variants = [item for item in variants if item['target_non_null_counts']]
          report = {
              'status': 'PASS' if sampled_ids else 'FAIL',
              'source': 'FootyStats public example key',
              'example_season_id': EXAMPLE_SEASON_ID,
              'league_probe': {
                  'http_status': league.get('http_status'),
                  'rows_observed': len(league_rows),
                  'sampled_players': len(sampled_ids),
              },
              'raw_rows_persisted': False,
              'player_ids_persisted': False,
              'variants': variants,
              'decision_signal': {
                  'any_individual_endpoint_200': any(item['http_status_counts'].get('200', 0) for item in variants),
                  'any_advanced_field_observed': bool(advanced_variants),
                  'advanced_endpoint_variants': [
                      {'endpoint': item['endpoint'], 'include_stats': item['include_stats']}
                      for item in advanced_variants
                  ],
              },
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'footystats-player-individual-lab.json'
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if report['status'] != 'PASS':
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: footystats-player-individual-lab
          path: ${{ runner.temp }}/footystats-player-individual-lab.json
          if-no-files-found: error
          retention-days: 7
