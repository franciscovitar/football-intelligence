name: Wyscout Spatial V1 Lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    if: github.head_ref == 'lab/wyscout-spatial-v1-eng-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Capture analytics lint diagnostics
        working-directory: analytics
        run: |
          uv run ruff check . --output-format concise > "$RUNNER_TEMP/ruff.txt" 2>&1 || true
          uv run ruff format --check --diff . > "$RUNNER_TEMP/ruff-format.txt" 2>&1 || true
      - name: Fetch and verify official Wyscout Open England source
        working-directory: analytics
        run: |
          uv run football-intelligence-probe-wyscout-open \
            --cache-dir "$RUNNER_TEMP/wyscout-cache" \
            --report "$RUNNER_TEMP/wyscout-probe.json"
      - name: Audit spatial methodology v1 on real ENG_PL 2017/18
        id: spatial
        continue-on-error: true
        working-directory: analytics
        run: |
          uv run football-intelligence-audit-wyscout-spatial-v1 \
            --cache-dir "$RUNNER_TEMP/wyscout-cache" \
            --report "$RUNNER_TEMP/wyscout-spatial-v1.json"
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyscout-spatial-v1-eng-audit
          path: |
            ${{ runner.temp }}/wyscout-probe.json
            ${{ runner.temp }}/wyscout-spatial-v1.json
            ${{ runner.temp }}/ruff.txt
            ${{ runner.temp }}/ruff-format.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Publish lab diagnostics to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Wyscout Spatial V1 Lab'
            echo
            echo "Run: $GITHUB_RUN_ID · Commit: $GITHUB_SHA"
            echo
            if [[ -f "$RUNNER_TEMP/wyscout-spatial-v1.json" ]]; then
              echo '<details><summary>Spatial audit report</summary>'
              echo
              echo '```json'
              cat "$RUNNER_TEMP/wyscout-spatial-v1.json"
              echo '```'
              echo '</details>'
            else
              echo '**Spatial report was not produced.**'
            fi
            if [[ -s "$RUNNER_TEMP/ruff.txt" ]]; then
              echo
              echo '<details><summary>Ruff diagnostics</summary>'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/ruff.txt"
              echo '```'
              echo '</details>'
            fi
            if [[ -s "$RUNNER_TEMP/ruff-format.txt" ]]; then
              echo
              echo '<details><summary>Ruff format diff</summary>'
              echo
              echo '```diff'
              cat "$RUNNER_TEMP/ruff-format.txt"
              echo '```'
              echo '</details>'
            fi
          } > "$RUNNER_TEMP/pr-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$RUNNER_TEMP/pr-comment.md"
      - name: Preserve spatial audit failure
        if: steps.spatial.outcome == 'failure'
        run: exit 1
