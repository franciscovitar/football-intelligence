name: Temp Recertify Wyscout v0.3

on:
  push:
    branches: [feat/wyscout-long-pass-v1-1]

permissions:
  contents: write

jobs:
  recertify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/wyscout-long-pass-v1-1
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Sync head analytics environment
        working-directory: analytics
        run: uv sync --dev --locked

      - name: Acquire and verify official Wyscout source
        working-directory: analytics
        run: |
          uv run football-intelligence-probe-wyscout-open \
            --cache-dir "$GITHUB_WORKSPACE/data/cache/wyscout-open" \
            --report /tmp/wyscout-source.json
          uv run football-intelligence-audit-wyscout-core-leagues \
            --cache-dir "$GITHUB_WORKSPACE/data/cache/wyscout-open" \
            --report /tmp/wyscout-core-leagues.json

      - name: Prepare certified v0.2 baseline worktree
        run: |
          git worktree add /tmp/fi-v02 dc7702783c287480efff036df928cfd285d05d13
          cd /tmp/fi-v02/analytics
          uv sync --dev --locked

      - name: Write real-output equivalence probe
        run: |
          cat > /tmp/dump_wyscout_esp.py <<'PY'
          from __future__ import annotations

          import json
          import sys
          from dataclasses import asdict
          from datetime import datetime
          from pathlib import Path
          from typing import Any

          from football_intelligence.data_mesh.adapters import wyscout_open
          from football_intelligence.jobs.audit_wyscout_core_leagues import (
              _load_country_payload,
              _load_reference_payload,
          )
          from football_intelligence.providers.wyscout_open_scopes import CORE_LEAGUE_SPECS


          def normalize(value: Any) -> Any:
              if isinstance(value, datetime):
                  return value.isoformat()
              if isinstance(value, dict):
                  return {str(key): normalize(item) for key, item in sorted(value.items())}
              if isinstance(value, (list, tuple)):
                  return [normalize(item) for item in value]
              return value


          cache_dir = Path(sys.argv[1])
          output = Path(sys.argv[2])
          spec = next(spec for spec in CORE_LEAGUE_SPECS if spec.competition_code == "ESP_LL")
          matches = _load_country_payload(cache_dir, spec=spec, kind="matches")
          events = _load_country_payload(cache_dir, spec=spec, kind="events")
          players = _load_reference_payload(cache_dir, "*players.json", label="players.json")
          teams = _load_reference_payload(cache_dir, "*teams.json", label="teams.json")
          observations = wyscout_open.parse_england_season(
              matches_payload=matches,
              events_payload=events,
              players_payload=players,
              teams_payload=teams,
              scope=wyscout_open.ESP_LL_SCOPE,
          )
          versions = sorted({obs.semantic_version for obs in observations})
          canonical = []
          for obs in observations:
              row = asdict(obs)
              row.pop("semantic_version")
              canonical.append(normalize(row))
          canonical.sort(key=lambda row: json.dumps(row, sort_keys=True, separators=(",", ":")))
          payload = {
              "semantic_versions": versions,
              "observation_count": len(canonical),
              "long_passes_accurate_count": sum(
                  1 for row in canonical if row["metric_name"] == "long_passes_accurate"
              ),
              "observations": canonical,
          }
          output.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          print(
              f"version={versions} observations={len(canonical)} "
              f"long_passes_accurate={payload['long_passes_accurate_count']}"
          )
          PY

      - name: Emit v0.2 and v0.3 on complete real ESP_LL 2017/18 source
        run: |
          CACHE="$GITHUB_WORKSPACE/data/cache/wyscout-open"
          cd /tmp/fi-v02/analytics
          uv run python /tmp/dump_wyscout_esp.py "$CACHE" /tmp/wyscout-v02.json
          cd "$GITHUB_WORKSPACE/analytics"
          uv run python /tmp/dump_wyscout_esp.py "$CACHE" /tmp/wyscout-v03.json

      - name: Prove observational equivalence in certified comparability scope
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = json.loads(Path('/tmp/wyscout-v02.json').read_text(encoding='utf-8'))
          head = json.loads(Path('/tmp/wyscout-v03.json').read_text(encoding='utf-8'))

          assert base['semantic_versions'] == ['wyscout-open-v0.2'], base['semantic_versions']
          assert head['semantic_versions'] == ['wyscout-open-v0.3'], head['semantic_versions']
          assert head['long_passes_accurate_count'] == 0, (
              'v0.3 leaked long_passes_accurate into ESP_LL before its spatial audit'
          )
          assert base['observation_count'] == head['observation_count'], (
              base['observation_count'], head['observation_count']
          )
          if base['observations'] != head['observations']:
              for index, (before, after) in enumerate(
                  zip(base['observations'], head['observations'], strict=True)
              ):
                  if before != after:
                      raise AssertionError(
                          f'first v0.2/v0.3 real-output difference at canonical row {index}: '
                          f'before={before!r} after={after!r}'
                      )
              raise AssertionError('v0.2/v0.3 observation payloads differ')

          digest = hashlib.sha256(
              json.dumps(base['observations'], sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          report = {
              'status': 'PASS',
              'scope': 'ESP_LL 2017/18',
              'source': 'Wyscout Open Data / Figshare 4415000',
              'baseline_version': 'wyscout-open-v0.2',
              'candidate_version': 'wyscout-open-v0.3',
              'observation_count': base['observation_count'],
              'candidate_long_passes_accurate_observations': head['long_passes_accurate_count'],
              'canonical_payload_sha256': digest,
              'equivalence_rule': 'all NormalizedObservation fields identical except semantic_version',
          }
          Path('/tmp/wyscout-v03-recertification.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Apply explicit v0.3 recertification and accounting updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          policy = 'analytics/src/football_intelligence/data_mesh/comparability_policy.py'
          replace_once(
              policy,
              'a future\n`wyscout-open-v0.3` still agrees the same way',
              'a future\n`wyscout-open-v0.4` still agrees the same way',
          )
          replace_once(
              policy,
              'WYSCOUT_CERTIFIED_POLICY_VERSION = "wyscout-open-v0.2"',
              '''# v0.3 was explicitly re-certified on 2026-08-25 by running v0.2 and v0.3\n# over the complete real ESP_LL 2017/18 Wyscout source and proving every\n# NormalizedObservation field identical except semantic_version. The new\n# long_passes_accurate identity is scope-gated to ENG_PL and produced zero\n# observations in this comparability scope, so the reviewed v0.2 provider-pair\n# policies remain observationally valid for v0.3 rather than being assumed so.\nWYSCOUT_CERTIFIED_POLICY_VERSION = "wyscout-open-v0.3"''',
          )

          adapter_test = 'analytics/tests/test_data_mesh_adapters_wyscout_open.py'
          replace_once(
              adapter_test,
              '''def test_semantic_version_is_bumped_from_the_pre_review_fix_pass_adapter() -> None:\n    # Block 20D.2's review-fix pass changed observable emission semantics\n    # (explicit metric_granularity on every observation, genuine\n    # goalkeeper_match "saves" emission, home_away granularity corrected,\n    # materially enriched identity hints) -- the Block 20B.2b original\n    # version ("wyscout-open-v0.1") must not be shared with these new\n    # semantics.\n    assert wyscout_open.SEMANTIC_VERSION != "wyscout-open-v0.1"\n    assert wyscout_open.SEMANTIC_VERSION == "wyscout-open-v0.2"\n''',
              '''def test_semantic_version_tracks_current_certified_adapter_semantics() -> None:\n    # v0.2 introduced Block 20D.2's review fixes. v0.3 adds the independently\n    # audited ENG_PL-only long_passes_accurate emission and was explicitly\n    # re-certified as observationally equivalent to v0.2 in ESP_LL 2017/18,\n    # the Wyscout x StatsBomb comparability-policy scope.\n    assert wyscout_open.SEMANTIC_VERSION != "wyscout-open-v0.1"\n    assert wyscout_open.SEMANTIC_VERSION != "wyscout-open-v0.2"\n    assert wyscout_open.SEMANTIC_VERSION == "wyscout-open-v0.3"\n''',
          )

          mapping_test = 'analytics/tests/test_wyscout_open_mapping.py'
          replace_once(
              mapping_test,
              '''def test_derivable_ready_and_pending_totals_match_final_accounting() -> None:\n    assert len(derivable_ready_mappings()) == 34\n    assert len(derivable_methodology_pending_mappings()) == 33\n''',
              '''def test_derivable_ready_and_pending_totals_match_final_accounting() -> None:\n    assert len(derivable_ready_mappings()) == 35\n    assert len(derivable_methodology_pending_mappings()) == 32\n''',
          )
          replace_once(
              mapping_test,
              '''def test_adapter_safe_subset_totals_77() -> None:\n    safe = adapter_safe_mappings()\n    assert len(safe) == 77\n''',
              '''def test_adapter_safe_subset_totals_78() -> None:\n    safe = adapter_safe_mappings()\n    assert len(safe) == 78\n''',
          )

          bridge = 'docs/WYSCOUT_HISTORICAL_PLAYER_BRIDGE.md'
          replace_once(
              bridge,
              '''Observed first-load invariants:\n\n- official source probe: 380 matches, 643,150 events, 603 roster/squad players — PASS;\n- certified adapter: 412,609 `NormalizedObservation` rows, 77/77 adapter-safe identities observed — PASS;\n''',
              '''The counts below are the observed `wyscout-open-v0.2` baseline from that\nruntime. The later v0.3 long-pass promotion deliberately requires a fresh\npost-promotion runtime before replacing these historical counts.\n\nObserved first-load invariants:\n\n- official source probe: 380 matches, 643,150 events, 603 roster/squad players — PASS;\n- certified v0.2 adapter: 412,609 `NormalizedObservation` rows, 77/77 adapter-safe identities observed — PASS;\n''',
          )
          replace_once(
              bridge,
              '3. runs the certified `wyscout-open-v0.2` adapter;',
              '3. runs the current certified Wyscout adapter (`wyscout-open-v0.3` after the spatial v1.1 promotion);',
          )
          PY

      - name: Format, lint and typecheck
        working-directory: analytics
        run: |
          uv run ruff format src tests
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Run complete analytics test suite
        working-directory: analytics
        run: uv run pytest

      - name: Remove temporary workflow and commit recertification
        run: |
          git rm .github/workflows/temp-recertify-wyscout-v03.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics docs
          git diff --cached --check
          git commit -m "fix: recertify Wyscout v0.3 evidence boundaries"
          git push origin HEAD:feat/wyscout-long-pass-v1-1
