name: Historical Player V2 Spike

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/historical-player-v2-spike.yml"
      - "analytics/**"
      - "apps/web/**"

permissions:
  contents: read

jobs:
  wyscout-player-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_player_v2_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_intelligence_player_v2_spike

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done

      - name: Apply core seeds
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seeds/001_core_catalog.sql >/dev/null

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install analytics dependencies
        working-directory: analytics
        run: uv sync --dev --locked

      - name: Load certified Wyscout ENG_PL 2017/18
        working-directory: analytics
        run: >-
          uv run football-intelligence-load-wyscout-historical
          --cache-dir "$RUNNER_TEMP/wyscout-open-cache"
          --database-url "$DATABASE_URL"
          --report "$RUNNER_TEMP/wyscout-load.json"

      - name: Calculate historical Player V2 in explicit competition scope
        working-directory: analytics
        run: >-
          uv run football-intelligence-player-analytics
          --competition ENG_PL
          --season "2017/18"
          --database-url "$DATABASE_URL"
          --report "$RUNNER_TEMP/player-v2.json"

      - name: Verify historical Player V2 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "player-v2.json").read_text())
          assert report["competition"] == "ENG_PL", report
          assert report["season"] == "2017/18", report
          assert report["scope_key"] == "competition:ENG_PL:2017/18", report
          assert report["score_snapshot_count"] == 2048, report
          assert report["feature_snapshot_count"] == 26841, report
          assert report["evidence_state_counts"] == {
              "insufficient_data": 1754,
              "partial": 294,
          }, report
          PY

          test "$(psql "$DATABASE_URL" -Atc "select count(distinct player_id) from analytics.product_player_detail_v2 where scope_key='competition:ENG_PL:2017/18' and window_key='season'")" = "512"
          test "$(psql "$DATABASE_URL" -Atc "select count(distinct player_id) from analytics.product_player_detail_v2 where scope_key='competition:ENG_PL:2017/18' and window_key='season' and minutes >= 450")" = "385"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from analytics.product_player_ranking_candidates_v2 where scope_key='competition:ENG_PL:2017/18'")" = "0"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from analytics.product_player_detail_v2 s cross join lateral jsonb_each(s.dimension_evidence) e where s.scope_key='competition:ENG_PL:2017/18' and s.window_key='season' and e.key='performance' and e.value->>'evidence_state'='ready' and e.value->>'score' is not null")" = "385"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from analytics.product_player_detail_v2 where scope_key='competition:ENG_PL:2017/18' and overall_score is not null")" = "0"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run web unit tests
        run: npm run web:test

      - name: Verify explicit historical web experience
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace @football-intelligence/web run dev -- \
            --hostname 127.0.0.1 \
            --port 3000 \
            > "$RUNNER_TEMP/historical-player-web.log" 2>&1 &
          WEB_PID=$!
          cleanup() { kill "$WEB_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3000/" > "$RUNNER_TEMP/home.html"; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/historical-player-web.log"
            exit 1
          fi

          CONTEXT='competition%3AENG_PL%3A2017%2F18'
          curl -fsS "http://127.0.0.1:3000/rankings?context=$CONTEXT&minutes=450" > "$RUNNER_TEMP/rankings.html"
          grep -q "PLAYER EXPLORER · V2 · HISTÓRICO" "$RUNNER_TEMP/rankings.html"
          grep -q "ANÁLISIS DISPONIBLE · RANKING NO DISPONIBLE" "$RUNNER_TEMP/rankings.html"
          grep -q "Jugadores analizados" "$RUNNER_TEMP/rankings.html"
          grep -q "385 con los filtros actuales" "$RUNNER_TEMP/rankings.html"
          ! grep -q "rank-number" "$RUNNER_TEMP/rankings.html"

          PLAYER_IDS=($(psql "$DATABASE_URL" -Atc "select player_id from analytics.product_player_detail_v2 where scope_key='competition:ENG_PL:2017/18' and window_key='season' and minutes >= 450 order by minutes desc, player_id limit 2"))
          test "${#PLAYER_IDS[@]}" = "2"
          LEFT="${PLAYER_IDS[0]}"
          RIGHT="${PLAYER_IDS[1]}"

          curl -fsS "http://127.0.0.1:3000/player/$LEFT?context=$CONTEXT" > "$RUNNER_TEMP/player.html"
          grep -q "PLAYER INTELLIGENCE · V2 REAL · HISTÓRICO" "$RUNNER_TEMP/player.html"
          grep -q "2017/18" "$RUNNER_TEMP/player.html"
          grep -q "Métricas que sostienen la lectura" "$RUNNER_TEMP/player.html"

          curl -fsS "http://127.0.0.1:3000/compare?type=player&context=$CONTEXT&left=$LEFT&right=$RIGHT" > "$RUNNER_TEMP/compare.html"
          grep -q "COMPARE · V2 · HISTÓRICO" "$RUNNER_TEMP/compare.html"
          grep -q "Jugador vs jugador" "$RUNNER_TEMP/compare.html"
          grep -q "2017/18" "$RUNNER_TEMP/compare.html"
          grep -q "Métricas y percentiles lado a lado" "$RUNNER_TEMP/compare.html"

          grep -q "Explorar jugadores históricos · 2017/18" "$RUNNER_TEMP/home.html"
          ! grep -q "Snapshot V2 real activo" "$RUNNER_TEMP/home.html"

          curl -fsS "http://127.0.0.1:3000/watchlist" > "$RUNNER_TEMP/watchlist.html"
          grep -q "Sin jugadores del contexto principal" "$RUNNER_TEMP/watchlist.html"

          curl -fsS "http://127.0.0.1:3000/rankings?context=competition%3AENG_PL%3A1900%2F01" > "$RUNNER_TEMP/invalid.html"
          grep -q "Contexto de jugadores no válido" "$RUNNER_TEMP/invalid.html"

      - name: Confirm no production or current-season mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from analytics.product_player_detail_v2 where scope_key='competition:ENG_PL:2017/18'")" -gt 0
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from football.seasons s join football.competitions c on c.id=s.competition_id where c.code='ENG_PL' and s.label='2017/18'")" = "1"
          echo "ephemeral_database_only=true"
          echo "production_written=false"
