name: Wyscout Wikidata Overlap Lab

on:
  push:
    branches:
      - feat/wikidata-wyscout-england-overlap-lab
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    if: >-
      github.event_name == 'push' ||
      github.head_ref == 'feat/wikidata-wyscout-england-overlap-lab'
    name: Real source overlap audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - name: Apply bounded lab repair and canonical formatting
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("analytics/src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'if "football" not in description_text:\n            continue',
              'if "football" not in description_text or "club" not in description_text:\n            continue',
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("analytics/tests/test_wyscout_wikidata_overlap.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_team_mapping_rejects_same_name_footballer_homonym() -> None:"
          if marker not in tests:
              tests += '''\n\n
def test_team_mapping_rejects_same_name_footballer_homonym() -> None:
    mapping = resolve_wikidata_team_candidate(
        wyscout_team_id=1623,
        wyscout_name="Everton",
        search_results=[
            {
                "id": "Q140596527",
                "label": "Everton",
                "description": "French footballer",
            },
            {
                "id": "Q5794",
                "label": "Everton F.C.",
                "description": "association football club in Liverpool, England",
            },
        ],
    )

    assert mapping.status == "resolved"
    assert mapping.wikidata_qid == "Q5794"
'''
          test_path.write_text(tests, encoding="utf-8")
          PY
          cd analytics
          uv run ruff check --fix \
            src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py \
            tests/test_wyscout_wikidata_overlap.py
          uv run ruff format \
            src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py \
            tests/test_wyscout_wikidata_overlap.py
          cd ..
          git add \
            analytics/src/football_intelligence/jobs/audit_wyscout_wikidata_overlap.py \
            analytics/tests/test_wyscout_wikidata_overlap.py
          if ! git diff --cached --quiet; then
            git config user.name "football-intelligence-lab"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "fix: require club semantics for Wikidata team matching"
            git push origin "HEAD:feat/wikidata-wyscout-england-overlap-lab"
          fi
      - name: Run real Wyscout x Wikidata overlap audit
        working-directory: analytics
        run: >-
          uv run football-intelligence-audit-wyscout-wikidata-overlap
          --cache-dir "$RUNNER_TEMP/wyscout-wikidata-cache"
          --report "$RUNNER_TEMP/wyscout-wikidata-overlap.json"
      - name: Print compact report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "wyscout-wikidata-overlap.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          keys = [
              "status",
              "wyscout_roster_total",
              "wyscout_profiles_available",
              "team_mappings_resolved",
              "team_total",
              "wikidata_discovery_entities",
              "players_with_exact_name_candidate",
              "players_with_unique_candidate",
              "wikidata_exact_dob_coverage",
              "wikidata_citizenship_coverage",
              "wikidata_position_coverage",
              "wikidata_bounded_team_context_coverage",
              "candidate_state_counts",
              "failures",
          ]
          print(json.dumps({key: data.get(key) for key in keys}, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wyscout-wikidata-overlap-report
          path: ${{ runner.temp }}/wyscout-wikidata-overlap.json
          if-no-files-found: error
          retention-days: 7
