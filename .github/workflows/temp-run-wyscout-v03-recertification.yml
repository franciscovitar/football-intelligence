name: Temp Run Wyscout v0.3 Recertification

on:
  push:
    branches:
      - feat/wyscout-long-pass-v1-1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/wyscout-long-pass-v1-1
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Sync analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Apply recertification patch
        run: python scripts/tmp_apply_wyscout_v03_recertification.py
      - name: Validate analytics
        working-directory: analytics
        run: |
          uv run ruff format src tests
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
      - name: Commit validated patch and remove temporary files
        run: |
          git rm .github/workflows/temp-apply-wyscout-v03-recertification.yml
          git rm .github/workflows/temp-run-wyscout-v03-recertification.yml
          git rm scripts/tmp_apply_wyscout_v03_recertification.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics docs
          git diff --cached --check
          git commit -m "fix: recertify Wyscout v0.3 evidence boundaries"
          git push origin HEAD:feat/wyscout-long-pass-v1-1
