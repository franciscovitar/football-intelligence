name: API-Football four-league 2024 probe

on:
  push:
    branches:
      - lab/low-cost-player-history-provider-audit
    paths:
      - .github/workflows/tmp-api-football-four-leagues-2024-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Probe four known 2024 players
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY is not configured" >&2
            exit 1
          fi
          rm -rf /tmp/api-football-four-leagues-2024
          mkdir -p /tmp/api-football-four-leagues-2024
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          targets = (
              ("ESP_LL", 140, 2024, "Mbappe"),
              ("ITA_SA", 135, 2024, "Lautaro"),
              ("GER_BL1", 78, 2024, "Kane"),
              ("FRA_L1", 61, 2024, "Dembele"),
          )
          out = Path("/tmp/api-football-four-leagues-2024")
          summaries = []

          for code, league_id, season, search in targets:
              query = urlencode({"league": league_id, "season": season, "search": search})
              url = f"https://v3.football.api-sports.io/players?{query}"
              request = Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)",
                      "x-apisports-key": os.environ["API_FOOTBALL_KEY"],
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      status = response.status
                      raw = response.read()
              except HTTPError as exc:
                  status = exc.code
                  raw = exc.read()

              raw_name = f"{code.lower()}-{season}-{search.lower()}.json"
              (out / raw_name).write_bytes(raw)
              payload = json.loads(raw)
              rows = []
              for item in payload.get("response", []):
                  player = item.get("player") or {}
                  for stat in item.get("statistics") or []:
                      games = stat.get("games") or {}
                      team = stat.get("team") or {}
                      rows.append({
                          "player_id": player.get("id"),
                          "player_name": player.get("name"),
                          "team_name": team.get("name"),
                          "appearences": games.get("appearences"),
                          "minutes": games.get("minutes"),
                          "rating": games.get("rating"),
                          "goals": (stat.get("goals") or {}).get("total"),
                          "assists": (stat.get("goals") or {}).get("assists"),
                          "shots_total": (stat.get("shots") or {}).get("total"),
                          "passes_total": (stat.get("passes") or {}).get("total"),
                          "tackles_total": (stat.get("tackles") or {}).get("total"),
                          "duels_total": (stat.get("duels") or {}).get("total"),
                      })
              summaries.append({
                  "competition_code": code,
                  "league_id": league_id,
                  "season": season,
                  "search": search,
                  "http_status": status,
                  "errors": payload.get("errors"),
                  "results": payload.get("results"),
                  "paging": payload.get("paging"),
                  "rows": rows,
                  "raw_sha256": hashlib.sha256(raw).hexdigest(),
                  "raw_byte_size": len(raw),
              })

          summary = {"requests_made": 4, "targets": summaries}
          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Verify no API key was persisted
        if: always()
        shell: bash
        run: |
          if grep -R --fixed-strings -- "$API_FOOTBALL_KEY" /tmp/api-football-four-leagues-2024; then
            echo "Secret leakage detected" >&2
            exit 1
          fi
          echo "No API key persisted."

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-football-four-leagues-2024-${{ github.run_id }}
          path: /tmp/api-football-four-leagues-2024
          if-no-files-found: error
          retention-days: 7
