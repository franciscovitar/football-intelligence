name: Quality

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit high-severity dependencies
        run: npm audit --omit=dev
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:build

  analytics:
    name: Analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - working-directory: analytics
        run: uv run ruff check .
      - working-directory: analytics
        run: uv run ruff format --check .
      - working-directory: analytics
        run: uv run mypy src
      - working-directory: analytics
        run: uv run pytest

  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: football_intelligence_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_intelligence_test
      INTERNAL_LAB_ENABLED: "true"
      FOOTBALL_INTELLIGENCE_WRITE_TOKEN: ci-e2e-write-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Apply core seeds
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/seeds/001_core_catalog.sql
      - name: Verify schema contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in database/tests/*.sql; do
            echo "Checking $contract"
            psql -v ON_ERROR_STOP=1 -f "$contract"
          done
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - name: Verify PostgreSQL integrations
        working-directory: analytics
        run: uv run pytest tests/integration
      - name: Seed deterministic web smoke data
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/001_web_smoke.sql
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seed deterministic rating smoke evidence
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/002_rating_smoke.sql
      - name: Calculate deterministic rating smoke
        working-directory: analytics
        run: >-
          uv run football-intelligence-rating-analytics
          --season web-smoke
          --report "$RUNNER_TEMP/rating-smoke-report.json"
      - name: Seed deterministic tactical smoke evidence
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/003_tactical_smoke.sql
      - name: Calculate deterministic tactical smoke
        working-directory: analytics
        run: >-
          uv run football-intelligence-tactical-analytics
          --season web-smoke
          --report "$RUNNER_TEMP/tactical-smoke-report.json"
      - name: Seed deterministic World Radar smoke evidence
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/004_world_radar_smoke.sql
      - name: Run V1 Validation on smoke DB
        working-directory: analytics
        run: >-
          uv run football-intelligence-validate-v1
          --report "$RUNNER_TEMP/validation-smoke-report.json"
      - name: Seed deterministic data mesh smoke evidence
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/005_data_mesh_smoke.sql
      - name: Seed deterministic coverage lab smoke evidence
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/006_coverage_lab_smoke.sql
      - name: Seed deterministic diagnostic findings smoke evidence
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/007_diagnostic_findings_smoke.sql
      - name: Verify Next.js PostgreSQL read path
        shell: bash
        run: |
          set -euo pipefail

          npm --workspace @football-intelligence/web run dev -- \
            --hostname 127.0.0.1 \
            --port 3000 \
            > "$RUNNER_TEMP/web-smoke.log" 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3000/" > "$RUNNER_TEMP/home.html"; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/web-smoke.log"
            exit 1
          fi

          grep -q "Cobertura real insuficiente" "$RUNNER_TEMP/home.html"
          ! grep -q "Web Smoke Forward" "$RUNNER_TEMP/home.html"

          curl -fsS \
            "http://127.0.0.1:3000/rankings?window=season&dimension=overall&confidence=0.5" \
            > "$RUNNER_TEMP/rankings.html"
          grep -q "Todavía no hay temporadas de jugadores publicadas" "$RUNNER_TEMP/rankings.html"
          ! grep -q "Web Smoke Forward" "$RUNNER_TEMP/rankings.html"

          curl -fsS \
            "http://127.0.0.1:3000/perception?kind=media&q=Web%20Smoke" \
            > "$RUNNER_TEMP/perception.html"
          grep -q "Web Smoke Perception" "$RUNNER_TEMP/perception.html"
          grep -q "Evidencia, no" "$RUNNER_TEMP/perception.html"

          curl -fsS \
            "http://127.0.0.1:3000/meta?role=forward&confidence=0" \
            > "$RUNNER_TEMP/meta.html"
          grep -q "Web Smoke Forward" "$RUNNER_TEMP/meta.html"
          grep -q "Sorpresas" "$RUNNER_TEMP/meta.html"

          curl -fsS \
            "http://127.0.0.1:3000/ratings?role=forward&confidence=0" \
            > "$RUNNER_TEMP/ratings.html"
          grep -q "Web Smoke Forward" "$RUNNER_TEMP/ratings.html"
          grep -q "Infravalorados" "$RUNNER_TEMP/ratings.html"
          curl -fsSL \
            "http://127.0.0.1:3000/teams?competition=ENG_PL&window=season&confidence=0" \
            > "$RUNNER_TEMP/teams.html"
          grep -q "Ranking de equipos no disponible" "$RUNNER_TEMP/teams.html"
          ! grep -q "Web Smoke United" "$RUNNER_TEMP/teams.html"

          TEAM_ID="$(psql -Atc \
            "select id from football.teams where name = 'Web Smoke City' order by id desc limit 1")"
          test -n "$TEAM_ID"

          TEAM_STATUS="$(curl -sS -o "$RUNNER_TEMP/team.html" -w '%{http_code}' \
            "http://127.0.0.1:3000/team/$TEAM_ID?competition=ENG_PL")"
          test "$TEAM_STATUS" = "404"
          ! grep -q "4-4-2" "$RUNNER_TEMP/team.html"

          PLAYER_ID="$(psql -Atc \
            "select id from football.players where display_name = 'Web Smoke Forward' order by id desc limit 1")"
          PLAYER_STATUS="$(curl -sS -o "$RUNNER_TEMP/player.html" -w '%{http_code}' \
            "http://127.0.0.1:3000/player/$PLAYER_ID")"
          test "$PLAYER_STATUS" = "404"

          for route in team-rankings compare results-vs-performance watchlist; do
            curl -fsS "http://127.0.0.1:3000/$route" > "$RUNNER_TEMP/$route.html"
            ! grep -q "Web Smoke Forward" "$RUNNER_TEMP/$route.html"
            ! grep -q "Web Smoke City" "$RUNNER_TEMP/$route.html"
          done
          grep -q "RESULTS VS PERFORMANCE" "$RUNNER_TEMP/results-vs-performance.html"
          grep -q "PERSISTENT WATCHLIST" "$RUNNER_TEMP/watchlist.html"
          grep -q "COMPARE · V2" "$RUNNER_TEMP/compare.html"

          # Without an explicit player context matching the primary team scope,
          # the read path must fail closed instead of exposing legacy/test or
          # historical candidates through the current-context watchlist.
          ! grep -q "$FOOTBALL_INTELLIGENCE_WRITE_TOKEN" "$RUNNER_TEMP/watchlist.html"
          grep -q "Sin jugadores del contexto principal" "$RUNNER_TEMP/watchlist.html"
          ! grep -q "name=\"playerId\"" "$RUNNER_TEMP/watchlist.html"

          curl -fsS \
            "http://127.0.0.1:3000/tactics?competition=ENG_PL&confidence=0" \
            > "$RUNNER_TEMP/tactics.html"
          grep -q "Web Smoke City" "$RUNNER_TEMP/tactics.html"
          grep -q "Formación y estilo observable" "$RUNNER_TEMP/tactics.html"

          curl -fsS \
            "http://127.0.0.1:3000/radar?confidence=0" \
            > "$RUNNER_TEMP/radar.html"
          grep -q "Web Smoke Radar Forward" "$RUNNER_TEMP/radar.html"
          grep -q "World Radar V1 detecta" "$RUNNER_TEMP/radar.html"
          grep -q "V2 no disponible" "$RUNNER_TEMP/radar.html"

          curl -fsS \
            "http://127.0.0.1:3000/lab" \
            > "$RUNNER_TEMP/lab.html"
          ! grep -q "core:web-smoke" "$RUNNER_TEMP/lab.html"
          ! grep -q "competition:ENG_PL:web-smoke" "$RUNNER_TEMP/lab.html"
          grep -q "V1 VALIDATION" "$RUNNER_TEMP/lab.html"
          grep -q "validation-v1.0" "$RUNNER_TEMP/lab.html"

          curl -fsS \
            "http://127.0.0.1:3000/sources" \
            > "$RUNNER_TEMP/sources.html"
          grep -q "thesportsdb" "$RUNNER_TEMP/sources.html"
          grep -q "openligadb" "$RUNNER_TEMP/sources.html"
          grep -q "football-data-uk" "$RUNNER_TEMP/sources.html"
          grep -q "Coincidencias" "$RUNNER_TEMP/sources.html"
          grep -q "GER_BL1" "$RUNNER_TEMP/sources.html"
          grep -q "HISTÓRICO" "$RUNNER_TEMP/sources.html"
          grep -q "TEMPORADA ANTERIOR" "$RUNNER_TEMP/sources.html"
          grep -q "TOKEN" "$RUNNER_TEMP/sources.html"
