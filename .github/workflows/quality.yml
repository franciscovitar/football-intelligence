name: Quality

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:build

  analytics:
    name: Analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - working-directory: analytics
        run: uv run ruff check .
      - working-directory: analytics
        run: uv run ruff format --check .
      - working-directory: analytics
        run: uv run mypy src
      - working-directory: analytics
        run: uv run pytest

  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: football_intelligence_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_intelligence_test
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Apply data foundation migration
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/migrations/20260811181000_create_data_foundation.sql
      - name: Apply core seeds
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/seeds/001_core_catalog.sql
      - name: Verify schema contracts
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/tests/001_schema_contract.sql
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - name: Verify provider persistence integration
        working-directory: analytics
        run: uv run pytest tests/integration/test_provider_persistence.py
