name: Quality

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:build

  analytics:
    name: Analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - working-directory: analytics
        run: uv run ruff check .
      - working-directory: analytics
        run: uv run ruff format --check .
      - working-directory: analytics
        run: uv run mypy src
      - working-directory: analytics
        run: uv run pytest

  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: football_intelligence_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_intelligence_test
      INTERNAL_LAB_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Apply core seeds
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/seeds/001_core_catalog.sql
      - name: Verify schema contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in database/tests/*.sql; do
            echo "Checking $contract"
            psql -v ON_ERROR_STOP=1 -f "$contract"
          done
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - working-directory: analytics
        run: uv sync --dev --locked
      - name: Verify PostgreSQL integrations
        working-directory: analytics
        run: uv run pytest tests/integration
      - name: Seed deterministic web smoke data
        run: >-
          psql -v ON_ERROR_STOP=1
          -f database/fixtures/001_web_smoke.sql
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Next.js PostgreSQL read path
        shell: bash
        run: |
          set -euo pipefail

          npm --workspace @football-intelligence/web run dev -- \
            --hostname 127.0.0.1 \
            --port 3000 \
            > "$RUNNER_TEMP/web-smoke.log" 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3000/" > "$RUNNER_TEMP/home.html"; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/web-smoke.log"
            exit 1
          fi

          grep -q "Web Smoke Forward" "$RUNNER_TEMP/home.html"

          curl -fsS \
            "http://127.0.0.1:3000/rankings?window=season&role=forward&confidence=0.5" \
            > "$RUNNER_TEMP/rankings.html"
          grep -q "Web Smoke Forward" "$RUNNER_TEMP/rankings.html"

          PLAYER_ID="$(psql -Atc \
            "select id from football.players where display_name = 'Web Smoke Forward' order by id desc limit 1")"
          test -n "$PLAYER_ID"

          curl -fsS \
            "http://127.0.0.1:3000/player/$PLAYER_ID" \
            > "$RUNNER_TEMP/player.html"
          grep -q "Web Smoke Forward" "$RUNNER_TEMP/player.html"
          grep -q "Performance vs Forma" "$RUNNER_TEMP/player.html"

          curl -fsS \
            "http://127.0.0.1:3000/lab" \
            > "$RUNNER_TEMP/lab.html"
          grep -q "core:web-smoke" "$RUNNER_TEMP/lab.html"
