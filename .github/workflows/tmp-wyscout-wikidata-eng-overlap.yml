name: Temporary Wyscout x Wikidata ENG Overlap Evidence

on:
  push:
    branches:
      - evidence/wyscout-wikidata-eng-overlap

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Sync analytics environment
        working-directory: analytics
        run: uv sync --dev --locked

      - name: Run real-source Wyscout x Wikidata overlap audit
        working-directory: analytics
        run: |
          uv run football-intelligence-audit-wyscout-wikidata-overlap \
            --cache-dir "$RUNNER_TEMP/wyscout-wikidata-cache" \
            --report "$RUNNER_TEMP/wyscout-wikidata-eng-overlap.json"

      - name: Print overlap summary and select bounded QIDs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((root / 'wyscout-wikidata-eng-overlap.json').read_text())
          keys = [
              'status', 'wyscout_roster_total', 'wyscout_profiles_available',
              'team_mappings_resolved', 'team_total', 'wikidata_discovery_entities',
              'players_with_exact_name_candidate', 'players_with_unique_candidate',
              'wikidata_entities_loaded', 'wikidata_exact_dob_coverage',
              'wikidata_citizenship_coverage', 'wikidata_position_coverage',
              'wikidata_bounded_team_context_coverage', 'candidate_state_counts', 'failures'
          ]
          print(json.dumps({key: report.get(key) for key in keys}, indent=2, sort_keys=True))
          unresolved = [
              row for row in report['team_mappings'] if row.get('status') != 'resolved'
          ]
          print('UNRESOLVED TEAM MAPPINGS:')
          print(json.dumps(unresolved, indent=2, ensure_ascii=False, sort_keys=True))
          candidates = [
              row for row in report['results']
              if row.get('state') == 'review_required' and row.get('wikidata_qid')
          ]
          candidates.sort(key=lambda row: (
              not bool(row.get('wikidata_has_bounded_team_context')),
              not bool(row.get('wikidata_has_exact_dob')),
              row['wikidata_qid'],
          ))
          qids = [row['wikidata_qid'] for row in candidates[:50]]
          assert len(qids) == 50 and len(set(qids)) == 50, len(qids)
          (root / 'wikidata-bounded-qids.json').write_text(
              json.dumps(qids, indent=2, sort_keys=True) + '\n'
          )
          print(f'BOUNDED QID SELECTION: PASS count={len(qids)}')
          PY

      - name: Collect immutable bounded profile snapshot
        working-directory: analytics
        run: |
          uv run football-intelligence-collect-wikidata-profiles \
            --qid-file "$RUNNER_TEMP/wikidata-bounded-qids.json" \
            --snapshot-id "wikidata-eng-pl-2017-18-review-required-50" \
            --competition ENG_PL \
            --season 2017/18 \
            --output-dir "$RUNNER_TEMP/wikidata-static-snapshot"

      - name: Audit frozen snapshot integrity and profile coverage
        working-directory: analytics
        run: |
          uv run football-intelligence-audit-wikidata-profiles \
            --manifest "$RUNNER_TEMP/wikidata-static-snapshot/manifest.json" \
            --base-dir "$RUNNER_TEMP/wikidata-static-snapshot" \
            --report "$RUNNER_TEMP/wikidata-static-snapshot-audit.json"
          cat "$RUNNER_TEMP/wikidata-static-snapshot-audit.json"

      - name: Upload bounded evidence
        uses: actions/upload-artifact@v7
        with:
          name: wyscout-wikidata-eng-bounded-snapshot-evidence
          path: |
            ${{ runner.temp }}/wyscout-wikidata-eng-overlap.json
            ${{ runner.temp }}/wikidata-bounded-qids.json
            ${{ runner.temp }}/wikidata-static-snapshot/
            ${{ runner.temp }}/wikidata-static-snapshot-audit.json
          retention-days: 7
