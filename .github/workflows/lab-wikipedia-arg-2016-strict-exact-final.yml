# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Wikipedia ARG_LPF 2016 exact appearance coverage final
on:
  push:
    branches: [lab/wikipedia-arg-2016-roster-revisions]
    paths: [.github/workflows/lab-wikipedia-arg-2016-strict-exact-final.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6.2.0
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          name: wikipedia-arg-2016-player-appearance-coverage-v2-33078390845
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33078390845
          path: input_artifact
      - name: Measure exact competition-linked coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out
          python - <<'PY'
          import json,re,time,unicodedata,urllib.parse,urllib.request
          from collections import Counter,defaultdict
          from pathlib import Path
          API='https://es.wikipedia.org/w/api.php';UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          slots=json.loads(Path('input_artifact/slots.json').read_text());assert len(slots)==903
          A={'Aldosivi':['aldosivi'],'Argentinos Juniors':['argentinos juniors'],'Arsenal de Sarandí':['arsenal'],'Atlético de Rafaela':['atletico de rafaela','rafaela'],'Atlético Tucumán':['atletico tucuman'],'Banfield':['banfield'],'Belgrano de Córdoba':['belgrano'],'Boca Juniors':['boca juniors','boca'],'Colón':['colon'],'Defensa y Justicia':['defensa y justicia'],'Estudiantes':['estudiantes'],'Gimnasia de La Plata':['gimnasia'],'Godoy Cruz':['godoy cruz'],'Huracán':['huracan'],'Independiente':['independiente'],'Lanús':['lanus'],"Newell's Old Boys":["newell's","newells"],'Olimpo':['olimpo'],'Patronato':['patronato'],'Quilmes':['quilmes'],'Racing Club':['racing'],'River Plate':['river plate','river'],'Rosario Central':['rosario central'],'San Lorenzo':['san lorenzo'],'San Martín de San Juan':['san martin'],'Sarmiento de Junín':['sarmiento'],'Temperley':['temperley'],'Tigre':['tigre'],'Unión de Santa Fe':['union'],'Vélez Sarsfield':['velez']}
          EXACT=re.compile(r'\[\[Campeonato de Primera División 2016(?: \(Argentina\))?(?:\|[^\]]+)?\]\]',re.I)
          def fold(v):
              d=unicodedata.normalize('NFKD',v or '');return ''.join(c for c in d if not unicodedata.combining(c)).casefold()
          def req(p):
              u=f"{API}?{urllib.parse.urlencode(p)}";r=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
              for a in range(1,5):
                  try:
                      with urllib.request.urlopen(r,timeout=40) as h:x=json.loads(h.read())
                      if 'error' in x:raise RuntimeError(str(x['error']))
                      return x
                  except Exception:
                      if a==4:raise
                      time.sleep(a*1.3)
          targets=[];seen=set()
          for s in slots:
              t=s.get('player_target')
              if t and t not in seen:seen.add(t);targets.append(t)
          pages={}
          for i in range(0,len(targets),40):
              batch=targets[i:i+40];q=req({'action':'query','prop':'revisions','titles':'|'.join(batch),'redirects':'1','rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'}).get('query',{})
              nm={x['from']:x['to'] for x in q.get('normalized',[]) if isinstance(x,dict)};rm={x['from']:x['to'] for x in q.get('redirects',[]) if isinstance(x,dict)};bt={x.get('title'):x for x in q.get('pages',[]) if isinstance(x,dict)}
              for t in batch:
                  n=nm.get(t,t);rt=rm.get(n,n);pg=bt.get(rt);rv=(pg.get('revisions') or [None])[0] if pg else None;text=((rv.get('slots') or {}).get('main') or {}).get('content') if rv else None
                  pages[t]={'state':'resolved' if isinstance(text,str) else ('missing' if pg and pg.get('missing') else 'unresolved'),'title':pg.get('title') if pg else rt,'pageid':pg.get('pageid') if pg else None,'revid':rv.get('revid') if rv else None,'timestamp':rv.get('timestamp') if rv else None,'text':text}
              time.sleep(.12)
          def exact_values(text,club):
              if not isinstance(text,str):return [],[]
              vals=[];ev=[];aliases=[fold(x) for x in A[club]]
              for m in EXACT.finditer(text):
                  table_start=text.rfind('{|',0,m.start());last_end=text.rfind('|}',0,m.start());start=max(0,table_start,last_end+2,m.start()-1800);prior=text[start:m.start()];fp=fold(prior)
                  pos=max((fp.rfind(a) for a in aliases),default=-1)
                  if pos<0 or len(fp)-pos>1500:continue
                  tail=text[m.end():m.end()+360];bounds=[p for p in (tail.find('|-'),tail.find('|}')) if p>=0];seg=tail[:min(bounds) if bounds else len(tail)]
                  n=re.search(r'(?:\|\||\|)\s*(?:\'\'\')?(\d{1,3})(?:\'\'\')?\s*(?=\|\||\||\n|$)',seg)
                  if n:
                      v=int(n.group(1));vals.append(v);ev.append({'value':v,'revision_context':prior[-900:],'tail':seg[:700]})
              return sorted(set(vals)),ev[:8]
          out=[]
          for s in slots:
              t=s.get('player_target');pg=pages.get(t) if t else None;vals,ev=exact_values(pg.get('text') if pg and pg['state']=='resolved' else None,s['club'])
              cls='strict_unique' if len(vals)==1 else 'strict_ambiguous' if len(vals)>1 else 'missing'
              out.append({'club':s['club'],'name':s['name'],'player_target':t,'page_state':pg.get('state') if pg else 'unlinked','page_title':pg.get('title') if pg else None,'pageid':pg.get('pageid') if pg else None,'revision_id':pg.get('revid') if pg else None,'revision_timestamp':pg.get('timestamp') if pg else None,'classification':cls,'strict_values':vals,'evidence':ev})
          byname={r['name']:r for r in out}
          assert byname['Gerónimo Poblete']['strict_values']==[15],byname['Gerónimo Poblete']
          assert byname['Adrián Cubas']['strict_values']==[6],byname['Adrián Cubas']
          assert byname['Agustín Orion']['strict_values']==[12],byname['Agustín Orion']
          c=Counter(r['classification'] for r in out);resolved=sum(r['page_state']=='resolved' for r in out);pc=defaultdict(Counter)
          for r in out:pc[r['club']][r['classification']]+=1
          summary={'status':'PASS','decision_question':'Can exact competition-linked rows on current Spanish Wikipedia player pages provide a dense and defensible appearance backbone for Argentina Primera 2016?','population':{'roster_slots':903,'linked_slots':sum(bool(r['player_target']) for r in out),'unique_targets':len(targets),'resolved_page_slots':resolved},'classification_counts':dict(c),'strict_unique_rate_all_slots':round(c['strict_unique']/903,4),'strict_unique_rate_resolved_slots':round(c['strict_unique']/resolved,4),'per_club':{k:dict(v) for k,v in sorted(pc.items())},'parser_regression_anchors':{n:byname[n] for n in ('Gerónimo Poblete','Adrián Cubas','Agustín Orion')},'known_authoritative_conflict':{'player':'Gerónimo Poblete','wikipedia_current':15,'wikipedia_historical_sample':12,'afa_official_numerosdeprimera':14,'afa_basis':'61 recoveries / 14 appearances = 4.4'},'semantics':'Only exact Campeonato de Primera División 2016 links count. Plain calendar-year 2016 rows are excluded from this final coverage metric.','non_claims':['Parseable Wikipedia rows are not authoritative when stronger evidence conflicts.','Missing means unknown, never zero.','No minutes, fuzzy identity matching, PlayerCrosswalk or production write.']}
          Path('probe_out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n');Path('probe_out/slots.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'population':summary['population'],'classification_counts':summary['classification_counts'],'strict_unique_rate_all_slots':summary['strict_unique_rate_all_slots']},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-strict-exact-final-${{ github.run_id }}
          path: probe_out
          if-no-files-found: error
          retention-days: 7
