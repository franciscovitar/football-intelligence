name: Temporary Final Third Implementation

on:
  push:
    branches:
      - feat/wyscout-final-third-v04

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - run: python .github/tmp_apply_final_third_patch.py
      - run: |
          rm -f .github/tmp_apply_final_third_patch.py
          rm -f .github/workflows/tmp-final-third-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: promote exact Wyscout final-third evidence"
          git push origin HEAD:feat/wyscout-final-third-v04
