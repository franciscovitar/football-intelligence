name: Temporary Final Third Implementation

on:
  push:
    branches:
      - feat/wyscout-final-third-v04

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run deterministic final-third patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Apply patch and remove temporary helpers
        run: |
          python .github/tmp_apply_final_third_patch.py
          rm .github/tmp_apply_final_third_patch.py
          rm .github/workflows/tmp-final-third-implementation.yml

      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "feat: promote exact Wyscout final-third evidence"
          git push origin HEAD:feat/wyscout-final-third-v04
