# Disposable implementation-verification workflow; remove after evidence is captured.
name: Lab RSSSF ARG_LPF 2016 product verification

on:
  push:
    branches:
      - lab/rsssf-arg-2016-match-backbone
    paths:
      - .github/workflows/lab-rsssf-arg-2016-match-backbone-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install analytics environment
        working-directory: analytics
        run: uv sync --dev --locked
      - name: Run focused RSSSF tests
        working-directory: analytics
        run: >-
          uv run pytest
          tests/test_rsssf_client.py
          tests/test_data_mesh_adapters_rsssf.py
          tests/test_rsssf_data_mesh_resolution.py
          tests/test_real_data_source_policy.py
      - name: Verify live RSSSF source through production provider and adapter
        working-directory: analytics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rsssf"
          uv run python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from football_intelligence.data_mesh.adapters.rsssf import adapt_argentina_2016_snapshot
          from football_intelligence.data_mesh.pipeline import resolve_logical_key
          from football_intelligence.providers.rsssf import RSSSFArgentina2016Client

          snapshot = RSSSFArgentina2016Client().fetch()
          observations = adapt_argentina_2016_snapshot(snapshot, ingestion_run_id=None)
          match_observations = [o for o in observations if o.entity_type == "match"]
          team_observations = [o for o in observations if o.entity_type == "team"]

          assert len(snapshot.matches) == 242
          assert len(observations) == 1694
          assert len(match_observations) == 1210
          assert len(team_observations) == 484
          assert not any(o.entity_type == "player" for o in observations)
          assert not any(o.metric_name == "kickoff_at" for o in observations)
          assert Counter(o.metric_name for o in match_observations) == Counter({
              "status": 242,
              "round_name": 242,
              "venue_name": 242,
              "home_score": 242,
              "away_score": 242,
          })

          resolutions = [
              resolve_logical_key(o, match_date_clusters={})
              for o in match_observations
          ]
          assert all(r.status == "resolved" and r.logical_key for r in resolutions)
          logical_matches = {r.logical_key for r in resolutions}
          assert len(logical_matches) == 242

          summary = {
              "matches": len(snapshot.matches),
              "observations": len(observations),
              "match_observations": len(match_observations),
              "team_observations": len(team_observations),
              "resolved_logical_matches": len(logical_matches),
              "raw_sha256": snapshot.raw_sha256,
              "content_type": snapshot.content_type,
              "decoded_charset": snapshot.decoded_charset,
              "player_observations": 0,
              "kickoff_at_observations": 0,
          }
          Path("../rsssf-product-verification.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload verification summary
        uses: actions/upload-artifact@v4
        with:
          name: rsssf-arg-2016-product-verification-${{ github.run_id }}
          path: rsssf-product-verification.json
          if-no-files-found: error
          retention-days: 7
