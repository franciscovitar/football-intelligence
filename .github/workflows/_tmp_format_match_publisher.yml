name: Temporary Publisher Formatter

on:
  push:
    branches:
      - feat/match-research-publisher-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/match-research-publisher-v1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - working-directory: analytics
        run: uv sync --dev --locked
      - working-directory: analytics
        run: uv run ruff check --fix .
      - working-directory: analytics
        run: uv run ruff format .
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format match research publisher"
          git push origin HEAD:feat/match-research-publisher-v1
