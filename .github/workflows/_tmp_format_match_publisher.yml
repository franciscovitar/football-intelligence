name: Temporary Publisher Formatter

on:
  push:
    branches:
      - feat/match-research-publisher-v1

permissions:
  contents: write

# Triggered only to apply the diagnosed four-line rollback-sentinel correction.
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/match-research-publisher-v1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - working-directory: analytics
        run: uv sync --dev --locked
      - name: Apply diagnosed dry-run rollback fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("analytics/src/football_intelligence/publishing/publisher.py")
          text = path.read_text(encoding="utf-8")
          old = '''@dataclass(frozen=True, slots=True)
class _DryRunRollback(Exception):
    result: MatchPublishResult
'''
          new = '''class _DryRunRollback(Exception):
    def __init__(self, result: MatchPublishResult) -> None:
        super().__init__("dry-run rollback")
        self.result = result
'''
          if old not in text:
              raise SystemExit("expected frozen dry-run sentinel definition not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - working-directory: analytics
        run: uv run ruff format src/football_intelligence/publishing/publisher.py
      - working-directory: analytics
        run: uv run ruff check src/football_intelligence/publishing/publisher.py
      - working-directory: analytics
        run: uv run mypy src/football_intelligence/publishing/publisher.py
      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_format_match_publisher.yml
          git add analytics/src/football_intelligence/publishing/publisher.py
          git commit -m "fix: allow dry-run transaction rollback"
          git push origin HEAD:feat/match-research-publisher-v1
