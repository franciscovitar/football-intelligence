name: Snapshot Wyscout Missing Leagues V2

on:
  push:
    branches:
      - evidence/wyscout-missing-leagues-v2-certification
    paths:
      - .github/workflows/snapshot-wyscout-missing-leagues-v2.yml

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_BRANCH: evidence/wyscout-missing-leagues-v2-certification
      TARGET_WORKFLOW: wyscout-missing-leagues-v2-local-certification.yml
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: evidence/wyscout-missing-leagues-v2-certification
      - name: Snapshot latest certification run
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs" \
            -f branch="${EVIDENCE_BRANCH}" \
            -f per_page=5 \
            --jq '.workflow_runs[0]')"
          if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
            echo "No certification run found" >&2
            exit 1
          fi
          mkdir -p evidence/wyscout-open
          RUN_JSON="$RUN_JSON" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(os.environ["RUN_JSON"])
          payload = {
              "run_id": run["id"],
              "status": run["status"],
              "conclusion": run.get("conclusion"),
              "html_url": run["html_url"],
              "head_sha": run["head_sha"],
              "run_number": run["run_number"],
              "created_at": run["created_at"],
              "updated_at": run["updated_at"],
          }
          Path("evidence/wyscout-open/missing-leagues-player-v2-run-snapshot.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Persist snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/wyscout-open/missing-leagues-player-v2-run-snapshot.json
          git commit -m "evidence: snapshot Wyscout V2 certification status"
          git push origin HEAD:evidence/wyscout-missing-leagues-v2-certification
