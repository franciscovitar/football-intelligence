name: Lab AFA ARG_LPF 2016 refined signals

on:
  push:
    branches:
      - lab/afa-arg-2016-refined-signals
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Search Internet Archive for 2016 AFA stats snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          PATH='deposito/html/v3/htmlCenter/data/deportes/futbol/primeraa/statsCenter/'
          ORIGINALS=[
              'http://www.afa.org.ar/'+PATH+'playersStats.json',
              'https://www.afa.org.ar/'+PATH+'playersStats.json',
              'http://www.afa.org.ar/'+PATH+'playersStatsFull.json',
              'https://www.afa.org.ar/'+PATH+'playersStatsFull.json',
              'http://info.afa.org.ar/'+PATH+'playersStats.json',
              'https://info.afa.org.ar/'+PATH+'playersStats.json',
          ]
          ANCHORS={'Poblete':'642','Ledesma':'632','Ortigoza':'583','Sand':'14','Malcorra':'8','Ascacibar':'62','Zuqui':'55'}

          def get(url: str,accept='application/json,text/plain,*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=35) as resp:
                  return resp.status,resp.headers.get('Content-Type'),resp.geturl(),resp.read()

          cdx_rows=[]; snapshots=[]
          for original in ORIGINALS:
              params={
                  'url':original,'from':'2016','to':'2016','output':'json',
                  'fl':'timestamp,original,statuscode,mimetype,digest,length',
                  'filter':'statuscode:200','collapse':'digest'
              }
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              row={'original':original,'cdx_url':url}
              try:
                  status,ctype,final,body=get(url)
                  data=json.loads(body.decode('utf-8','replace'))
                  headers=data[0] if data else []
                  records=[dict(zip(headers,r)) for r in data[1:]] if len(data)>1 else []
                  row.update({'status':status,'records':records})
                  for rec in records:
                      key=(rec.get('timestamp'),rec.get('original'))
                      if key not in {(s['timestamp'],s['original']) for s in snapshots}:
                          snapshots.append({'timestamp':rec.get('timestamp'),'original':rec.get('original'),'digest':rec.get('digest')})
              except Exception as exc:
                  row['error']=type(exc).__name__+': '+str(exc)[:500]
              cdx_rows.append(row)

          # Fetch only snapshots closest to the end of the 2016 short tournament / official June summaries.
          snapshots=sorted(snapshots,key=lambda x:x['timestamp'] or '')
          chosen=sorted(snapshots,key=lambda x:abs(int((x['timestamp'] or '20160101000000')[:8])-20160607))[:20]
          fetched=[]
          for snap in chosen:
              ts=snap['timestamp']; original=snap['original']; replay=f'https://web.archive.org/web/{ts}id_/{original}'
              row={**snap,'replay_url':replay}
              try:
                  status,ctype,final,body=get(replay); text=body.decode('utf-8','replace')
                  row.update({'status':status,'content_type':ctype,'final_url':final,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
                  try:
                      parsed=json.loads(text); row['json_valid']=True; row['root_keys']=list(parsed.keys())[:80] if isinstance(parsed,dict) else None
                  except Exception as exc:
                      row['json_valid']=False; row['json_error']=type(exc).__name__+': '+str(exc)[:200]
                  hits={}
                  for name,expected in ANCHORS.items():
                      if name.casefold() in text.casefold():
                          vals=[]
                          for m in re.finditer(re.escape(name),text,re.I):
                              vals.append(re.sub(r'\s+',' ',text[max(0,m.start()-220):min(len(text),m.end()+650)])[:900])
                              if len(vals)>=3: break
                          hits[name]={'expected_official_value':expected,'snippets':vals}
                  row['anchor_hits']=hits
                  Path('probe_out/raw',f'{ts}_{hashlib.sha1(original.encode()).hexdigest()[:8]}.json').write_bytes(body)
              except Exception as exc:
                  row['error']=type(exc).__name__+': '+str(exc)[:500]
              fetched.append(row)

          payload={'candidate_originals':ORIGINALS,'cdx_queries':cdx_rows,'unique_2016_snapshots':len(snapshots),'snapshots':snapshots,'fetched_candidates':fetched,'validation_anchors':ANCHORS}
          Path('probe_out/summary.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afa-arg-2016-wayback-player-stats
          path: probe_out
          if-no-files-found: error
          retention-days: 7
