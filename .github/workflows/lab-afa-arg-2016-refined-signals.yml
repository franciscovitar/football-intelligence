name: Lab AFA ARG_LPF 2016 refined signals

on:
  push:
    branches:
      - lab/afa-arg-2016-refined-signals
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Search Wayback by prefix and legacy module paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          QUERIES=[
            ('stats_htmlcenter','http://www.afa.org.ar/deposito/html/v3/htmlCenter/data/deportes/futbol/primeraa/statsCenter/*'),
            ('stats_no_htmlcenter','http://www.afa.org.ar/deposito/html/v3/data/deportes/futbol/primeraa/statsCenter/*'),
            ('primeraa_data','http://www.afa.org.ar/deposito/html/v3/htmlCenter/data/deportes/futbol/primeraa/*'),
            ('module','http://www.afa.org.ar/deposito/html/v3/module.html*'),
            ('index','http://www.afa.org.ar/deposito/html/v3/index.html*'),
          ]

          def get(url, timeout=55):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.geturl(),r.read()

          out=[]; all_records=[]
          for key,target in QUERIES:
              params={'url':target,'from':'2016','to':'2016','output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','collapse':'urlkey','limit':'1000'}
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              row={'key':key,'target':target,'cdx_url':url}
              try:
                  status,final,body=get(url)
                  data=json.loads(body.decode('utf-8','replace'))
                  header=data[0] if data else []
                  records=[dict(zip(header,r)) for r in data[1:]] if len(data)>1 else []
                  row.update({'status':status,'record_count':len(records),'records':records[:300]})
                  all_records.extend(records)
              except Exception as e:
                  row['error']=type(e).__name__+': '+str(e)[:400]
              out.append(row)

          # Focus only on resources plausibly useful for reconstructing the 2016 data path.
          useful=[]
          for r in all_records:
              u=(r.get('original') or '').lower()
              if any(x in u for x in ('playersstats','teamsstats','teamslist','module.html','mc.defaultparams','mc.config','mc.datagetter')):
                  useful.append(r)

          payload={'queries':out,'useful_records':useful,'useful_count':len(useful)}
          Path('probe_out/summary.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'query_counts':[(x['key'],x.get('record_count'),x.get('error')) for x in out],'useful_count':len(useful),'useful_records':useful[:100]},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afa-arg-2016-wayback-prefix-search
          path: probe_out/summary.json
          if-no-files-found: error
          retention-days: 7
