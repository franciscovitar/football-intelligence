name: Lab AFA ARG_LPF 2016 refined signals

on:
  push:
    branches:
      - lab/afa-arg-2016-refined-signals
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Inspect DataFactory SSA and data-loading modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          BASE='https://info.afa.org.ar/deposito/html/v3/htmlCenter/'
          RELATIVE=[
              'core/mc.core.min.js',
              'core/mc.ssa.min.js',
              'core/mc.dataGetter.min.js',
              'core/mc.dataHandler.min.js',
              'core/mc.ajaxJSONLoad.min.js',
              'core/mc.defaultParams.min.js',
              'core/mc.modulesHandler.min.js',
              'core/mc.functionsByChannel.min.js',
              'core/mc.dataTemplates.min.js',
              'customization/mc.config.js',
          ]

          def get(url: str):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/javascript,application/json,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  return resp.status,resp.headers.get('Content-Type'),resp.geturl(),resp.read()

          rows=[]
          for rel in RELATIVE:
              url=BASE+rel; row={'relative_path':rel,'url':url}
              try:
                  status,ctype,final,body=get(url); text=body.decode('utf-8','replace')
                  leaf=hashlib.sha1(rel.encode()).hexdigest()[:8]+'_'+rel.replace('/','_')
                  Path('probe_out/raw',leaf+'.txt').write_text(text,encoding='utf-8')
                  snippets=[]
                  for m in re.finditer(r'.{0,220}(?:ssa\.datafactory\.la|datafactory|url\s*:|baseurl|api|service|endpoint|ajax|\.getjson|xmlhttprequest|channel|event|tabletype|statscenter|loadjson|datagetter|authorization|token|apikey|apiKey).{0,420}',text,re.I|re.S):
                      s=re.sub(r'\s+',' ',m.group(0)).strip()
                      s=re.sub(r'(?i)((?:api[_-]?key|authorization|token)\s*[:=]\s*[\"\']?)[^\"\'\s,;}]+',r'\1<redacted>',s)
                      if s not in snippets: snippets.append(s[:750])
                  literals=sorted(set(re.findall(r'https?://[^\"\'\s<>]+',text)))
                  row.update({'status':status,'content_type':ctype,'final_url':final,'bytes':len(body),'urls':literals[:100],'interesting_snippets':snippets[:180]})
              except Exception as exc:
                  row['error']=type(exc).__name__+': '+str(exc)[:450]
              rows.append(row)

          payload={'base':BASE,'modules':rows,'note':'Credential-like values are redacted; only public client-side request structure is being audited.'}
          Path('probe_out/summary.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afa-arg-2016-datafactory-ssa-path
          path: probe_out
          if-no-files-found: error
          retention-days: 7
