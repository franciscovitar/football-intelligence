name: Lab AFA ARG_LPF 2016 refined signals

on:
  push:
    branches:
      - lab/afa-arg-2016-refined-signals
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Inspect legacy DataFactory client configuration
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          CHANNEL='deportes.futbol.primeraa.statsCenterPerPlayer'
          module='https://info.afa.org.ar/deposito/html/v3/module.html?'+urllib.parse.urlencode({
              'channel':CHANNEL,'lang':'es_LA','module':'statsCenterPerPlayer','tableType':'passes','hideStatsCenterMenu':'true'
          })
          targets={
              'module_html':module,
              'index_html':'https://info.afa.org.ar/deposito/html/v3/index.html?'+urllib.parse.urlencode({'channel':CHANNEL,'lang':'es_LA'}),
              'htmlCenterApp_js':'https://info.afa.org.ar/deposito/html/v3/htmlCenterApp.js',
              'ssa_root':'https://ssa.datafactory.la/',
          }

          def get(url: str):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/javascript,application/json,*/*'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  return resp.status,resp.headers.get('Content-Type'),resp.geturl(),resp.read()

          report=[]
          for key,url in targets.items():
              row={'key':key,'url':url}
              try:
                  status,ctype,final,body=get(url)
                  text=body.decode('utf-8','replace')
                  Path(f'probe_out/raw/{key}.txt').write_text(text,encoding='utf-8')
                  urls=sorted(set(re.findall(r'https?://[^\"\'\s<>]+',text)))
                  apiish=sorted(set(re.findall(r'[^\"\'\s]{0,100}(?:datafactory|ssa\.|api|service|endpoint|channel|statsCenter|tableType)[^\"\'\s]{0,180}',text,re.I)))
                  row.update({
                      'status':status,'content_type':ctype,'final_url':final,'bytes':len(body),
                      'urls':urls[:120],
                      'apiish_snippets':[re.sub(r'\s+',' ',s)[:300] for s in apiish[:160]],
                      'contains_datafactory':'datafactory' in text.casefold(),
                      'contains_ssa':'ssa.' in text.casefold(),
                      'contains_stats_center':'statscenter' in text.casefold(),
                  })
              except Exception as exc:
                  row['error']=type(exc).__name__+': '+str(exc)[:500]
              report.append(row)

          Path('probe_out/summary.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afa-arg-2016-datafactory-client-probe
          path: probe_out
          if-no-files-found: error
          retention-days: 7
