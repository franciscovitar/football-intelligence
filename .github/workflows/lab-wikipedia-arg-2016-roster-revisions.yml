# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Wikipedia ARG_LPF 2016 historical roster revisions

on:
  push:
    branches:
      - lab/wikipedia-arg-2016-roster-revisions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Fetch five Spanish-Wikipedia revisions near tournament start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = 'https://es.wikipedia.org/w/api.php'
          UA = 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          TITLES = [
              'Club Atlético Lanús',
              'Club Atlético Boca Juniors',
              'Club Atlético River Plate',
              'Club Atlético Patronato de la Juventud Católica',
              'Club Atlético Tucumán',
          ]
          CUTOFF = '2016-02-09T00:00:00Z'
          out = []
          root = Path('probe_out/raw')

          def fetch(params: dict[str, str]) -> dict:
              url = f"{API}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read())
              if not isinstance(payload, dict):
                  raise RuntimeError('Wikipedia response root is not object')
              return payload

          for title in TITLES:
              payload = fetch({
                  'action': 'query',
                  'prop': 'revisions',
                  'titles': title,
                  'rvstart': CUTOFF,
                  'rvdir': 'older',
                  'rvlimit': '1',
                  'rvprop': 'ids|timestamp|content',
                  'rvslots': 'main',
                  'format': 'json',
                  'formatversion': '2',
              })
              pages = payload.get('query', {}).get('pages', [])
              if not isinstance(pages, list) or len(pages) != 1:
                  raise RuntimeError(f'unexpected page payload for {title!r}')
              page = pages[0]
              revisions = page.get('revisions') or []
              if not revisions:
                  out.append({'requested_title': title, 'resolved_title': page.get('title'), 'state': 'no_revision'})
                  continue
              rev = revisions[0]
              slots = rev.get('slots') if isinstance(rev, dict) else None
              main = slots.get('main') if isinstance(slots, dict) else None
              text = main.get('content') if isinstance(main, dict) else None
              if not isinstance(text, str):
                  raise RuntimeError(f'no main content for {title!r}')

              safe = re.sub(r'[^a-z0-9]+', '-', title.casefold()).strip('-')
              (root / f'{safe}.wikitext').write_text(text, encoding='utf-8')

              headings = []
              for m in re.finditer(r'^(={2,6})\s*(.*?)\s*\1\s*$', text, re.M):
                  label = re.sub(r'\[\[|\]\]', '', m.group(2)).strip()
                  if any(k in label.casefold() for k in ('plantel', 'plantilla', 'jugadores', 'equipo actual')):
                      headings.append({'label': label, 'offset': m.start()})

              snippets = []
              for h in headings[:5]:
                  start = max(0, h['offset'] - 200)
                  snippets.append(text[start:h['offset'] + 6000])

              # Diagnostic only. Do not treat these patterns as a certified roster parser.
              diagnostics = {
                  'footballer_template_count': len(re.findall(r'\{\{[^\n{}]*(?:jugador|futbolista)[^\n{}]*\}\}', text, re.I)),
                  'numbered_table_row_count': len(re.findall(r'^\|[-+]?\s*\d+\s*\|', text, re.M)),
                  'flagicon_count': text.casefold().count('{{bandera'),
                  'position_tokens': sum(text.casefold().count(tok) for tok in ('portero', 'arquero', 'defensa', 'mediocampista', 'delantero')),
              }

              out.append({
                  'requested_title': title,
                  'resolved_title': page.get('title'),
                  'pageid': page.get('pageid'),
                  'state': 'revision_found',
                  'revid': rev.get('revid'),
                  'timestamp': rev.get('timestamp'),
                  'bytes': len(text.encode('utf-8')),
                  'candidate_headings': headings,
                  'diagnostics': diagnostics,
                  'candidate_snippets': snippets,
              })
              time.sleep(0.2)

          Path('probe_out/summary.json').write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY

      - name: Upload bounded revision probe
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-roster-revision-probe
          path: |
            probe_out/summary.json
            probe_out/raw/
          if-no-files-found: error
          retention-days: 7
