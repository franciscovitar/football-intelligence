# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Wikipedia ARG_LPF 2016 historical roster revisions

on:
  push:
    branches:
      - lab/wikipedia-arg-2016-roster-revisions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Diagnose three anomalous historical roster sections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_out/raw
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          import unicodedata
          import urllib.parse
          import urllib.request
          from collections import Counter
          from pathlib import Path

          API='https://es.wikipedia.org/w/api.php'
          UA='FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          CASES={
              'Independiente': ('Club Atlético Independiente', 89024866),
              "Newell's Old Boys": ("Club Atlético Newell's Old Boys", 89025038),
              'San Lorenzo': ('Club Atlético San Lorenzo de Almagro', 89013971),
          }

          def fold(v):
              d=unicodedata.normalize('NFKD',v)
              return ''.join(c for c in d if not unicodedata.combining(c)).casefold()

          def fetch_oldid(revid):
              params={'action':'query','prop':'revisions','revids':str(revid),'rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'}
              req=urllib.request.Request(f"{API}?{urllib.parse.urlencode(params)}",headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as resp: payload=json.loads(resp.read())
              page=payload['query']['pages'][0]
              rev=page['revisions'][0]
              return page['title'], rev['timestamp'], rev['slots']['main']['content']

          def all_headings(text):
              hs=[]
              for m in re.finditer(r'^(={2,6})\s*(.*?)\s*\1\s*$',text,re.M):
                  hs.append({'level':len(m.group(1)),'label':m.group(2).strip(),'start':m.start(),'content_start':m.end()})
              for i,h in enumerate(hs):
                  end=len(text)
                  for n in hs[i+1:]:
                      if n['level']<=h['level']:
                          end=n['start'];break
                  h['end']=end
              return hs

          def template_names(text):
              names=[]; i=0
              while True:
                  start=text.find('{{',i)
                  if start<0: break
                  ends=[x for x in (text.find('|',start+2),text.find('}}',start+2),text.find('\n',start+2)) if x>=0]
                  if not ends: break
                  raw=text[start+2:min(ends)].strip()
                  if raw and len(raw)<100: names.append(re.sub(r'\s+',' ',raw))
                  i=start+2
              return names

          out=[]
          for club,(expected,revid) in CASES.items():
              title,ts,text=fetch_oldid(revid)
              Path(f"probe_out/raw/{club.replace(' ','-').replace('/','-')}.wikitext").write_text(text,encoding='utf-8')
              hs=all_headings(text)
              roster=[h for h in hs if any(k in fold(h['label']) for k in ('plantel','plantilla'))]
              candidates=[]
              for h in roster:
                  section=text[h['content_start']:h['end']]
                  nested=[n for n in hs if h['content_start']<=n['start']<h['end']]
                  names=Counter(template_names(section))
                  candidates.append({
                      'label':h['label'],'level':h['level'],'bytes':len(section.encode()),
                      'nested_headings':[{'level':n['level'],'label':n['label']} for n in nested],
                      'top_template_names':names.most_common(30),
                      'jugador_de_futbol_tokens':sum(v for k,v in names.items() if fold(k).replace(' ','')=='jugadordefutbol'),
                      'jugador_tokens':sum(v for k,v in names.items() if 'jugador' in fold(k)),
                      'section_prefix':section[:12000],
                  })
              out.append({'club':club,'resolved_title':title,'revid':revid,'timestamp':ts,'roster_sections':candidates})
          Path('probe_out/diagnostic.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          for row in out:
              print('\n###',row['club'])
              for s in row['roster_sections']:
                  print(s['label'], 'level',s['level'],'player-template-ish',s['jugador_tokens'])
                  print(' nested=',s['nested_headings'])
                  print(' templates=',s['top_template_names'][:15])
          PY
      - name: Upload bounded anomaly diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-arg-2016-roster-anomaly-diagnostic
          path: |
            probe_out/diagnostic.json
            probe_out/raw/
          if-no-files-found: error
          retention-days: 7
