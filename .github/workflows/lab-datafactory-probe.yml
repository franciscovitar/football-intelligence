# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab DataFactory API feasibility

on:
  push:
    branches:
      - lab/datafactory-api-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Probe real DataFactory API server without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lab_datafactory
          api='https://apidev3.datafactory.la:8443'

          probe() {
            name="$1"
            url="$2"
            curl --location --silent --show-error --max-time 30 \
              -H 'Accept: application/xml' \
              -D ".lab_datafactory/${name}.headers" \
              -w '%{http_code}' \
              "$url" \
              -o ".lab_datafactory/${name}.body" \
              > ".lab_datafactory/${name}.status" || true
          }

          probe health "$api/health"
          probe updates "$api/api/v1/updates?since=20241203T16:31:33Z"

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.lab_datafactory')
          out = {}
          for name in ('health', 'updates'):
              status = (root / f'{name}.status').read_text().strip()
              body = (root / f'{name}.body').read_text(encoding='utf-8', errors='replace')
              headers = (root / f'{name}.headers').read_text(encoding='utf-8', errors='replace')
              out[name] = {
                  'status': status,
                  'content_type': next((line.split(':', 1)[1].strip() for line in headers.splitlines() if line.lower().startswith('content-type:')), None),
                  'body_prefix': body[:5000],
                  'body_bytes': len(body.encode('utf-8')),
              }

          body = out['updates']['body_prefix']
          path_candidates = sorted(set(re.findall(r'/api/v1/sports/[^<\"\s]+', body)))
          out['updates']['path_candidates'] = path_candidates[:100]

          (root / 'summary.json').write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY

      - name: Upload bounded probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: datafactory-real-server-probe
          path: |
            .lab_datafactory/summary.json
            .lab_datafactory/*.status
            .lab_datafactory/*.body
            .lab_datafactory/*.headers
          if-no-files-found: error
          retention-days: 7
