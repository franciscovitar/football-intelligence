name: Temporary Wyscout Long Pass Promotion

on:
  push:
    branches: [feat/wyscout-long-pass-v1-1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/wyscout-long-pass-v1-1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Apply exact promotion patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          mapping = "analytics/src/football_intelligence/providers/wyscout_open_mapping.py"
          replace_exact(
              mapping,
              '''    _mapping(\n        "long_passes_accurate",\n        "player_match",\n        "DERIVABLE",\n        "passes_long intersected with passes_accurate",\n        "Inherits passes_long's pending spatial methodology.",\n        methodology_pending=True,\n    ),''',
              '''    _mapping(\n        "long_passes_accurate",\n        "player_match",\n        "DERIVABLE",\n        "fi-wyscout-spatial-v1.1 long-pass classification intersected with tag 1801",\n        "Promoted after the real ENG_PL 2017/18 spatial audit: Launch; High pass >25 m; "\n        "Simple/Smart pass >45 m; Cross/Hand/Head explicitly non-long; unknown or "\n        "geometry-dependent unclassifiable events remain missing.",\n        caveats=(\n            "Promotion is deliberately metric-specific. progressive_passes and "\n            "passes_into_final_third remain methodology/audit blocked and are not emitted."\n        ),\n    ),''',
          )

          adapter = "analytics/src/football_intelligence/data_mesh/adapters/wyscout_open.py"
          replace_exact(
              adapter,
              '''from football_intelligence.providers.wyscout_open_mapping import adapter_safe_mappings\nfrom football_intelligence.providers.wyscout_open_text import repair_wyscout_double_escaped_unicode''',
              '''from football_intelligence.providers.wyscout_open_mapping import adapter_safe_mappings\nfrom football_intelligence.providers.wyscout_open_text import repair_wyscout_double_escaped_unicode\nfrom football_intelligence.providers.wyscout_spatial_v1 import (\n    classify_long_pass,\n    is_accurate,\n    parse_pass_coordinates,\n)''',
          )
          replace_exact(
              adapter,
              '''the 77-identity adapter-safe subset (`adapter_safe_mappings()` in\n`providers.wyscout_open_mapping`: the 43 DIRECT + 34 DERIVABLE_READY Metric''',
              '''the 78-identity adapter-safe subset (`adapter_safe_mappings()` in\n`providers.wyscout_open_mapping`: the 43 DIRECT + 35 DERIVABLE_READY Metric''',
          )
          replace_exact(adapter, 'SEMANTIC_VERSION = "wyscout-open-v0.2"', 'SEMANTIC_VERSION = "wyscout-open-v0.3"')
          replace_exact(
              adapter,
              '''        ("pass_completion_pct", "player_match"),\n        ("assists", "player_match"),''',
              '''        ("pass_completion_pct", "player_match"),\n        ("long_passes_accurate", "player_match"),\n        ("assists", "player_match"),''',
          )
          replace_exact(
              adapter,
              '''    return counts, launches\n\n\ndef _observation(''',
              '''    return counts, launches\n\n\ndef _accumulate_long_pass_accurate(\n    events_payload: list[Any],\n) -> tuple[dict[tuple[int, int], int], frozenset[tuple[int, int]]]:\n    """Return accurate-long counts plus player-matches whose value is unknown.\n\n    A confirmed participant receives a real zero only when every Pass event is\n    safely classifiable under fi-wyscout-spatial-v1.1. Geometry-dependent\n    High/Simple/Smart passes with unusable coordinates, and any unknown Pass\n    subtype, make only this metric missing for that player-match.\n    """\n\n    accurate_long: dict[tuple[int, int], int] = defaultdict(int)\n    ambiguous: set[tuple[int, int]] = set()\n    for event in events_payload:\n        if not isinstance(event, dict) or event.get("eventName") != "Pass":\n            continue\n        match_id = event.get("matchId")\n        player_id = event.get("playerId")\n        if (\n            not isinstance(match_id, int)\n            or not isinstance(player_id, int)\n            or player_id == _SENTINEL_PLAYER_ID\n        ):\n            continue\n        sub_event = event.get("subEventName")\n        sub_event_name = sub_event if isinstance(sub_event, str) else None\n        classification = classify_long_pass(\n            sub_event_name=sub_event_name,\n            coordinates=parse_pass_coordinates(event),\n        )\n        pair = (match_id, player_id)\n        if classification == "ambiguous":\n            ambiguous.add(pair)\n        elif classification == "long" and is_accurate(event):\n            accurate_long[pair] += 1\n    return accurate_long, frozenset(ambiguous)\n\n\ndef _observation(''',
          )
          replace_exact(
              adapter,
              '''    counts: _ZeroDict,\n    observed_at: datetime,''',
              '''    counts: _ZeroDict,\n    long_passes_accurate: int | None,\n    observed_at: datetime,''',
          )
          replace_exact(
              adapter,
              '''    for metric_name in _PLAYER_MATCH_COUNT_METRICS:\n        emit(metric_name, counts[metric_name])\n\n    goals = counts["goals"]''',
              '''    for metric_name in _PLAYER_MATCH_COUNT_METRICS:\n        emit(metric_name, counts[metric_name])\n    if long_passes_accurate is not None:\n        emit("long_passes_accurate", long_passes_accurate)\n\n    goals = counts["goals"]''',
          )
          replace_exact(adapter, '"""The 38 player_match identities in the adapter-safe subset.', '"""The 39 player_match identities in the adapter-safe subset.')
          replace_exact(
              adapter,
              '''    counts_by_match_player, _launches = _accumulate_player_match_events(events_payload)\n\n    for match in matches_payload:''',
              '''    counts_by_match_player, _launches = _accumulate_player_match_events(events_payload)\n    accurate_long, ambiguous_long = _accumulate_long_pass_accurate(events_payload)\n\n    for match in matches_payload:''',
          )
          replace_exact(
              adapter,
              '''            counts = counts_by_match_player.get((info.match_id, player_id), _new_counts())\n            hints = _player_scoped_hints(info, roster, player_id, player_names, scope)\n            _emit_player_match_metrics(\n                observations,\n                seen,\n                match_id=info.match_id,\n                player_id=player_id,\n                counts=counts,\n                observed_at=observed_at,''',
              '''            pair = (info.match_id, player_id)\n            counts = counts_by_match_player.get(pair, _new_counts())\n            long_passes_accurate = None if pair in ambiguous_long else accurate_long.get(pair, 0)\n            hints = _player_scoped_hints(info, roster, player_id, player_names, scope)\n            _emit_player_match_metrics(\n                observations,\n                seen,\n                match_id=info.match_id,\n                player_id=player_id,\n                counts=counts,\n                long_passes_accurate=long_passes_accurate,\n                observed_at=observed_at,''',
          )

          normalizer = "analytics/src/football_intelligence/normalization/wyscout_historical.py"
          replace_exact(
              normalizer,
              '''    "passes_total",\n    "passes_accurate",\n    "key_passes",''',
              '''    "passes_total",\n    "passes_accurate",\n    "long_passes_accurate",\n    "key_passes",''',
          )
          replace_exact(
              normalizer,
              '''        passes_total=values["passes_total"],\n        passes_accurate=values["passes_accurate"],\n        key_passes=values["key_passes"],''',
              '''        passes_total=values["passes_total"],\n        passes_accurate=values["passes_accurate"],\n        long_passes_accurate=values["long_passes_accurate"],\n        key_passes=values["key_passes"],''',
          )

          models = "analytics/src/football_intelligence/normalization/models.py"
          replace_exact(
              models,
              '''    aerial_duels: int | None = None\n    aerial_duels_won: int | None = None''',
              '''    aerial_duels: int | None = None\n    aerial_duels_won: int | None = None\n    long_passes_accurate: int | None = None''',
          )

          provider_repo = "analytics/src/football_intelligence/db/provider_repository.py"
          replace_exact(
              provider_repo,
              '''                duels_total, duels_won, aerial_duels, aerial_duels_won,\n                fouls_drawn, fouls_committed, yellow_cards, red_cards, saves''',
              '''                duels_total, duels_won, aerial_duels, aerial_duels_won,\n                long_passes_accurate, fouls_drawn, fouls_committed, yellow_cards, red_cards, saves''',
          )
          replace_exact(
              provider_repo,
              '''                %(aerial_duels)s, %(aerial_duels_won)s, %(fouls_drawn)s,\n                %(fouls_committed)s, %(yellow_cards)s, %(red_cards)s, %(saves)s''',
              '''                %(aerial_duels)s, %(aerial_duels_won)s, %(long_passes_accurate)s,\n                %(fouls_drawn)s, %(fouls_committed)s, %(yellow_cards)s, %(red_cards)s, %(saves)s''',
          )
          replace_exact(
              provider_repo,
              '''                aerial_duels = excluded.aerial_duels,\n                aerial_duels_won = excluded.aerial_duels_won,\n                fouls_drawn = excluded.fouls_drawn,''',
              '''                aerial_duels = excluded.aerial_duels,\n                aerial_duels_won = excluded.aerial_duels_won,\n                long_passes_accurate = excluded.long_passes_accurate,\n                fouls_drawn = excluded.fouls_drawn,''',
          )

          reader = "analytics/src/football_intelligence/db/player_analytics_repository.py"
          replace_exact(
              reader,
              '''    "passes_total",\n    "passes_accurate",\n    "key_passes",''',
              '''    "passes_total",\n    "passes_accurate",\n    "long_passes_accurate",\n    "key_passes",''',
          )
          replace_exact(
              reader,
              '''                pms.passes_total,\n                pms.passes_accurate,\n                pms.key_passes,''',
              '''                pms.passes_total,\n                pms.passes_accurate,\n                pms.long_passes_accurate,\n                pms.key_passes,''',
          )
          PY
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Format changed Python files
        working-directory: analytics
        run: uv run ruff format src/football_intelligence/providers/wyscout_open_mapping.py src/football_intelligence/data_mesh/adapters/wyscout_open.py src/football_intelligence/normalization/wyscout_historical.py src/football_intelligence/normalization/models.py src/football_intelligence/db/provider_repository.py src/football_intelligence/db/player_analytics_repository.py
      - name: Commit promotion patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/src
          git commit -m "feat: promote Wyscout accurate long passes"
          git push origin HEAD:feat/wyscout-long-pass-v1-1
