# Disposable technical-spike workflow; remove after evidence is captured.
name: Lab Wikidata ARG_LPF 2016 roster feasibility

on:
  push:
    branches:
      - lab/wikidata-arg-lpf-2016-roster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Measure temporally provable Primera 2016 Wikidata roster
        env:
          REPORT_PATH: ${{ runner.temp }}/wikidata-arg-lpf-2016-roster-feasibility.json
        run: |
          python - <<'PY'
          from __future__ import annotations

          import calendar
          import json
          import os
          import re
          import statistics
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import date
          from urllib.error import HTTPError, URLError

          # 30 clubs from the RSSSF Primera División 2016 final tables.
          # 21 QIDs reuse the already-run 2024 Argentina club-resolution lab.
          KNOWN_CLUBS = {
              'Banfield': 'Q692646',
              'Gimnasia de La Plata': 'Q18640',
              'Rosario Central': 'Q318307',
              'Godoy Cruz': 'Q80882',
              'Independiente': 'Q214978',
              'Belgrano de Córdoba': 'Q59962',
              'San Lorenzo': 'Q218282',
              'Sarmiento de Junín': 'Q519966',
              'River Plate': 'Q15799',
              'Vélez Sarsfield': 'Q215163',
              'Huracán': 'Q327172',
              'Argentinos Juniors': 'Q220621',
              "Newell's Old Boys": 'Q221882',
              'Defensa y Justicia': 'Q1024338',
              'Atlético Tucumán': 'Q757470',
              'Racing Club': 'Q276533',
              'Estudiantes': 'Q214940',
              'Lanús': 'Q324589',
              'Tigre': 'Q80886',
              'Boca Juniors': 'Q170703',
              'Unión de Santa Fe': 'Q80899',
          }

          HISTORICAL_CLUB_ALIASES = {
              'Arsenal de Sarandí': ['Arsenal Fútbol Club', 'Arsenal de Sarandí', 'Arsenal Futbol Club'],
              'Patronato': ['Club Atlético Patronato', 'Club Atlético Patronato de la Juventud Católica', 'Patronato de Paraná'],
              'Colón': ['Club Atlético Colón', 'Colón de Santa Fe'],
              'Quilmes': ['Quilmes Atlético Club', 'Quilmes AC'],
              'Olimpo': ['Club Olimpo', 'Olimpo de Bahía Blanca'],
              'San Martín de San Juan': ['Club Atlético San Martín (San Juan)', 'San Martín de San Juan', 'CA San Martín de San Juan'],
              'Aldosivi': ['Club Atlético Aldosivi', 'Aldosivi'],
              'Temperley': ['Club Atlético Temperley', 'Temperley'],
              'Atlético de Rafaela': ['Asociación Mutual Social y Deportiva Atlético de Rafaela', 'Atlético de Rafaela', 'Atletico de Rafaela'],
          }

          SEASON_START = date(2016, 2, 5)
          SEASON_END = date(2016, 5, 29)
          API = 'https://www.wikidata.org/w/api.php'
          WDQS = 'https://query.wikidata.org/sparql'
          USER_AGENT = 'FootballIntelligence/0.1 (+https://github.com/franciscovitar/football-intelligence)'
          RETRYABLE = {429, 500, 502, 503, 504}
          ARGENTINA_QID = 'Q414'
          ASSOCIATION_FOOTBALL_CLUB_QID = 'Q476028'
          ASSOCIATION_FOOTBALL_QID = 'Q2736'
          GREGORIAN_QID = 'Q1985727'
          PAGE_SIZE = 1000
          MAX_PAGES_PER_CLUB = 2

          DECISION_HEURISTIC = {
              'A_viable': {
                  'all_30_clubs_min_compatible_players': 18,
                  'league_median_compatible_players': 22,
              },
              'B_enrichment': {
                  'clubs_with_at_least_5_compatible_players': 24,
                  'league_median_compatible_players': 8,
                  'min_profile_field_presence_ratio': 0.60,
              },
          }

          def request_json(url: str, *, accept: str = 'application/json', timeout: int = 45) -> dict:
              for attempt in range(1, 5):
                  req = urllib.request.Request(url, headers={'Accept': accept, 'User-Agent': USER_AGENT})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          payload = json.loads(response.read())
                          if not isinstance(payload, dict):
                              raise RuntimeError('remote response root is not an object')
                          return payload
                  except HTTPError as exc:
                      if exc.code not in RETRYABLE or attempt == 4:
                          raise
                      retry_after = exc.headers.get('Retry-After')
                      if retry_after and retry_after.isdigit():
                          delay = min(float(retry_after), 30.0)
                      else:
                          delay = min(5.0 * (2 ** (attempt - 1)), 30.0)
                      time.sleep(delay)
                  except (URLError, TimeoutError):
                      if attempt == 4:
                          raise
                      time.sleep(min(5.0 * (2 ** (attempt - 1)), 30.0))
              raise AssertionError('bounded request exhausted')

          def norm(value: str) -> str:
              decomposed = unicodedata.normalize('NFKD', value)
              folded = ''.join(ch for ch in decomposed if not unicodedata.combining(ch)).casefold()
              return re.sub(r'[^a-z0-9]+', ' ', folded).strip()

          def claim_item_qids(entity: dict, property_id: str) -> set[str]:
              claims = entity.get('claims')
              rows = claims.get(property_id) if isinstance(claims, dict) else None
              if not isinstance(rows, list):
                  return set()
              result = set()
              for row in rows:
                  if not isinstance(row, dict) or row.get('rank') == 'deprecated':
                      continue
                  mainsnak = row.get('mainsnak')
                  datavalue = mainsnak.get('datavalue') if isinstance(mainsnak, dict) else None
                  value = datavalue.get('value') if isinstance(datavalue, dict) else None
                  qid = value.get('id') if isinstance(value, dict) else None
                  if isinstance(qid, str) and qid.startswith('Q'):
                      result.add(qid)
              return result

          def entity_names(entity: dict) -> set[str]:
              names = set()
              for field in ('labels', 'aliases'):
                  container = entity.get(field)
                  if not isinstance(container, dict):
                      continue
                  for lang in ('es', 'en'):
                      raw = container.get(lang)
                      rows = raw if isinstance(raw, list) else [raw]
                      for row in rows:
                          value = row.get('value') if isinstance(row, dict) else None
                          if isinstance(value, str) and value.strip():
                              names.add(norm(value))
              return names

          def search_qids(query: str, language: str) -> set[str]:
              params = {
                  'action': 'wbsearchentities',
                  'search': query,
                  'language': language,
                  'uselang': language,
                  'type': 'item',
                  'limit': '20',
                  'format': 'json',
                  'formatversion': '2',
              }
              payload = request_json(f"{API}?{urllib.parse.urlencode(params)}")
              return {
                  row['id'] for row in payload.get('search', [])
                  if isinstance(row, dict) and isinstance(row.get('id'), str) and row['id'].startswith('Q')
              }

          def fetch_entities(qids: set[str], props: str = 'labels|aliases|claims') -> dict[str, dict]:
              result = {}
              ordered = sorted(qids)
              for offset in range(0, len(ordered), 50):
                  batch = ordered[offset:offset + 50]
                  params = {
                      'action': 'wbgetentities',
                      'ids': '|'.join(batch),
                      'props': props,
                      'languages': 'es|en',
                      'languagefallback': '1',
                      'format': 'json',
                      'formatversion': '2',
                  }
                  payload = request_json(f"{API}?{urllib.parse.urlencode(params)}")
                  entities = payload.get('entities')
                  if isinstance(entities, dict):
                      for qid, entity in entities.items():
                          if isinstance(qid, str) and isinstance(entity, dict):
                              result[qid] = entity
                  time.sleep(0.10)
              return result

          # Resolve only the nine historical clubs absent from the validated 2024 map.
          candidate_map = {}
          for club, aliases in HISTORICAL_CLUB_ALIASES.items():
              qids = set()
              for alias in aliases:
                  qids.update(search_qids(alias, 'es'))
                  qids.update(search_qids(alias, 'en'))
                  time.sleep(0.05)
              candidate_map[club] = qids
          candidates = fetch_entities(set().union(*candidate_map.values()))

          resolved_historical = {}
          club_resolution = []
          for club, aliases in HISTORICAL_CLUB_ALIASES.items():
              accepted = {norm(value) for value in aliases}
              validated = []
              exact_rejections = []
              for qid in sorted(candidate_map[club]):
                  entity = candidates.get(qid, {})
                  exact = bool(accepted & entity_names(entity))
                  country = ARGENTINA_QID in claim_item_qids(entity, 'P17')
                  p31 = claim_item_qids(entity, 'P31')
                  sport = claim_item_qids(entity, 'P641')
                  football = ASSOCIATION_FOOTBALL_CLUB_QID in p31 or ASSOCIATION_FOOTBALL_QID in sport
                  evidence = {'qid': qid, 'exact_alias': exact, 'argentina': country, 'football': football}
                  if exact and country and football:
                      validated.append(evidence)
                  elif exact:
                      exact_rejections.append(evidence)
              state = 'resolved' if len(validated) == 1 else ('ambiguous' if len(validated) > 1 else 'unresolved')
              qid = validated[0]['qid'] if state == 'resolved' else None
              club_resolution.append({
                  'club': club,
                  'state': state,
                  'qid': qid,
                  'validated_candidates': validated,
                  'exact_name_rejections': exact_rejections,
              })
              if qid:
                  resolved_historical[club] = qid

          unresolved = [row for row in club_resolution if row['state'] != 'resolved']
          if unresolved:
              raise RuntimeError(f'historical club resolution failed closed: {unresolved}')

          CLUBS = {**KNOWN_CLUBS, **resolved_historical}
          if len(CLUBS) != 30 or len(set(CLUBS.values())) != 30:
              raise RuntimeError(f'expected 30 unique club QIDs, got {len(CLUBS)} / {len(set(CLUBS.values()))}')

          def binding_value(row: dict, key: str) -> str | None:
              raw = row.get(key)
              value = raw.get('value') if isinstance(raw, dict) else None
              return value if isinstance(value, str) and value else None

          def qid_from_uri(value: str | None) -> str | None:
              if value is None:
                  return None
              candidate = value.rsplit('/', 1)[-1]
              return candidate if candidate.startswith('Q') and candidate[1:].isdigit() else None

          def time_key(row: dict, prefix: str) -> tuple[str, int, str] | None:
              raw_time = binding_value(row, prefix)
              raw_precision = binding_value(row, f'{prefix}Precision')
              calendar_qid = qid_from_uri(binding_value(row, f'{prefix}Calendar'))
              if raw_time is None or raw_precision is None or calendar_qid is None:
                  return None
              try:
                  precision = int(raw_precision)
              except ValueError:
                  return None
              return raw_time, precision, calendar_qid

          def date_bounds(value: tuple[str, int, str]) -> tuple[date, date] | None:
              raw_time, precision, calendar_qid = value
              if calendar_qid != GREGORIAN_QID or precision not in {9, 10, 11}:
                  return None
              try:
                  year = int(raw_time[0:4])
                  month = int(raw_time[5:7])
                  day = int(raw_time[8:10])
                  if precision == 9:
                      return date(year, 1, 1), date(year, 12, 31)
                  if precision == 10:
                      return date(year, month, 1), date(year, month, calendar.monthrange(year, month)[1])
                  exact = date(year, month, day)
                  return exact, exact
              except (ValueError, IndexError):
                  return None

          def discovery_query(team_qid: str, limit: int, offset: int) -> str:
              return f'''PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX p: <http://www.wikidata.org/prop/>
          PREFIX ps: <http://www.wikidata.org/prop/statement/>
          PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
          PREFIX pqv: <http://www.wikidata.org/prop/qualifier/value/>
          PREFIX wikibase: <http://wikiba.se/ontology#>
          SELECT ?player ?statement ?start ?startPrecision ?startCalendar ?end ?endPrecision ?endCalendar ?matches ?goals WHERE {{
            ?player p:P54 ?statement .
            ?statement ps:P54 wd:{team_qid} .
            FILTER NOT EXISTS {{ ?statement wikibase:rank wikibase:DeprecatedRank }}
            OPTIONAL {{
              ?statement pqv:P580 ?startNode .
              ?startNode wikibase:timeValue ?start ;
                         wikibase:timePrecision ?startPrecision ;
                         wikibase:timeCalendarModel ?startCalendar .
            }}
            OPTIONAL {{
              ?statement pqv:P582 ?endNode .
              ?endNode wikibase:timeValue ?end ;
                       wikibase:timePrecision ?endPrecision ;
                       wikibase:timeCalendarModel ?endCalendar .
            }}
            OPTIONAL {{ ?statement pq:P1350 ?matches . }}
            OPTIONAL {{ ?statement pq:P1351 ?goals . }}
          }}
          ORDER BY ?statement ?start ?end
          LIMIT {limit}
          OFFSET {offset}'''

          statements_by_club = {}
          rows_by_club = {}
          truncated = []
          for club, qid in CLUBS.items():
              statements = {}
              row_count = 0
              for page in range(MAX_PAGES_PER_CLUB):
                  query = discovery_query(qid, PAGE_SIZE, page * PAGE_SIZE)
                  url = f"{WDQS}?{urllib.parse.urlencode({'query': query, 'format': 'json'})}"
                  payload = request_json(url, timeout=60)
                  results = payload.get('results')
                  bindings = results.get('bindings') if isinstance(results, dict) else None
                  if not isinstance(bindings, list):
                      raise RuntimeError(f'WDQS returned no bindings for {club}')
                  row_count += len(bindings)
                  for row in bindings:
                      if not isinstance(row, dict):
                          continue
                      player_qid = qid_from_uri(binding_value(row, 'player'))
                      statement_uri = binding_value(row, 'statement')
                      if not player_qid or not statement_uri:
                          continue
                      st = statements.setdefault(statement_uri, {
                          'player_qid': player_qid,
                          'starts': set(),
                          'ends': set(),
                          'matches': set(),
                          'goals': set(),
                      })
                      if st['player_qid'] != player_qid:
                          raise RuntimeError(f'statement maps to multiple players: {statement_uri}')
                      if (value := time_key(row, 'start')) is not None:
                          st['starts'].add(value)
                      if (value := time_key(row, 'end')) is not None:
                          st['ends'].add(value)
                      if (value := binding_value(row, 'matches')) is not None:
                          st['matches'].add(value)
                      if (value := binding_value(row, 'goals')) is not None:
                          st['goals'].add(value)
                  if len(bindings) < PAGE_SIZE:
                      break
                  time.sleep(0.15)
              else:
                  truncated.append(club)
              statements_by_club[club] = statements
              rows_by_club[club] = row_count
              time.sleep(0.15)

          if truncated:
              raise RuntimeError(f'WDQS pagination cap reached: {truncated}')

          def classify(st: dict) -> str:
              if len(st['starts']) != 1 or len(st['ends']) != 1:
                  return 'insufficient_temporal_evidence'
              start_bounds = date_bounds(next(iter(st['starts'])))
              end_bounds = date_bounds(next(iter(st['ends'])))
              if start_bounds is None or end_bounds is None:
                  return 'insufficient_temporal_evidence'
              start_low, start_high = start_bounds
              end_low, end_high = end_bounds
              if start_low > end_high:
                  return 'insufficient_temporal_evidence'
              if start_high <= SEASON_END and end_low >= SEASON_START:
                  return 'guaranteed_overlap_2016'
              if start_low > SEASON_END or end_high < SEASON_START:
                  return 'definitely_outside_2016'
              return 'temporally_ambiguous_2016'

          all_compatible_qids = set()
          per_club = []
          statement_classes_by_club = {}
          for club, statements in statements_by_club.items():
              classes = defaultdict(int)
              player_classes = defaultdict(set)
              player_statement_counts = defaultdict(int)
              compatible_with_matches = set()
              compatible_with_goals = set()
              compatible_match_values = 0
              compatible_goal_values = 0
              for st in statements.values():
                  cls = classify(st)
                  classes[cls] += 1
                  player_qid = st['player_qid']
                  player_classes[player_qid].add(cls)
                  player_statement_counts[player_qid] += 1
                  if cls == 'guaranteed_overlap_2016':
                      all_compatible_qids.add(player_qid)
                      if st['matches']:
                          compatible_with_matches.add(player_qid)
                          compatible_match_values += 1
                      if st['goals']:
                          compatible_with_goals.add(player_qid)
                          compatible_goal_values += 1
              statement_classes_by_club[club] = (classes, player_classes, player_statement_counts)
              compatible = {qid for qid, vals in player_classes.items() if 'guaranteed_overlap_2016' in vals}
              ambiguous = {
                  qid for qid, vals in player_classes.items()
                  if 'guaranteed_overlap_2016' not in vals and 'temporally_ambiguous_2016' in vals
              }
              insufficient = {
                  qid for qid, vals in player_classes.items()
                  if 'guaranteed_overlap_2016' not in vals
                  and 'temporally_ambiguous_2016' not in vals
                  and 'insufficient_temporal_evidence' in vals
              }
              per_club.append({
                  'club': club,
                  'team_qid': CLUBS[club],
                  'wdqs_rows': rows_by_club[club],
                  'players_discovered': len(player_classes),
                  'memberships_total': len(statements),
                  'memberships_temporally_bounded': classes['guaranteed_overlap_2016'] + classes['definitely_outside_2016'] + classes['temporally_ambiguous_2016'],
                  'memberships_guaranteed_overlap_2016': classes['guaranteed_overlap_2016'],
                  'memberships_definitely_outside_2016': classes['definitely_outside_2016'],
                  'memberships_temporally_ambiguous_2016': classes['temporally_ambiguous_2016'],
                  'memberships_insufficient_temporal_evidence': classes['insufficient_temporal_evidence'],
                  'players_compatible_2016': len(compatible),
                  'players_temporally_ambiguous_2016': len(ambiguous),
                  'players_insufficient_temporal_evidence': len(insufficient),
                  'players_multiple_membership_statements': sum(v > 1 for v in player_statement_counts.values()),
                  'compatible_players_with_p1350_matches': len(compatible_with_matches),
                  'compatible_players_with_p1351_goals': len(compatible_with_goals),
                  'compatible_statements_with_p1350_matches': compatible_match_values,
                  'compatible_statements_with_p1351_goals': compatible_goal_values,
              })

          # Profile presence on only the temporally compatible QIDs.
          compatible_entities = fetch_entities(all_compatible_qids, props='claims') if all_compatible_qids else {}
          def has_claim(entity: dict, prop: str) -> bool:
              claims = entity.get('claims')
              rows = claims.get(prop) if isinstance(claims, dict) else None
              return isinstance(rows, list) and any(isinstance(r, dict) and r.get('rank') != 'deprecated' for r in rows)

          profile_presence = {
              'dob': sum(has_claim(compatible_entities.get(qid, {}), 'P569') for qid in all_compatible_qids),
              'position': sum(has_claim(compatible_entities.get(qid, {}), 'P413') for qid in all_compatible_qids),
              'citizenship': sum(has_claim(compatible_entities.get(qid, {}), 'P27') for qid in all_compatible_qids),
              'height': sum(has_claim(compatible_entities.get(qid, {}), 'P2048') for qid in all_compatible_qids),
          }
          denominator = len(all_compatible_qids)
          profile_ratios = {key: (value / denominator if denominator else 0.0) for key, value in profile_presence.items()}

          counts = [row['players_compatible_2016'] for row in per_club]
          clubs_ge_5 = sum(value >= 5 for value in counts)
          clubs_ge_18 = sum(value >= 18 for value in counts)
          median = statistics.median(counts) if counts else 0.0

          if clubs_ge_18 == 30 and median >= 22:
              decision = 'A_viable'
          elif clubs_ge_5 >= 24 and median >= 8 and min(profile_ratios.values(), default=0.0) >= 0.60:
              decision = 'B_enrichment'
          else:
              decision = 'C_insufficient'

          aggregate = {
              'clubs': 30,
              'unique_players_discovered': len(set().union(*[
                  {st['player_qid'] for st in statements.values()} for statements in statements_by_club.values()
              ])),
              'unique_players_compatible_2016': len(all_compatible_qids),
              'players_compatible_2016_per_club': {
                  'min': min(counts) if counts else 0,
                  'median': median,
                  'max': max(counts) if counts else 0,
              },
              'clubs_with_at_least_5_compatible_players': clubs_ge_5,
              'clubs_with_at_least_18_compatible_players': clubs_ge_18,
              'memberships_total': sum(row['memberships_total'] for row in per_club),
              'memberships_temporally_bounded': sum(row['memberships_temporally_bounded'] for row in per_club),
              'memberships_guaranteed_overlap_2016': sum(row['memberships_guaranteed_overlap_2016'] for row in per_club),
              'memberships_temporally_ambiguous_2016': sum(row['memberships_temporally_ambiguous_2016'] for row in per_club),
              'memberships_insufficient_temporal_evidence': sum(row['memberships_insufficient_temporal_evidence'] for row in per_club),
              'compatible_players_with_p1350_matches_sum_by_club': sum(row['compatible_players_with_p1350_matches'] for row in per_club),
              'compatible_players_with_p1351_goals_sum_by_club': sum(row['compatible_players_with_p1351_goals'] for row in per_club),
              'compatible_profile_presence': profile_presence,
              'compatible_profile_presence_ratio': profile_ratios,
          }

          report = {
              'lab': 'wikidata-arg-lpf-2016-roster-feasibility',
              'competition': 'ARG_LPF',
              'season': '2016',
              'season_window': {'start': SEASON_START.isoformat(), 'end': SEASON_END.isoformat()},
              'source_clubs': 30,
              'club_resolution': {
                  'reused_validated_qids_from_2024_lab': len(KNOWN_CLUBS),
                  'historical_clubs_resolved_this_run': len(resolved_historical),
                  'historical_resolution_results': club_resolution,
                  'club_qids': CLUBS,
              },
              'decision_heuristic': DECISION_HEURISTIC,
              'decision': decision,
              'aggregate': aggregate,
              'per_club': sorted(per_club, key=lambda row: row['club']),
              'limitations': [
                  'P54 evidence is counted only when temporal qualifiers guarantee overlap with 2016-02-05..2016-05-29.',
                  'Year-only boundaries that merely make overlap possible remain temporally ambiguous.',
                  'P1350/P1351 on a compatible membership are preserved as source-local evidence; they are not automatically assumed to equal this league phase unless the statement scope proves it.',
                  'No PlayerCrosswalk, PostgreSQL write, or product promotion is performed.',
              ],
          }

          path = os.environ['REPORT_PATH']
          with open(path, 'w', encoding='utf-8') as fh:
              json.dump(report, fh, indent=2, ensure_ascii=False, sort_keys=True)
          print(json.dumps({'decision': decision, 'aggregate': aggregate, 'club_resolution': report['club_resolution']}, indent=2, ensure_ascii=False))
          PY

      - name: Upload bounded audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-arg-lpf-2016-roster-feasibility
          path: ${{ runner.temp }}/wikidata-arg-lpf-2016-roster-feasibility.json
          if-no-files-found: error
          retention-days: 30
