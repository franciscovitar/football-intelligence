name: Temporary Apply Wyscout v0.4 Recertification

on:
  push:
    branches:
      - feat/wyscout-final-third-v04

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feat/wyscout-final-third-v04
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Sync analytics environment
        working-directory: analytics
        run: uv sync --dev --locked

      - name: Apply evidence-backed recertification and docs
        run: |
          sed -i 's/A metric under `fi-wyscout-spatial-v1.1` is promotable/A metric under `fi-wyscout-spatial-v1.2` is promotable/g' scripts/tmp_apply_wyscout_v04_recertification.py
          python scripts/tmp_apply_wyscout_v04_recertification.py

      - name: Format lint typecheck and test analytics
        working-directory: analytics
        run: |
          uv run ruff format src tests
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

      - name: Remove temporary helpers and commit product state
        run: |
          git rm .github/workflows/tmp-apply-wyscout-v04-recertification.yml scripts/tmp_apply_wyscout_v04_recertification.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics docs
          git diff --cached --check
          git commit -m "fix: recertify Wyscout v0.4 evidence boundaries"
          git push origin HEAD:feat/wyscout-final-third-v04
